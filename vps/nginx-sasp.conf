# /etc/nginx/sites-available/sasp
#
# Deux noms, comme aujourd'hui : le site d'un cote, l'API de l'autre. Le
# Worker repond sur des dizaines de chemins racine (/log, /health, /ftf/...,
# /sync-...), il ne peut donc pas vivre sous un simple prefixe /api.

# ── le site ──────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/sasp;
    index index.html;

    # index.html est la racine du poste de travail. Il ne doit jamais etre
    # mis en cache : c'est lui qui porte le ?v= des autres fichiers.
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /pa.html    { add_header Cache-Control "no-store"; }

    location / { try_files $uri $uri/ =404; }

    access_log /var/log/nginx/sasp-site.log;
}

# ── l'API et le bot ──────────────────────────────────────────────────
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Les photos de convocation FTF passent en base64 dans le corps, et un
    # tableau AEGIS peut peser plusieurs megaoctets.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/sasp-api.log;
}

