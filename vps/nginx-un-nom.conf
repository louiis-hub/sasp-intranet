# /etc/nginx/sites-available/sasp
#
# Variante a UN SEUL nom, pour un sous-domaine ou l'on ne peut pas creer
# de « api.quelque-chose ». Le site et l'API partagent le nom, departages
# par le chemin.
#
# C'est possible parce que le Worker n'ecoute que sur dix-neuf chemins
# racine, tous enumeres ci-dessous, et qu'aucun ne heurte un fichier du
# site. Discord, en particulier, tape sur /interactions et non sur /.
#
# Remplacer DOMAINE partout, puis :
#   sudo certbot --nginx -d DOMAINE

server {
    listen 80;
    listen [::]:80;
    server_name DOMAINE;

    root /var/www/sasp;
    index index.html;

    # Les convocations FTF passent en base64 dans le corps, et un tableau
    # AEGIS peut peser plusieurs megaoctets.
    client_max_body_size 12m;

    # ── l'API et le bot ──────────────────────────────────────────────
    # Une location regex prime sur les prefixes : ces chemins partent au
    # Worker avant que try_files ne cherche un fichier du meme nom.
    # Le (/|$) final evite qu'un futur /apidoc parte par erreur.
    location ~ ^/(interactions|health|log|admin|api|auth|discord|ftf|clockout-agent|clockout-all|get-member-roles|grade-role-counts|post-pointeuse|refresh-pointeuse|strip-member-roles|sync-all-agents|sync-all-from-discord|sync-member-roles|update-agent-list)(/|$) {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ── le site ──────────────────────────────────────────────────────
    # Ces deux pages portent le ?v= des autres fichiers : les mettre en
    # cache reviendrait a figer tout le reste.
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /pa.html    { add_header Cache-Control "no-store"; }

    location / { try_files $uri $uri/ =404; }

    access_log /var/log/nginx/sasp.log;
}
