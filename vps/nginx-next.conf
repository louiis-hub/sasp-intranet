# /etc/nginx/sites-available/sasp
#
# Variante Next.js. Trois etages :
#   - les chemins du Worker partent en 8787 ;
#   - tout le reste part a Next, en 3000, y compris les pages actuelles
#     qu'il sert depuis son dossier public/.
#
# Faire passer les pages par Next plutot que par nginx est ce qui rendra
# la protection reelle possible : un middleware ne peut refuser une page
# qu'il sert lui-meme.
#
# Remplacer DOMAINE, puis : sudo certbot --nginx -d DOMAINE

server {
    listen 80;
    listen [::]:80;
    server_name DOMAINE;

    client_max_body_size 12m;

    # ── l'API et le bot ──────────────────────────────────────────────
    # Une location regex prime sur les prefixes : ces chemins partent au
    # Worker avant que Next ne les voie.
    location ~ ^/(interactions|health|log|admin|api|auth|discord|ftf|clockout-agent|clockout-all|get-member-roles|grade-role-counts|post-pointeuse|refresh-pointeuse|strip-member-roles|sync-all-agents|sync-all-from-discord|sync-member-roles|update-agent-list)(/|$) {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ── le site, servi par Next ──────────────────────────────────────
    # La racine porte le ?v= de tous les autres fichiers. Next lui met
    # « public, max-age=0 » parce que sa regle d'en-tetes voit « / » avant
    # la reecriture vers index.html. On tranche ici, ou nginx a le dernier
    # mot : proxy_hide_header d'abord, sinon les deux en-tetes coexistent.
    location = / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Le rechargement a chaud et les futures liaisons temps reel
        # passent par une connexion montee en WebSocket.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/sasp.log;
}
