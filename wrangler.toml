name = "sasp-intranet-bot"
main = "worker.js"
compatibility_date = "2024-01-01"

[vars]
# Synchro Discord -> intranet sur le cron 15 min. Mettre "0" pour la couper.
AUTO_ROLE_SYNC = "1"
# Salon et message de la pointeuse. Les deux vont de pair : le message doit
# exister dans ce salon, sinon le rafraichissement toutes les 15 min echoue.
POINTEUSE_CHANNEL_ID = "1515025043472650281"
POINTEUSE_MESSAGE_ID = "1542935975431249921"
# Salon ou le Command Staff recoit les demandes de recuperation d heures.
POINTEUSE_CLAIM_CHANNEL_ID = "1533451858209931477"
PLAINTESASP_CHANNEL_ID = "1538289329917534328"

[triggers]
# Le 31 aout 2026, les taches periodiques sont passees sur le VPS, ou
# CRONS=1 les declenche. Les laisser ici aussi ferait tout partir deux
# fois : messages prives, edition de la pointeuse, ecriture des roles
# dans Supabase, rapport de synchronisation, renommages.
#
# Le Worker reste deploye, mais muet : c est le retour en arriere le plus
# simple si le VPS defaille. Pour le reactiver, remettre les deux crons
# ci-dessous ET repasser CRONS=0 sur le VPS.
#   crons = ["0 18 * * SUN", "*/15 * * * *"]
crons = []
