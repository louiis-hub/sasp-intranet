  $('#gtools').innerHTML=`
    <button class="btn sm pri" id="bAdd" ${w}>${svg(I.plus,13)}Ajouter un élément</button>
    <button class="btn sm" id="bLink" ${w}>${svg(I.link,13)}Créer une liaison</button>
    <button class="btn sm" id="bGroup" ${w}>${svg(I.grp,13)}Regrouper</button>
    <button class="btn sm" id="bShow">${svg(I.eye,13)}Tout afficher</button>`;
  $('#gright').innerHTML=`
    <button class="btn sm" id="bPng">${svg(I.dl,13)}PNG</button>
    <button class="btn sm" id="bPdf">${svg(I.print,13)}PDF</button>
    <button class="btn sm" id="bFs">${svg(I.max,13)}Plein écran</button>
    <button class="btn sm" id="bRel" title="Recharger depuis le serveur">${svg(I.undo,13)}</button>`;
  $('#gzoom').innerHTML=`
    <button class="btn" id="bZi" title="Zoom avant">${svg(I.zin,15)}</button>
    <button class="btn" id="bZo" title="Zoom arrière">${svg(I.zout,15)}</button>
    <button class="btn" id="bFit" title="Recentrer">${svg(I.fit,15)}</button>`;
  $('#bAdd').onclick=()=>addDlg();
  $('#bLink').onclick=()=>startLink();
  $('#bGroup').onclick=autoGroup;
  $('#bShow').onclick=()=>{S.hidden.clear();S.collapsed.clear();render();toast('Filtres réinitialisés','','ok')};
  $('#lgToggle').onclick=e=>{e.stopPropagation();legendToggle()};
  $('#lgHead').onclick=()=>legendToggle();
  let lgs=null; try{lgs=localStorage.getItem('sasp.liaisons.legende')}catch(e){}
  legendToggle(lgs==='min');
  $('#bPng').onclick=exportPng;
  $('#bPdf').onclick=()=>{toast('Export PDF','Ouverture de l\'impression…');setTimeout(()=>window.print(),400)};
  $('#bFs').onclick=()=>{const b=$('#board');
    if(!document.fullscreenElement)b.requestFullscreen?.();else document.exitFullscreen?.()};
  $('#bRel').onclick=()=>confirmDlg('Recharger le tableau',
    'La version enregistrée sur le serveur sera rechargée. Vos modifications non enregistrées seront perdues.',
    'Recharger',()=>demarrer());
  $('#bZi').onclick=()=>zoomBy(1.2);$('#bZo').onclick=()=>zoomBy(1/1.2);$('#bFit').onclick=()=>fitView();
  $('#help').onclick=aide;
}
/* pan / zoom */
function bindBoard(){
  const b=$('#board');let pan=false,px,py;
  b.addEventListener('mousedown',e=>{
    if(e.target.closest('.node')||e.target.closest('.btn')||e.target.closest('.inspect')||e.target.closest('.legend'))return;
    if(e.button!==0&&e.button!==1)return;
    pan=true;px=e.clientX-S.tx;py=e.clientY-S.ty;b.style.cursor='grabbing';deselect();
  });
  window.addEventListener('mousemove',e=>{if(!pan)return;S.tx=e.clientX-px;S.ty=e.clientY-py;applyView()});
  window.addEventListener('mouseup',()=>{if(pan){pan=false;b.style.cursor='';sauverVue()}});
  b.addEventListener('wheel',e=>{
    e.preventDefault();
    const r=b.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
    const f=e.deltaY<0?1.12:1/1.12,ns=Math.min(2.6,Math.max(.2,S.scale*f));
    S.tx=mx-(mx-S.tx)*(ns/S.scale);S.ty=my-(my-S.ty)*(ns/S.scale);S.scale=ns;applyView();sauverVue();
  },{passive:false});
  b.addEventListener('contextmenu',e=>{
    if(e.target.closest('.node'))return;
    e.preventDefault();
    ctxMenu(e.clientX,e.clientY,[{hd:'Tableau de liaisons'},
      ...(MOI.ecriture?[{l:'Ajouter un élément',i:I.plus,k:'A',fn:()=>addDlg()},
      {l:'Créer une liaison',i:I.link,k:'L',fn:()=>startLink()}]:[]),
      {l:'Recentrer la vue',i:I.fit,k:'F',fn:()=>fitView()},
      ...(MOI.ecriture?[{l:'Regrouper par type',i:I.grp,fn:autoGroup}]:[]),'-',
      {l:'Exporter en image',i:I.dl,fn:exportPng}]);
  });
  window.addEventListener('resize',()=>{if(ROUTE==='board')fitView(true)});
}
/* recherche sur le tableau */
function bindSearch(){
  const q=$('#q'),sg=$('#sugg');
  const run=()=>{
    const v=q.value.trim().toLowerCase();
    S.hits.clear();
    if(!v){sg.style.display='none';render();return}
    const res=S.nodes.filter(n=>(titleOf(n)+' '+sch(n.t).l+' '+Object.values(n.d||{}).join(' ')).toLowerCase().includes(v));
    res.forEach(n=>S.hits.add(n.id));
    render();
    sg.innerHTML=res.slice(0,10).map(n=>`<div data-id="${n.id}"><span style="color:${sch(n.t).c}">${svg(sch(n.t).i,14)}</span>
      <span>${esc(titleOf(n))}</span><span class="m">${esc(sch(n.t).l)}</span></div>`).join('')
      ||'<div class="muted" style="cursor:default">Aucun résultat sur ce tableau</div>';
    sg.style.display='block';
    $$('#sugg [data-id]').forEach(r=>r.onclick=()=>{
      const n=node(r.dataset.id),rc=$('#board').getBoundingClientRect();
      location.hash='#/board';
      S.scale=Math.max(S.scale,.9);S.tx=rc.width/2-n.x*S.scale-170;S.ty=rc.height/2-n.y*S.scale;
      applyView();selectNode(n.id);sg.style.display='none';
    });
  };
  q.addEventListener('input',run);
  q.addEventListener('keydown',e=>{if(e.key==='Escape'){q.value='';run();q.blur()}});
  document.addEventListener('click',e=>{if(!e.target.closest('.tsearch'))sg.style.display='none'});
}
/* raccourcis */
function bindClavier(){
  document.addEventListener('keydown',e=>{
    if($('#gate').classList.contains('on'))return;
    const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable;
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#q').focus();return}
    if(typing)return;
    const k=e.key.toLowerCase();
    if(e.key==='Escape'){deselect();$('#board').classList.remove('linkmode');S.linkFrom=null;return}
    if(k==='a'){e.preventDefault();addDlg();return}
    if(k==='l'){startLink();return}
    if(k==='f'){fitView();return}
    if(k==='g'){if(MOI.ecriture)autoGroup();return}
    if(k==='r'){S.hidden.clear();S.collapsed.clear();render();return}
    if(k==='t'){legendToggle();return}
    if(k==='+'||k==='='){zoomBy(1.2);return}
    if(k==='-'){zoomBy(1/1.2);return}
    if(e.key==='Delete'&&S.sel&&MOI.ecriture){const n=node(S.sel);
      confirmDlg('Supprimer l\'élément',`<b>${esc(titleOf(n))}</b> et ses liaisons seront supprimés.`,'Supprimer',()=>{
        logAct('Suppression d\'élément',sch(n.t).l+' · '+titleOf(n));
        S.edges=S.edges.filter(x=>x.a!==n.id&&x.b!==n.id);S.nodes=S.nodes.filter(x=>x.id!==n.id);
        deselect();render();save('Élément supprimé')},true)}
  });
}

  body:`<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">

    ${[['Molette','Zoom avant / arrière'],['Glisser le fond','Déplacer la vue'],['Glisser un élément','Repositionner'],
       ['Clic','Ouvrir la fiche'],['Clic droit','Menu contextuel'],['Clic sur un lien','Modifier la liaison']]
      .map(([a,b])=>`<div style="display:flex;gap:10px;padding:5px 0;border-bottom:1px solid #C9B383"><span class="kbd">${a}</span><span style="font-size:12.5px">${b}</span></div>`).join('')}</div>
    <div><div class="lbl" style="margin-bottom:8px">Clavier</div>
    ${[['A','Ajouter un élément'],['L','Créer une liaison'],['F','Recentrer'],['G','Regrouper par type'],
       ['R','Tout réafficher'],['T','Afficher / masquer la légende'],['Suppr','Supprimer la sélection'],
       ['Ctrl K','Rechercher'],['Échap','Désélectionner']]
      .map(([a,b])=>`<div style="display:flex;gap:10px;padding:5px 0;border-bottom:1px solid #C9B383"><span class="kbd">${a}</span><span style="font-size:12.5px">${b}</span></div>`).join('')}</div></div>
    <div class="lbl" style="margin-top:16px">Champs ou liaison ?</div>
    <p style="font-size:12.5px;color:var(--ink2);line-height:1.6;margin:6px 0 0">
    Les champs ne portent que ce qui appartient à l'élément lui-même : un véhicule a une plaque, une marque, un modèle, une couleur, un VIN, un état de fichier ; un téléphone a un numéro, un opérateur, un IMEI, un bornage dominant ; une preuve a un scellé, une quantité, un stockage, une chaîne de traçabilité.</p>
    <p style="font-size:12.5px;color:var(--ink2);line-height:1.6;margin:8px 0 0">
    Tout ce qui désigne un autre élément — propriétaire, chef, titulaire, détenteur, lieu de découverte, agent, cible d'un mandat — se crée en liaison. Ajoutez l'élément, puis reliez-le : l'information reste visible sur le tableau au lieu d'être enfermée dans une fiche.</p>

    <p style="font-size:12.5px;color:var(--ink2);line-height:1.6;margin:6px 0 0">
    Chaque ouverture du tableau, chaque création, modification et suppression est enregistrée côté serveur avec votre nom, votre identifiant Discord, votre rôle, la date et votre adresse IP. Le journal est consultable dans Supervision et ne peut pas être effacé depuis le site.</p>`});
}
