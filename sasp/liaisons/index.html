<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AEGIS — Outil d'enquête · SASP SUD</title>
<link rel="icon" href="../../assets/sasp-sud-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Special+Elite&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  /* liège et bois */
  --cork:#C79B62; --cork-d:#A87C46; --wood:#6B4423; --wood-d:#3E2612; --wood-l:#8B5E34;
  /* papiers */
  --paper:#FBF6E9; --paper2:#F1E9D6; --manila:#E6D6AE; --manila-d:#D7C295; --kraft:#CDB58B;
  /* encres */
  --ink:#241F19; --ink2:#4A4038; --ink3:#7A6E5C; --ink4:#9C8E78;
  --line:#D9CDB2; --line2:#C4B492; --line3:#A8926B;
  /* accents */
  --red:#A8221B; --red-d:#7C1712; --amber:#C0761A; --green:#3E7A4E; --blue:#1E5C8C;
  --steel:#1E5C8C;
  --rad:2px;
  --f-ui:"Special Elite","Courier New",monospace;
  --f-hand:"Caveat","Bradley Hand",cursive;
  --f-body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:#2A1B0E;color:var(--ink);font-family:var(--f-body);font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow:hidden}
::selection{background:#F2D98A;color:#241F19}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:1px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--manila-d)}
::-webkit-scrollbar-thumb{background:var(--kraft);border:2px solid var(--manila-d);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#B79C6E}

/* ---------- bandeaux ---------- */
.clsbar{position:fixed;left:0;right:0;height:20px;z-index:60;display:flex;align-items:center;justify-content:center;
  font-family:var(--f-ui);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#F0D9A8;
  background:linear-gradient(180deg,#4A2E15,#33200E);border-bottom:1px solid #23150A;
  box-shadow:0 1px 0 rgba(255,220,170,.12) inset}
.clsbar.bot{bottom:0;top:auto;border-bottom:0;border-top:1px solid #23150A}
.clsbar .dot{width:5px;height:5px;border-radius:50%;background:#C0392B;margin:0 10px;animation:pulse 2.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- barre du haut (bois) ---------- */
.topbar{position:fixed;top:20px;left:0;right:0;height:52px;z-index:40;display:flex;align-items:center;gap:14px;padding:0 14px;
  background:linear-gradient(180deg,#7A5029,#5A3A1C 60%,#4A2E15);
  border-bottom:2px solid #2E1C0C;box-shadow:0 3px 12px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,214,160,.22)}
.brand{display:flex;gap:10px;align-items:center;padding-right:14px;border-right:1px solid rgba(255,220,170,.2);
  text-decoration:none}
.brand img{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.brand b{display:block;font-family:var(--f-ui);font-size:15px;letter-spacing:.1em;color:#FBEBCD;line-height:1.1}
.brand span{display:block;font-family:var(--f-mono);font-size:8.5px;letter-spacing:.13em;color:#C9A876;text-transform:uppercase}
.dossier{display:flex;flex-direction:column;min-width:0}
.dossier b{font-family:var(--f-ui);font-size:15px;color:#FBEBCD;line-height:1.2;white-space:nowrap}
.dossier span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.11em;color:#C9A876;text-transform:uppercase}
.tsearch{margin-left:auto;position:relative;width:min(300px,30vw)}
.tsearch input{width:100%;background:var(--paper);border:1px solid #8A6A3E;border-radius:var(--rad);padding:6px 10px 6px 29px;
  font-family:var(--f-mono);font-size:11.5px;color:var(--ink);box-shadow:inset 0 1px 3px rgba(90,60,20,.25)}
.tsearch input::placeholder{color:var(--ink4)}
.tsearch input:focus{outline:none;border-color:var(--red);background:#fff}
.tsearch .ic{position:absolute;left:9px;top:7px;color:var(--ink4)}
.sugg{position:absolute;top:34px;left:0;right:0;background:var(--paper);border:1px solid #9C7A48;border-radius:var(--rad);
  box-shadow:0 16px 34px rgba(0,0,0,.5);max-height:300px;overflow:auto;z-index:50;display:none}
.sugg div{display:flex;gap:8px;align-items:center;padding:6px 10px;cursor:pointer;font-size:12.5px;color:var(--ink)}
.sugg div:hover{background:#F2D98A}
.sugg .m{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--ink3)}
.me{display:flex;align-items:center;gap:9px;padding-left:12px;border-left:1px solid rgba(255,220,170,.2);white-space:nowrap}
.me .av{width:28px;height:28px;border-radius:2px;background:#8B5E34;display:grid;place-items:center;
  font-family:var(--f-ui);font-size:11px;color:#FBEBCD;border:1px solid #A87C46;overflow:hidden}
.me .av img{width:100%;height:100%;object-fit:cover}
.me i{font-style:normal;display:block;font-family:var(--f-ui);font-size:12.5px;color:#FBEBCD;line-height:1.15}
.me s{text-decoration:none;display:block;font-family:var(--f-mono);font-size:9px;color:#C9A876;letter-spacing:.1em;text-transform:uppercase}

/* ---------- boutons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(180deg,#FBF6E9,#EDE2C9);
  border:1px solid #A68B5B;color:var(--ink);
  padding:6px 11px;border-radius:var(--rad);font-family:var(--f-ui);font-size:12px;cursor:pointer;
  box-shadow:0 2px 4px rgba(50,30,8,.3);transition:transform .08s,box-shadow .12s,background .12s;white-space:nowrap}
.btn:hover{background:linear-gradient(180deg,#fff,#F3E9D2);box-shadow:0 3px 7px rgba(50,30,8,.36)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 2px rgba(50,30,8,.3)}
.btn.pri{background:linear-gradient(180deg,#B8322A,#8E1F19);border-color:#6E140F;color:#FBEBCD}
.btn.pri:hover{background:linear-gradient(180deg,#C63A31,#9B241D)}
.btn.dgr{background:linear-gradient(180deg,#5E3A1B,#42260E);border-color:#2E1A08;color:#F0D9A8}
.btn.sm{padding:4px 8px;font-size:11px}
.btn.on{background:linear-gradient(180deg,#F2D98A,#E0C167);border-color:#A68B5B}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tbtn{width:30px;height:30px;display:grid;place-items:center;background:transparent;border:1px solid transparent;
  border-radius:var(--rad);cursor:pointer;color:#C9A876}
.tbtn:hover{background:rgba(255,230,190,.14);color:#FBEBCD;border-color:rgba(255,220,170,.28)}
.kbd{font-family:var(--f-mono);font-size:9.5px;color:var(--ink2);border:1px solid var(--line2);border-bottom-width:2px;
  border-radius:3px;padding:1px 5px;background:var(--paper2)}
.lbl{font-family:var(--f-ui);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.mono{font-family:var(--f-mono)}
.muted{color:var(--ink3)}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;padding:2px 6px;border-radius:2px;border:1px solid;white-space:nowrap}
.t-red{color:#7C1712;background:#F3D6D2;border-color:#C08079}
.t-amb{color:#7A4A0C;background:#F6E5C4;border-color:#C9A96A}
.t-grn{color:#245234;background:#D8EBD8;border-color:#8DBB96}
.t-gry{color:var(--ink3);background:var(--paper2);border-color:var(--line2)}
.meter{height:5px;background:var(--paper2);border-radius:2px;overflow:hidden;border:1px solid var(--line2)}
.meter i{display:block;height:100%;background:var(--blue)}
.meter i.r{background:var(--red)}.meter i.a{background:var(--amber)}.meter i.g{background:var(--green)}

/* ---------- panneau de liège ---------- */
#board{position:fixed;top:72px;left:0;right:0;bottom:20px;overflow:hidden;
  background-color:var(--cork);
  background-image:
    radial-gradient(rgba(92,58,24,.20) 1.1px, transparent 1.3px),
    radial-gradient(rgba(158,110,58,.34) 1.7px, transparent 2px),
    radial-gradient(rgba(70,44,18,.13) 2.5px, transparent 2.9px),
    radial-gradient(rgba(210,168,112,.25) 1.3px, transparent 1.6px);
  background-size:13px 13px,23px 23px,37px 37px,53px 53px;
  background-position:0 0,7px 11px,19px 5px,31px 27px}
#board:fullscreen{top:0;bottom:0;left:0}
.frame{position:absolute;inset:0;pointer-events:none;z-index:7;
  border:16px solid #6B4423;
  border-image:linear-gradient(140deg,#A87244,#5E3A1B 32%,#8B5E34 58%,#452A11) 1;
  box-shadow:inset 0 0 0 1px rgba(255,225,180,.22), inset 0 0 70px rgba(60,34,8,.45),
             inset 0 0 0 17px rgba(0,0,0,.25)}
.frame:before{content:"";position:absolute;inset:-16px;border:16px solid transparent;
  box-shadow:inset 0 3px 6px rgba(255,220,170,.18), inset 0 -3px 8px rgba(0,0,0,.4)}
#gworld{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#gedges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}

/* ---------- fiches épinglées ---------- */
.node{position:absolute;width:176px;transform:translate(-50%,-50%) rotate(var(--rot,0deg));
  background:var(--paper);color:var(--ink);border-radius:1px;cursor:grab;user-select:none;padding:9px 9px 8px;
  box-shadow:0 7px 14px rgba(50,28,6,.38), 0 2px 3px rgba(0,0,0,.25);
  transition:box-shadow .14s,filter .14s}
.node:hover{box-shadow:0 11px 22px rgba(50,28,6,.45), 0 2px 3px rgba(0,0,0,.3)}
.node.sel{transform:translate(-50%,-50%) rotate(0deg) scale(1.03);z-index:20;
  box-shadow:0 0 0 2px var(--red), 0 16px 30px rgba(50,28,6,.5)}
.node.dim{opacity:.4;filter:saturate(.45)}
.node.hit{box-shadow:0 0 0 3px #F2C230, 0 10px 22px rgba(50,28,6,.45)}
.node .pin{position:absolute;left:50%;top:-9px;width:17px;height:17px;margin-left:-8.5px;border-radius:50%;
  background:radial-gradient(circle at 33% 30%, #fff 0 12%, var(--pc,#C0392B) 42%, rgba(0,0,0,.5) 100%);
  box-shadow:0 3px 4px rgba(40,20,4,.5), inset 0 -1px 2px rgba(0,0,0,.35);z-index:3}
.node .tape{position:absolute;top:-8px;left:50%;width:52px;height:17px;margin-left:-26px;
  background:linear-gradient(180deg,rgba(255,250,225,.62),rgba(232,216,176,.5));
  border-left:1px dashed rgba(160,140,100,.4);border-right:1px dashed rgba(160,140,100,.4);
  transform:rotate(-2.5deg);box-shadow:0 1px 2px rgba(60,40,10,.18);z-index:2}
.node .ph{display:none;background:#4A4640;border:1px solid #2E2B27;margin-bottom:7px;
  align-items:center;justify-content:center;color:#8C877E;
  background-image:linear-gradient(150deg,#5A554E,#3C3833 60%,#514C45)}
.node .ttl{font-family:var(--f-ui);font-size:13px;color:var(--ink);line-height:1.22;word-break:break-word;letter-spacing:.01em}
.node .tlab{font-family:var(--f-hand);font-size:14px;line-height:1;margin-bottom:3px}
.node .kv{display:flex;gap:5px;font-family:var(--f-mono);font-size:9.5px;color:var(--ink3);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .kv b{color:var(--ink4);font-weight:400}
.node .risk{display:flex;gap:2px;margin-top:6px}
.node .risk i{width:13px;height:3px;background:rgba(120,100,70,.28);border-radius:1px}
.node .risk i.on{background:var(--amber)}
.node .risk i.hi{background:var(--red)}

/* variantes de support */
.p-polaroid{background:#FDFDFB;padding:9px 9px 7px}
.p-polaroid .ph{display:flex;aspect-ratio:1/1}
.p-polaroid .ttl{font-family:var(--f-hand);font-size:19px;line-height:1.05;text-align:center;margin-top:4px}
.p-polaroid .tlab{text-align:center;font-size:12px;color:var(--ink4)}
.p-polaroid .kv{justify-content:center}
.p-polaroid .risk{justify-content:center}
.p-photo{background:#FDFDFB;padding:8px 8px 7px;width:192px}
.p-photo .ph{display:flex;aspect-ratio:16/10}
.p-photo .ttl{font-family:var(--f-mono);font-size:13px;letter-spacing:.09em;margin-top:5px;text-align:center}
.p-photo .tlab{text-align:center;font-size:12px;color:var(--ink4)}
.p-photo .kv{justify-content:center}
.p-photo .risk{justify-content:center}
.p-sticky{width:158px;padding:11px 11px 9px;background:var(--sticky,#F6E38B);
  box-shadow:0 7px 12px rgba(50,28,6,.32), inset 0 -18px 22px -18px rgba(0,0,0,.18)}
.p-sticky .ttl{font-family:var(--f-hand);font-size:20px;line-height:1.1}
.p-sticky .tlab{font-size:12px;color:rgba(40,32,20,.55)}
.p-sticky .kv{color:rgba(40,32,20,.62);font-size:9.5px}
.p-sticky .kv b{color:rgba(40,32,20,.42)}
.p-sticky:after{content:"";position:absolute;right:0;bottom:0;border-width:0 0 15px 15px;border-style:solid;
  border-color:transparent transparent rgba(0,0,0,.14) transparent}
.p-sheet{background:linear-gradient(180deg,#FDFAF1,#F5EEDC);padding:11px 11px 9px}
.p-sheet .tlab{font-family:var(--f-ui);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
  border-bottom:1px solid var(--line2);padding-bottom:4px;margin-bottom:5px}
.p-sheet .ttl{font-family:var(--f-ui);font-size:12.5px}
/* Pas d overflow:hidden ici : il rognait l epingle, qui deborde en haut.
   C est la bande de couleur qui est arrondie a la place. */
.p-card{background:#FCFAF2;padding:0 0 9px}
.p-card .topline{border-radius:1px 1px 0 0}
.p-card .topline{height:7px;background:var(--tc,#A8221B);margin-bottom:7px}
.p-card .inner{padding:0 11px}
.p-card .tlab{font-family:var(--f-ui);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink4)}
.p-card .ttl{font-family:var(--f-ui);font-size:12.5px}
#board.linkmode .node{cursor:crosshair}

/* Image d'une fiche : elle prend la place de l'icône du type. */
.node .ph.img{display:flex;padding:0;overflow:hidden;min-height:92px;border-color:rgba(0,0,0,.35)}
.node .ph img{width:100%;height:100%;object-fit:cover;display:block}

/* Niveau d'alerte : cinq pastilles, pas de glissement à doser. */
.pastilles{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.pas{width:28px;height:23px;border:1px solid var(--line2);background:var(--paper2);border-radius:2px;
  cursor:pointer;font-family:var(--f-mono);font-size:10.5px;color:var(--ink4);padding:0;line-height:1;
  transition:background .1s,color .1s,border-color .1s}
.pas:hover{border-color:var(--line3);background:#fff}
.pas.on{background:var(--pc);border-color:rgba(0,0,0,.4);color:#FBEBCD}
.pasL{font-family:var(--f-ui);font-size:11.5px;color:var(--ink2);margin-left:5px}
.teinte{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.teinte button{width:22px;height:22px;border-radius:3px;border:1px solid rgba(0,0,0,.3);cursor:pointer;padding:0}
.teinte button.on{outline:2px solid var(--red);outline-offset:1px}
.apercu{width:100%;max-height:150px;object-fit:cover;border:1px solid var(--line2);border-radius:2px;
  margin-top:6px;display:block;background:#4A4640}

/* ---------- ficelle ---------- */
.edge{stroke:#A8241C;stroke-width:3.4;fill:none;stroke-linecap:round}
.edge.cool{stroke:#245278}
.edge.warm{stroke:#C0761A}
.edge.hot{stroke:#B01810;stroke-width:4}
.edge.dashed{stroke-dasharray:9 7}
.edge.sel{stroke:#E0341F;stroke-width:4.5}
.edge.dim{opacity:.2}
.eshadow{stroke:rgba(58,32,8,.26);fill:none;stroke-linecap:round}
.elabel{font-family:var(--f-hand);font-size:14px;fill:#3A2A18;paint-order:stroke;stroke:rgba(250,242,222,.95);
  stroke-width:4px;stroke-linejoin:round;cursor:pointer}
.elabel.sel{fill:#A8221B}
.elabel.dim{opacity:.14}

/* ---------- outils flottants ---------- */
.gtools{position:absolute;top:22px;left:24px;display:flex;gap:6px;flex-wrap:wrap;z-index:6}
.gright{position:absolute;top:22px;right:24px;display:flex;gap:6px;z-index:6;transition:right .22s cubic-bezier(.4,0,.2,1)}
#board.inspecting .gright{right:372px}
.gzoom{position:absolute;left:24px;bottom:24px;display:flex;flex-direction:column;gap:4px;z-index:6}
.gzoom .btn{width:32px;height:29px;justify-content:center;padding:0}
.legend{position:absolute;left:66px;bottom:24px;background:linear-gradient(180deg,#FBF6E9,#F0E6CE);
  border:1px solid #A68B5B;border-radius:var(--rad);padding:9px 11px;max-width:350px;z-index:6;
  box-shadow:0 8px 18px rgba(50,28,6,.4);transform:rotate(-.5deg)}
.legend .lgHead{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.legend .lgN{font-family:var(--f-mono);font-size:9.5px;color:var(--ink4)}
.legend .lgBtn{margin-left:auto;width:22px;height:20px;display:grid;place-items:center;background:rgba(255,255,255,.5);
  border:1px solid var(--line2);border-radius:2px;cursor:pointer;color:var(--ink2);transition:transform .18s,background .12s}
.legend .lgBtn:hover{background:#F2D98A}
.legend .lgBody{overflow:hidden;transition:max-height .22s ease,opacity .18s,margin .22s;max-height:340px;opacity:1;margin-top:7px}
.legend.min{padding:7px 11px}
.legend.min .lgBody{max-height:0;opacity:0;margin-top:0}
.legend.min .lgBtn{transform:rotate(-90deg)}
.legend .row{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.legend .lg{display:flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:9.5px;color:var(--ink2);cursor:pointer;
  border:1px solid var(--line2);padding:1px 5px;border-radius:2px;background:rgba(255,255,255,.5)}
.legend .lg:hover{background:#F2D98A}
.legend .lg.off{opacity:.4;text-decoration:line-through}
.legend .lg b{width:8px;height:8px;border-radius:2px;display:block}
.gstat{position:absolute;right:24px;bottom:24px;font-family:var(--f-mono);font-size:9.5px;color:#4A3A22;
  background:rgba(251,246,233,.9);border:1px solid #A68B5B;padding:4px 9px;border-radius:2px;z-index:5;
  transition:right .22s cubic-bezier(.4,0,.2,1)}
#board.inspecting .gstat{right:372px}

/* ---------- chemise (panneau latéral) ---------- */
.inspect{position:absolute;top:0;right:0;bottom:0;width:358px;z-index:8;
  background:linear-gradient(180deg,#E9DAB4,#DFCEA4);border-left:3px solid #B8975E;
  transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;
  box-shadow:-16px 0 34px rgba(40,22,4,.45)}
.inspect.open{transform:none}
.inspect>header{padding:12px 14px;border-bottom:2px solid #C0A472;display:flex;gap:9px;align-items:center;
  background:linear-gradient(180deg,#D9C08A,#CDB27A)}
.inspect .body{flex:1;overflow-y:auto;padding:14px}
.inspect>footer{padding:11px 14px;border-top:2px solid #C0A472;display:flex;gap:7px;background:rgba(255,255,255,.22)}
.isec{font-family:var(--f-ui);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#6B5A3A;
  margin:16px 0 9px;padding-bottom:5px;border-bottom:1px solid #C0A472;display:flex}
.isec span{margin-left:auto;color:var(--red)}
.f{margin-bottom:9px}
.f>label{display:block;font-family:var(--f-mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#7A6746;
  margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f input,.f select,.f textarea{width:100%;background:var(--paper);border:1px solid #B39A6A;border-radius:var(--rad);
  padding:6px 8px;font-size:12.5px;color:var(--ink);font-family:var(--f-body);
  box-shadow:inset 0 1px 2px rgba(120,90,40,.14)}
.f input.mono,.f textarea.mono{font-family:var(--f-mono)}
.f textarea{min-height:64px;resize:vertical;line-height:1.55}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--red);background:#fff}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-items:end}

.modal>header{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:2px solid #C0A472;

.typegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.typegrid button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px;background:var(--paper);

  letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);text-align:center;line-height:1.25;transition:.12s}
.typegrid button:hover{border-color:#8A6A3E;background:#fff}
.typegrid button.on{background:#F2D98A;border-color:var(--red);color:var(--ink)}
.tgroup{grid-column:1/-1;font-family:var(--f-ui);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink3);border-bottom:1px solid var(--line2);padding-bottom:3px;margin:6px 0 1px}
#toasts{position:fixed;right:16px;bottom:32px;z-index:95;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{display:flex;gap:9px;align-items:flex-start;background:linear-gradient(180deg,#F7F0DC,#ECE0C2);
  border:1px solid #A68B5B;border-left:3px solid var(--red);border-radius:var(--rad);padding:9px 12px;
  min-width:240px;max-width:330px;box-shadow:0 10px 26px rgba(0,0,0,.45);animation:slidein .2s;color:var(--ink)}
.toast.ok{border-left-color:var(--green)}.toast.err{border-left-color:var(--red)}.toast.warn{border-left-color:var(--amber)}
.toast b{display:block;font-family:var(--f-ui);font-size:12.5px;color:var(--ink)}
.toast span{font-size:12px;color:var(--ink3)}
@keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
#ctx{position:fixed;z-index:90;background:linear-gradient(180deg,#F7F0DC,#ECE0C2);border:1px solid #9C7A48;
  border-radius:var(--rad);padding:4px;min-width:212px;box-shadow:0 14px 30px rgba(0,0,0,.5);display:none}
#ctx button{display:flex;width:100%;align-items:center;gap:9px;background:none;border:0;text-align:left;padding:5px 9px;
  border-radius:2px;font-size:12.5px;color:var(--ink);cursor:pointer;font-family:var(--f-body)}
#ctx button:hover{background:#F2D98A}

  padding:5px 9px 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.empty b{display:block;font-family:var(--f-ui);font-size:15px;color:var(--ink2);margin-bottom:4px}

/* ---------- barre latérale ---------- */
:root{--sb:214px}
.sidebar{position:fixed;top:72px;left:0;bottom:20px;width:var(--sb);z-index:30;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#5A3A1C,#42280F 60%,#33200E);border-right:2px solid #2A1808;

.sheet>header h3{margin:0;font-family:var(--f-ui);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#3A2A14}

.sheet .bd{padding:14px}

.grid{display:grid;gap:14px}

.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.stat{position:relative;background:linear-gradient(180deg,#FBF6E9,#F0E6CE);border:1px solid #A68B5B;border-radius:2px;

  transform:rotate(var(--r,0deg))}

.stat .pin{position:absolute;left:50%;top:-8px;width:15px;height:15px;margin-left:-7.5px;border-radius:50%;
  background:radial-gradient(circle at 33% 30%,#fff 0 12%,var(--pc,#C0392B) 45%,rgba(0,0,0,.5) 100%);
  box-shadow:0 2px 3px rgba(40,20,4,.5)}

  text-transform:uppercase;color:var(--ink3)}
.stat .v{font-family:var(--f-ui);font-size:30px;color:var(--ink);line-height:1.05;margin:6px 0 2px}
.stat .d{font-family:var(--f-mono);font-size:10.5px;color:var(--ink4)}
table.pt{width:100%;border-collapse:collapse;font-size:13px}
table.pt thead th{font-family:var(--f-ui);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:#6B5A3A;
  text-align:left;padding:8px 12px;border-bottom:1px solid #C0A472;background:#EFE4C8;white-space:nowrap}

  box-shadow:0 6px 14px rgba(20,10,0,.32);transition:transform .1s,box-shadow .12s}

  font-family:var(--f-mono);font-size:10.5px;color:var(--ink4)}

  border-radius:50%;animation:spin .8s linear infinite}

// Le schéma stocké est de pures données ; les fonctions d'affichage
// sont reconstruites ici, à chaque chargement comme à chaque
// modification depuis l'Administration.
function construireSchema(brut){
  const out={};
  Object.keys(brut).forEach(k=>{
    const t=Object.assign({},brut[k]);
    t.i=I[t.ic]||I.doc;
    if(!t.p)t.p='sheet';
    const lire=(d,cle)=>Array.isArray(cle)?cle.map(x=>d[x]).filter(Boolean).join(' '):d[cle];
    t.title=d=>{
      d=d||{};
      const a=(t.titre||[]).map(x=>d[x]).filter(Boolean).join(' ');
      if(a)return a;
      const b=(t.titre2||[]).map(x=>d[x]).filter(Boolean).join(' ');
      return b||t.l;
    };
    t.card=d=>(t.carte||[]).map(c=>[c[0],lire(d||{},c[1])]);
    out[k]=t;
  });
  return out;
}
// Le schema enregistre porte tout ce qui se regle depuis le site : les
// types, l ordre des familles, et les intitules de liaison. L ancienne
// forme, une simple table de types, reste acceptee.
function normaliserPaquet(brut){
  if(brut&&brut.types)return {types:brut.types,familles:brut.familles||null,relations:brut.relations||null};
  return {types:brut||{},familles:null,relations:null};
}
let SCHEMA_DONNEES={},SCHEMA={},TYPES=[],FAMILLES=[],REL=[];
function appliquerSchema(brut){
  const p=normaliserPaquet(brut);
  SCHEMA_DONNEES=p.types;
  SCHEMA=construireSchema(p.types);
  TYPES=Object.keys(SCHEMA);
  // L ordre choisi fait foi ; une famille apparue depuis se range a la fin.
  const vues=[...new Set(TYPES.map(t=>SCHEMA[t].g||'Sans famille'))];
  FAMILLES=(p.familles&&p.familles.length)
    ? p.familles.filter(g=>vues.indexOf(g)!==-1).concat(vues.filter(g=>p.familles.indexOf(g)===-1))
    : vues;
  REL=(p.relations&&p.relations.length)?p.relations.slice():REL_BASE.slice();
}
function paquetActuel(){
  return {types:SCHEMA_DONNEES,familles:FAMILLES.slice(),relations:REL.slice()};
}
// Deplace une cle dans un objet en conservant l ordre des autres.
function reordonnerCles(obj,cle,delta){
  const ks=Object.keys(obj),i=ks.indexOf(cle),j=i+delta;
  if(i<0||j<0||j>=ks.length)return obj;
  ks.splice(j,0,ks.splice(i,1)[0]);
  const out={};ks.forEach(k=>out[k]=obj[k]);return out;
}

async function api(chemin,opts){
  opts=opts||{};
  const h={};
  if(SESSION&&SESSION.access_token)h.authorization='Bearer '+SESSION.access_token;
  if(opts.body)h['content-type']='application/json';
  let r;
  try{
    r=await fetch(API_BASE+chemin,{method:opts.method||'GET',headers:h,
      body:opts.body?JSON.stringify(opts.body):undefined});
  }catch(e){ return {statut:0,ok:false,data:{error:'Serveur injoignable.'}}; }
  let d=null; try{ d=await r.json(); }catch(e){}
  return {statut:r.status,ok:r.ok,data:d||{}};
}

let saveT,enCours=false,rappel=false;
function etatSave(t){const e=$('#saveState');if(e)e.textContent=t}

// Le débounce d'origine est conservé : la frappe dans une fiche ne
// déclenche qu'un envoi, une fois la saisie retombée.
function save(msg){
  if(!MOI.ecriture){etatSave('Lecture seule');return}
  etatSave('Enregistrement…');
  clearTimeout(saveT);
  saveT=setTimeout(()=>envoyer(msg),600);
}
async function envoyer(msg,forcer){
  if(enCours){rappel=true;return}
  enCours=true;
  const lot=ENATTENTE.splice(0,ENATTENTE.length);
  const corps={nodes:S.nodes,edges:S.edges,seq:S.seq,journal:lot};
  if(!forcer)corps.version=S.version;
  const r=await api('/api/sasp/board/'+BOARD_ID,{method:'PUT',body:corps});
  enCours=false;

  if(r.ok){
    S.version=r.data.version||S.version+1;
    etatSave((msg||'Enregistré')+' · '+new Date().toLocaleTimeString('fr-FR'));
  }else if(r.statut===409){
    // Quelqu'un d'autre a enregistré entre-temps : on ne décide pas à sa place.
    ENATTENTE.unshift(...lot);
    etatSave('Conflit');
    conflitDlg(r.data);
  }else{
    ENATTENTE.unshift(...lot);
    etatSave('Échec de l\'enregistrement');
    toast('Enregistrement impossible',r.data.error||'Réessayez dans un instant.','err');
  }
  if(rappel){rappel=false;envoyer(msg)}
}

let interfacePrete=false;
async function demarrer(){
  porte('chargement');
  if(!SB){
    SB=supabase.createClient(SUPABASE_URL,SUPABASE_ANON,{auth:{detectSessionInUrl:true,flowType:'pkce'}});
  }
  try{const {data}=await SB.auth.getSession();SESSION=data.session}catch(e){SESSION=null}
  if(!SESSION){porte('connexion');return}

  // Le schéma partagé d'abord : les fiches en dépendent pour s'afficher.
  try{
    const s=await api('/api/sasp/schema');
    if(s.ok&&s.data.data&&Object.keys(s.data.data).length)appliquerSchema(s.data.data);
    else appliquerSchema(JSON.parse(JSON.stringify(SCHEMA_BASE)));
  }catch(e){}

  const r=await api('/api/sasp/board/'+BOARD_ID);
  if(r.statut===401){porte('connexion');return}
  if(r.statut===403){porte('refus',r.data);return}
  if(!r.ok){porte('panne',r.data);return}

  appliquer(r.data);
  majEntete();
  porte(null);
  if(!interfacePrete){
    interfacePrete=true;
    buildTools();bindBoard();bindSearch();bindClavier();
    window.addEventListener('hashchange',route);
    $('#burger').onclick=e=>{e.stopPropagation();$('#sidebar').classList.toggle('open')};
    document.addEventListener('click',e=>{if(innerWidth<=900&&!e.target.closest('#sidebar')&&!e.target.closest('#burger'))$('#sidebar').classList.remove('open')});
    setInterval(()=>{const d=new Date(),z=x=>String(x).padStart(2,'0');
      const c=$('#clock');if(c)c.textContent=`${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`},1000);
    if(!location.hash)location.hash='#/board';
  }
  render();route();
  let vue=null;try{vue=localStorage.getItem(VUE_KEY)}catch(e){}
  if(!vue&&S.nodes.length)fitView(true);else applyView();
  toast('AEGIS chargé',S.nom+' · '+S.nodes.length+' élément'+(S.nodes.length>1?'s':''),'ok');
}

  const flush=()=>{if(buf.length){out+=buf.length===2?`<div class="f2">${buf.join('')}</div>`:buf.join('');buf=[]}};
  F.forEach(f=>{
    const h=fieldHTML(f,d[f.k],idp);
    if(f.full||f.t==='ta'){flush();out+=h}
    else{buf.push(h);if(buf.length===2)flush()}
  });
  flush();return out;
}
// Niveau d'alerte : cinq pastilles à cliquer. Recliquer celle qui est
// active remet à zéro, ce qui évite un bouton « aucun » de plus.
const NIVEAUX=['Aucun','Faible','Surveillance','Élevé','Critique','Maximal'];
const NIV_TEINTES=['','#3E7A4E','#8FA83A','#C0761A','#C4392C','#7C1712'];
function niveauHTML(v,idp){
  v=+v||0;
  return `<div class="f"><label>Niveau d'alerte</label>
    <div class="pastilles" id="${idp}niv" data-v="${v}">
      ${[1,2,3,4,5].map(i=>`<button type="button" class="pas${i<=v?' on':''}" data-n="${i}"
         style="--pc:${NIV_TEINTES[i]}" title="${esc(NIVEAUX[i])}">${i}</button>`).join('')}
      <span class="pasL" id="${idp}nivL">${esc(NIVEAUX[v])}</span>
    </div></div>`;
}
function lireNiveau(racine,idp){
  const z=racine.querySelector('#'+idp+'niv');
  return z?(+z.dataset.v||0):0;
}
function ecrireNiveau(racine,idp,v){
  const z=racine.querySelector('#'+idp+'niv'); if(!z)return;
  z.dataset.v=v;
  z.querySelectorAll('.pas').forEach(b=>b.classList.toggle('on',+b.dataset.n<=v));
  const l=racine.querySelector('#'+idp+'nivL'); if(l)l.textContent=NIVEAUX[v];
}
function brancherNiveau(racine,idp,apres){
  const z=racine.querySelector('#'+idp+'niv'); if(!z)return;
  z.querySelectorAll('.pas').forEach(b=>b.onclick=()=>{
    let v=+b.dataset.n;
    if(v===lireNiveau(racine,idp))v=0;
    ecrireNiveau(racine,idp,v);
    if(apres)apres(v);
  });
}

/* ---------- épingles, inclinaison, teintes ---------- */
// Le support papier et la couleur du post-it sont désormais portés par
// le schéma (clés p et sc), donc modifiables depuis Types d'éléments.
const PINS=['#C0392B','#2E6FA8','#E0A82E','#6B4FA8','#2E8B57','#D95F02','#B03060'];
// Teintes proposées pour colorer une fiche à la main.
const TEINTES=['#F6E38B','#F7C6A0','#F2A9A2','#E7B7DA','#C9C0EE','#BCE0E6','#BFE3C6','#DCEFC2',
 '#E4D6B4','#D8D2C6','#FBF6E9','#C7B299'];
function hashOf(id){let h=0;for(let i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))|0;return Math.abs(h)}
const rotOf=id=>((hashOf(id)%9)-4)*0.9;
const pinOf=id=>PINS[hashOf(id+'p')%PINS.length];
const NH={};   /* hauteurs mesurées, pour accrocher la ficelle sur l'épingle */

/* ============================================================
   RENDU DU TABLEAU
   ============================================================ */
const visible=n=>!S.hidden.has(n.t)&&!S.collapsed.has(n.id);
function render(){
  const nl=$('#gnodes');
  nl.innerHTML=S.nodes.filter(visible).map(n=>{
    const T=sch(n.t),d=n.d||{},kv=(T.card(d)||[]).filter(x=>x&&x[1]);
    const pp=T.p||'sheet';
    // La couleur posée sur la fiche l'emporte sur celle du type.
    const teinte=n.couleur||T.sc||'#F6E38B';
    const accent=n.couleur||T.c;
    const st=pp==='sticky'?`--sticky:${teinte};`:'';
    const body=`
      <div class="ph${n.image?' img':''}">${n.image
        ?`<img src="${esc(n.image)}" alt="" onerror="this.parentNode.classList.remove('img');this.remove()">`
        :svg(T.i,pp==='photo'?34:30,1.4)}</div>
      <div class="tlab" style="color:${pp==='sticky'?'':accent}">${T.l}</div>
      <div class="ttl">${esc(titleOf(n))}</div>
      ${kv.map(([k,v])=>`<div class="kv">${k?`<b>${k}</b>`:''}${esc(v)}</div>`).join('')}
      <div class="risk">${[0,1,2,3,4].map(i=>`<i class="${i<(n.r||0)?((n.r||0)>=4?'hi':'on'):''}"></i>`).join('')}</div>`;
    return `<div class="node p-${pp}${S.sel===n.id?' sel':''}${S.hits.has(n.id)?' hit':''}" data-id="${n.id}"
      style="left:${n.x}px;top:${n.y}px;--rot:${rotOf(n.id)}deg;--pc:${pinOf(n.id)};--tc:${accent};${st}">
      ${pp==='sheet'||pp==='photo'?'<span class="tape"></span>':''}
      <span class="pin"></span>
      ${pp==='card'?`<div class="topline"></div><div class="inner">${body}</div>`:body}
    </div>`}).join('');
  measure();
  drawEdges();
  applyView();
  bindNodes();
  drawLegend();
  $('#counts').textContent=`${S.nodes.filter(visible).length} éléments · ${S.edges.length} liaisons`;

function measure(){
  $$('#gnodes .node').forEach(nd=>{NH[nd.dataset.id]={w:nd.offsetWidth,h:nd.offsetHeight}});
}
const pinPt=n=>({x:n.x,y:n.y-((NH[n.id]?.h||110)/2)+2});
function drawEdges(){
  const pos=id=>{const n=node(id);return n&&visible(n)?n:null};
  let sh='',p='',l='';
  S.edges.forEach(e=>{
    const na=pos(e.a),nb=pos(e.b); if(!na||!nb)return;
    const a=pinPt(na),b=pinPt(nb);
    const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;
    const sag=Math.min(90,Math.max(20,len*0.16));
    const cx=(a.x+b.x)/2,cy=(a.y+b.y)/2+sag;
    const dim=S.sel&&S.sel!==e.a&&S.sel!==e.b?' dim':'';
    const dpath=`M${a.x} ${a.y} Q${cx} ${cy} ${b.x} ${b.y}`;
    const wdt=e.w==='hot'?4.4:3.4;
    sh+=`<path class="eshadow${dim}" d="${dpath}" stroke-width="${wdt+1.2}" transform="translate(2,3)"/>`;
    p+=`<path class="edge ${e.w||''}${e.dash?' dashed':''}${S.selEdge===e.id?' sel':''}${dim}" d="${dpath}" data-edge="${e.id}" style="pointer-events:stroke;cursor:pointer"/>`;
    const lx=(a.x+2*cx+b.x)/4,ly=(a.y+2*cy+b.y)/4;
    const ang=Math.max(-14,Math.min(14,Math.atan2(dy,dx)*180/Math.PI*0.35));
    l+=`<text class="elabel${S.selEdge===e.id?' sel':''}${dim}" x="${lx}" y="${ly-4}" text-anchor="middle" data-edge="${e.id}" transform="rotate(${ang.toFixed(1)} ${lx} ${ly-4})">${esc(e.l)}</text>`;
  });
  $('#glinks').innerHTML=sh+p; $('#glabels').innerHTML=l;
  $$('[data-edge]').forEach(x=>x.onclick=ev=>{ev.stopPropagation();selectEdge(x.dataset.edge)});
}
function bindNodes(){
  $$('#gnodes .node').forEach(nd=>{
    let drag=false,sx,sy,ox,oy,moved;
    nd.addEventListener('mousedown',e=>{
      if(e.button!==0)return; e.stopPropagation();
      const n=node(nd.dataset.id);
      if(S.linkFrom){finishLink(n);return}
      drag=true;moved=false;sx=e.clientX;sy=e.clientY;ox=n.x;oy=n.y;nd.style.cursor='grabbing';nd.style.zIndex=30;
      const mv=ev=>{if(!drag)return;
        const dx=(ev.clientX-sx)/S.scale,dy=(ev.clientY-sy)/S.scale;
        if(Math.abs(dx)>2||Math.abs(dy)>2)moved=true;
        n.x=Math.round(ox+dx);n.y=Math.round(oy+dy);
        nd.style.left=n.x+'px';nd.style.top=n.y+'px';drawEdges()};
      const up=()=>{drag=false;nd.style.cursor='';nd.style.zIndex='';
        window.removeEventListener('mousemove',mv);window.removeEventListener('mouseup',up);
        if(moved)save('Disposition enregistrée');else selectNode(nd.dataset.id)};
      window.addEventListener('mousemove',mv);window.addEventListener('mouseup',up);
    });
    nd.addEventListener('dblclick',e=>{e.stopPropagation();selectNode(nd.dataset.id)});
    nd.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();nodeMenu(e,node(nd.dataset.id))});
  });
}
function applyView(){
  $('#gworld').style.transform=`translate(${S.tx}px,${S.ty}px) scale(${S.scale})`;
  $('#zoomv').textContent=Math.round(S.scale*100)+'%';
}
function zoomBy(f){
  const r=$('#board').getBoundingClientRect(),mx=r.width/2,my=r.height/2;
  const ns=Math.min(2.6,Math.max(.2,S.scale*f));
  S.tx=mx-(mx-S.tx)*(ns/S.scale);S.ty=my-(my-S.ty)*(ns/S.scale);S.scale=ns;applyView();sauverVue();
}
function fitView(silent){
  const vis=S.nodes.filter(visible); if(!vis.length)return;
  const r=$('#board').getBoundingClientRect();
  const xs=vis.map(n=>n.x),ys=vis.map(n=>n.y);
  const minx=Math.min(...xs)-130,maxx=Math.max(...xs)+130,miny=Math.min(...ys)-95,maxy=Math.max(...ys)+95;
  S.scale=Math.max(.2,Math.min(r.width/(maxx-minx),r.height/(maxy-miny),1.3)*.95);
  S.tx=r.width/2-((minx+maxx)/2)*S.scale;S.ty=r.height/2-((miny+maxy)/2)*S.scale;
  applyView(); sauverVue();
}
function legendToggle(force){
  const L=$('#legend'); if(!L)return;
  const min=force!==undefined?force:!L.classList.contains('min');
  L.classList.toggle('min',min);
  const b=$('#lgToggle'); if(b){b.setAttribute('aria-expanded',String(!min));b.title=min?'Afficher la légende':'Masquer la légende'}
  try{localStorage.setItem('sasp.liaisons.legende',min?'min':'open')}catch(e){}

function drawLegend(){
  const used=[...new Set(S.nodes.map(n=>n.t))];
  const n=$('#lgN'); if(n){const off=used.filter(t=>S.hidden.has(t)).length;
    n.textContent=off?`${used.length-off}/${used.length} affichés`:`${used.length} types`;
    n.style.color=off?'var(--red)':'';}
  $('#legrow').innerHTML=used.map(t=>`<span class="lg ${S.hidden.has(t)?'off':''}" data-t="${t}"><b style="background:${sch(t).c}"></b>${sch(t).l}</span>`).join('')
    ||'<span class="muted" style="font-size:10px">Aucun élément sur le tableau</span>';
  $$('#legrow .lg').forEach(s=>s.onclick=()=>{const t=s.dataset.t;S.hidden.has(t)?S.hidden.delete(t):S.hidden.add(t);render()});
}

function bindInspector(n){
  const p=$('#inspect');let t;
  const flag=()=>{const f=$('#fSave',p);if(!f)return;f.textContent='Enregistrement…';
    clearTimeout(t);t=setTimeout(()=>{f.textContent='À jour';
      logAct('Modification de fiche',sch(n.t).l+' · '+titleOf(n));save('Fiche enregistrée')},450)};
  $$('#iFields [data-k]',p).forEach(inp=>{
    const ev=inp.tagName==='SELECT'?'change':'input';
    inp.addEventListener(ev,()=>{n.d[inp.dataset.k]=inp.value;flag();
      const nd=$(`#gnodes .node[data-id="${n.id}"]`);
      if(nd){const T=sch(n.t),d=n.d,kv=(T.card(d)||[]).filter(x=>x&&x[1]);
        $('.ttl',nd)&&($('.ttl',nd).textContent=titleOf(n));
        $$('.kv',nd).forEach(x=>x.remove());
        const risk=$('.risk',nd);
        kv.forEach(([k,v])=>risk.insertAdjacentHTML('beforebegin',`<div class="kv">${k?`<b>${k}</b>`:''}${esc(v)}</div>`));
        const ht=$('header .ihead',p); if(ht)ht.textContent=titleOf(n);
        measure();drawEdges();
      }});
  });
  brancherNiveau(p,'i_',v=>{

    if(nd)nd.innerHTML=[0,1,2,3,4].map(i=>`<i class="${i<n.r?(n.r>=4?'hi':'on'):''}"></i>`).join('');
    flag();
  });

  // Apparence : couleur et image de cette fiche uniquement.
  const poser=(c)=>{
    if(c)n.couleur=c; else delete n.couleur;
    $$('#iTeinte button',p).forEach(b=>b.classList.toggle('on',(b.dataset.c||'')===(c||'')));
    render();flag();
  };
  $$('#iTeinte button',p).forEach(b=>b.onclick=()=>poser(b.dataset.c||''));
  const col=$('#iCol',p);
  if(col)col.addEventListener('change',()=>poser(col.value));

  const champImg=$('#iImg',p);
  if(champImg)champImg.addEventListener('change',()=>{
    const u=champImg.value.trim();

  });
  const fich=$('#iImgI',p);

  if(btnF)btnF.onclick=()=>fich.click();

    const f=fich.files&&fich.files[0]; if(!f)return;
    reduireImage(f,480,url=>{n.image=url;render();flag();selectNode(n.id);
      toast('Image ajoutée','Réduite pour ne pas alourdir le tableau.','ok')});
  });
  const btnX=$('#iImgX',p);
  if(btnX)btnX.onclick=()=>{delete n.image;render();flag();selectNode(n.id)};
}

// Les images sont enregistrées avec le tableau : on les réduit avant
// de les y mettre, sinon quelques photos suffisent à peser plusieurs
// mégaoctets à chaque sauvegarde.
function reduireImage(fichier,cote,apres){
  const fr=new FileReader();
  fr.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const r=Math.min(1,cote/Math.max(im.width,im.height));
      const w=Math.round(im.width*r),h=Math.round(im.height*r);
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(im,0,0,w,h);
      apres(cv.toDataURL('image/jpeg',0.72));
    };
    im.onerror=()=>toast('Image illisible','Format non reconnu.','err');
    im.src=fr.result;
  };
  fr.readAsDataURL(fichier);
}

   Les types sont présentés par famille : la grille de 24 vignettes

function addDlg(preset,apres){
  if(!MOI.ecriture){toast('Lecture seule','Votre accès ne permet pas de modifier le tableau.','warn');return}
  let t=(preset&&SCHEMA[preset])?preset:TYPES[0];
  const grille=()=>FAMILLES.map(g=>
    `<div class="tgroup">${esc(g)}</div>`+
    TYPES.filter(k=>SCHEMA[k].g===g).map(k=>`<button data-t="${k}" class="${k===t?'on':''}">
      <span style="color:${SCHEMA[k].c}">${svg(SCHEMA[k].i,17,1.7)}</span>${esc(SCHEMA[k].l)}</button>`).join('')
  ).join('');
  const body=`
    <div class="lbl" style="margin-bottom:7px">Type d'élément</div>
    <div class="typegrid" id="tg">${grille()}</div>
    <div class="lbl" id="ffLbl" style="margin:14px 0 4px">Champs · ${esc(sch(t).l)}</div>
    <p style="margin:0 0 10px;font-size:11.5px;color:#7A6746;line-height:1.5">Propriétaire, chef, titulaire, lieu, agent : ces rattachements se créent en liaison, pas en champ.</p>
    <div id="ff">${fieldsHTML(t,{},'a_')}</div>
    ${niveauHTML(0,'a_')}`;
  return modal({title:'Ajouter un élément au tableau',ok:'Ajouter au tableau',body:body,
    after:(sc)=>{
      $$('#tg button',sc).forEach(b=>b.onclick=()=>{
        t=b.dataset.t;
        $$('#tg button',sc).forEach(x=>x.classList.toggle('on',x.dataset.t===t));
        $('#ff',sc).innerHTML=fieldsHTML(t,{},'a_');
        $('#ffLbl',sc).textContent='Champs · '+sch(t).l;
      });
      brancherNiveau(sc,'a_');
    },
    onOk:sc=>{
      const d={};
      $$('#ff [data-k]',sc).forEach(i=>{if(i.value)d[i.dataset.k]=i.value});
      const r=lireNiveau(sc,'a_');
      const b=$('#board').getBoundingClientRect();
      // Depuis une page interne le tableau n'est pas mesurable : on pose
      // l'élément près du centre du nuage existant.
      let x,y;
      if(b.width>10){x=Math.round((b.width/2-S.tx)/S.scale);y=Math.round((b.height/2-S.ty)/S.scale)}
      else{const v=S.nodes;x=v.length?Math.round(v.reduce((s,n)=>s+n.x,0)/v.length)+120:600;
           y=v.length?Math.round(v.reduce((s,n)=>s+n.y,0)/v.length)+90:400}
      const n={id:'n'+(++S.seq),t,r,d,x,y};
      S.nodes.push(n);logAct('Création d\'élément',sch(t).l+' · '+titleOf(n));
      render();save('Élément ajouté');
      toast('Élément ajouté',sch(t).l+' · '+titleOf(n),'ok');
      if(apres)apres(n);else if(ROUTE==='board')selectNode(n.id);
    }});
}

/* ---------- outils ---------- */
function autoGroup(){
  const types=[...new Set(S.nodes.filter(visible).map(n=>n.t))];
  if(!types.length)return toast('Rien à regrouper','Le tableau est vide.','warn');
  const cols=Math.ceil(Math.sqrt(types.length));
  types.forEach((t,i)=>{
    const cx=260+(i%cols)*480,cy=220+Math.floor(i/cols)*400;
    const g=S.nodes.filter(n=>n.t===t);
    g.forEach((n,j)=>{const ang=(j/Math.max(1,g.length))*Math.PI*2,rad=g.length>1?100+g.length*10:0;
      n.x=Math.round(cx+Math.cos(ang)*rad);n.y=Math.round(cy+Math.sin(ang)*rad)});
  });
  render();fitView();save('Regroupement appliqué');
  toast('Regroupement appliqué',types.length+' groupes par type','ok');
}
function exportPng(){
  toast('Export en cours','Génération de l\'image…');
  if(typeof html2canvas!=='function')return toast('Export indisponible','Moteur de rendu non chargé.','err');
  html2canvas($('#board'),{backgroundColor:'#C79B62',scale:2,logging:false}).then(cv=>cv.toBlob(b=>{
    const u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download='SASP_tableau_liaisons.png';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Image générée','','ok');
  })).catch(()=>toast('Export impossible','Le rendu a échoué.','err'));
}
function exportJson(){
  const data=JSON.stringify({nom:S.nom,dossier:S.dossier,nodes:S.nodes,edges:S.edges,seq:S.seq},null,1);
  const b=new Blob([data],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download='tableau-liaisons.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Dossier exporté','','ok');
}
function importJson(){

/* ---------- répertoire ---------- */
// Le classement se fait sur trois niveaux : famille, type, puis recherche
// libre. C'est là que les éléments se créent sans passer par le liège.
let DIR={q:'',t:'',g:'',group:true};
function pDir(v){
  const counts={};S.nodes.forEach(n=>counts[n.t]=(counts[n.t]||0)+1);
  const parFamille={};S.nodes.forEach(n=>{const g=sch(n.t).g;parFamille[g]=(parFamille[g]||0)+1});
  v.innerHTML=`<div class="pwrap">
   <div class="phead"><div><h1>Répertoire</h1><p>Toutes les fiches du tableau, classées par famille puis par type. Un clic ouvre l'élément sur le liège.</p></div>
     <div class="acts">
       <button class="btn" id="rGroup">${svg(I.grp,13)}<span id="rGroupL">${DIR.group?'Vue à plat':'Grouper par type'}</span></button>
       <button class="btn pri" id="rNew" ${MOI.ecriture?'':'disabled'}>${svg(I.plus,13)}Nouvel élément</button></div></div>
   <div class="sheet"><div class="bd">
     <input id="rq" placeholder="Nom, plaque, numéro, référence…" value="${esc(DIR.q)}"
       style="width:100%;max-width:420px;background:var(--paper);border:1px solid #B39A6A;border-radius:2px;padding:7px 10px;font-family:var(--f-mono);font-size:12px;color:var(--ink);margin-bottom:11px">
     <div class="lbl" style="margin-bottom:5px">Familles</div>
     <div class="dchip" id="rf"><button data-g="" class="${DIR.g?'':'on'}">Toutes · ${S.nodes.length}</button>
       ${FAMILLES.filter(g=>parFamille[g]).map(g=>`<button data-g="${esc(g)}" class="${DIR.g===g?'on':''}">${esc(g)} · ${parFamille[g]}</button>`).join('')}</div>
     <div class="lbl" style="margin-bottom:5px">Types</div>
     <div class="dchip" id="rc"></div>
     <div class="grid g4" id="rg" style="gap:12px"></div>
   </div></div></div>`;

  const chips=()=>{
    const dispo=Object.keys(counts).filter(t=>!DIR.g||sch(t).g===DIR.g).sort((a,b)=>counts[b]-counts[a]);
    if(DIR.t&&dispo.indexOf(DIR.t)===-1)DIR.t='';
    $('#rc',v).innerHTML=`<button data-t="" class="${DIR.t?'':'on'}">Tous</button>`+
      dispo.map(t=>`<button data-t="${t}" class="${DIR.t===t?'on':''}">${sch(t).l} · ${counts[t]}</button>`).join('');
    $$('#rc button',v).forEach(b=>b.onclick=()=>{DIR.t=b.dataset.t;chips();draw()});
  };
  const carte=n=>{const T=sch(n.t),kv=(T.card(n.d)||[]).filter(x=>x&&x[1]);
    return `<div class="dcard" data-id="${n.id}">
      <div class="dcTop" style="background:${T.c}1f;border-bottom-color:${T.c}55">
        <span style="color:${T.c}">${svg(T.i,14)}</span>
        <span style="font-family:var(--f-ui);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:${T.c}">${T.l}</span></div>
      <div class="dcBody"><div class="nm">${esc(titleOf(n))}</div>
        <div class="sb">${kv.map(([k,x])=>esc(x)).join(' · ')||'&nbsp;'}</div>
        <div class="meter" style="margin-top:8px"><i class="${(n.r||0)>=4?'r':(n.r||0)>=3?'a':'g'}" style="width:${(n.r||0)*20}%"></i></div></div>
      <div class="dcFoot">${svg(I.link,12)}<b>${relsOf(n.id).length}</b> liaisons<span style="margin-left:auto;color:var(--red)">Ouvrir →</span></div>
    </div>`};
  const draw=()=>{
    const q=DIR.q.toLowerCase();
    const list=S.nodes.filter(n=>(!DIR.t||n.t===DIR.t)&&(!DIR.g||sch(n.t).g===DIR.g)&&
      (!q||(titleOf(n)+' '+sch(n.t).l+' '+Object.values(n.d||{}).join(' ')).toLowerCase().includes(q)));
    let html='';
    if(!list.length){
      html=`<div class="empty" style="grid-column:1/-1"><b>Aucune fiche</b>${
        S.nodes.length?'Modifiez la recherche ou les filtres.':'Le tableau est vide — créez un premier élément.'}</div>`;
    }else if(DIR.group){
      const par={};list.forEach(n=>{(par[n.t]=par[n.t]||[]).push(n)});
      Object.keys(par).sort((a,b)=>par[b].length-par[a].length).forEach(t=>{
        html+=`<div class="rgroup"><b>${esc(sch(t).l)}</b><i></i><span class="n">${par[t].length}</span></div>`;
        html+=par[t].map(carte).join('');
      });
    }else html=list.map(carte).join('');
    $('#rg',v).innerHTML=html;
    $$('#rg .dcard',v).forEach(c=>c.onclick=()=>openOnBoard(c.dataset.id));
  };
  chips();draw();
  $('#rq',v).oninput=e=>{DIR.q=e.target.value;draw()};
  $$('#rf button',v).forEach(b=>b.onclick=()=>{DIR.g=b.dataset.g;
    $$('#rf button',v).forEach(x=>x.classList.remove('on'));b.classList.add('on');chips();draw()});
  $('#rGroup').onclick=()=>{DIR.group=!DIR.group;$('#rGroupL').textContent=DIR.group?'Vue à plat':'Grouper par type';draw()};
  // Création directe depuis le répertoire : la page se rafraîchit sur place.
  $('#rNew').onclick=()=>addDlg(DIR.t||undefined,()=>route());
}

// Le journal vient du serveur : il n'est ni modifiable ni effaçable
// depuis le navigateur.
async function chargerJournal(limite){
  const r=await api('/api/sasp/journal?tableau='+BOARD_ID);
  const j=(r.ok&&r.data.journal)||[];
  return limite?j.slice(0,limite):j;
}
function pLog(v){

   <div class="phead"><div><h1>Journal d'activité</h1>

/* ---------- types d'éléments ---------- */
// L'éditeur travaille sur une copie : rien ne bouge pour les autres tant
// qu'on n'a pas enregistré. Le schéma étant partagé, une modification
// vaut ensuite pour tout le monde.
let TYP={sel:null,types:null,familles:null,relations:null,sale:false};
const CHAMP_TYPES=[['t','Texte'],['ta','Texte long'],['s','Liste de choix'],['d','Date'],['n','Nombre']];

function typBrouillon(){
  if(!TYP.types){
    TYP.types=JSON.parse(JSON.stringify(SCHEMA_DONNEES));
    TYP.familles=FAMILLES.slice();
    TYP.relations=REL.slice();
  }
}
function typFamillesVues(){
  const vues=[...new Set(Object.keys(TYP.types).map(k=>TYP.types[k].g||'Sans famille'))];
  return TYP.familles.filter(g=>vues.indexOf(g)!==-1).concat(vues.filter(g=>TYP.familles.indexOf(g)===-1));
}

function pTypes(v){
  typBrouillon();
  const B=TYP.types;
  if(!TYP.sel||!B[TYP.sel])TYP.sel=Object.keys(B)[0]||null;
  const compte={};S.nodes.forEach(n=>compte[n.t]=(compte[n.t]||0)+1);
  const ro=MOI.peutGerer?'':'disabled';

  v.innerHTML=`<div class="pwrap">
   <div class="phead"><div><h1>Types d'éléments</h1>
     <p>Tout ce qui compose une fiche se règle ici : les familles, les types, leurs champs et leurs listes de choix,
        et les intitulés de liaison. Le schéma est partagé — ce que vous enregistrez vaut pour tout le monde.</p></div>
     <div class="acts">
       <button class="btn" id="tyReset">${svg(I.undo,13)}Schéma d'origine</button>
       <button class="btn pri" id="tySave" ${ro}>${svg(I.chk,13)}Enregistrer</button></div></div>
   ${MOI.peutGerer?'':'<div class="sheet"><div class="empty"><b>Lecture seule</b>Seuls le Command Staff et le Lead CID peuvent modifier le schéma.</div></div>'}

   <section class="sheet"><header><h3>Familles</h3>
     <div class="r"><span class="lbl">Elles ordonnent les types dans le formulaire d'ajout et le répertoire</span></div></header>
     <div class="bd"><div id="tyFam"></div>
       <button class="btn sm" id="tyFamAdd" style="margin-top:10px" ${ro}>${svg(I.plus,12)}Ajouter une famille</button>
     </div></section>

   <div class="grid" style="grid-template-columns:minmax(0,270px) minmax(0,1fr);gap:14px;align-items:start">
     <section class="sheet"><header><h3>Les types</h3><div class="r"><span class="lbl" id="tyN"></span></div></header>
       <div class="bd" style="padding:9px">
         <div id="tyListe"></div>
         <button class="btn sm" id="tyNew" style="width:100%;justify-content:center;margin-top:9px" ${ro}>${svg(I.plus,12)}Nouveau type</button>
       </div></section>
     <div id="tyEdit"></div>
   </div>

   <section class="sheet"><header><h3>Intitulés de liaison</h3>
     <div class="r"><span class="lbl" id="tyRelN"></span></div></header>
     <div class="bd">
       <p style="margin:0 0 11px;color:var(--ink2);max-width:76ch">Ce sont les intitulés proposés quand on relie deux éléments avec une ficelle. Modifier un intitulé ne renomme pas les liaisons déjà posées.</p>
       <div id="tyRel" style="display:flex;flex-wrap:wrap;gap:6px"></div>
       <div style="display:flex;gap:7px;margin-top:11px;max-width:460px">
         <input id="tyRelNew" placeholder="Nouvel intitulé…" style="flex:1;background:var(--paper);border:1px solid #B39A6A;border-radius:2px;padding:6px 9px" ${ro}>
         <button class="btn sm" id="tyRelAdd" ${ro}>${svg(I.plus,12)}Ajouter</button></div>
     </div></section>
  </div>`;

  /* ---- familles ---- */
  const familles=()=>{
    const vues=typFamillesVues();
    TYP.familles=vues.slice();
    const n={};Object.keys(B).forEach(k=>{const g=B[k].g||'Sans famille';n[g]=(n[g]||0)+1});
    $('#tyFam',v).innerHTML=`<div class="tblwrap"><table class="pt"><thead><tr>
      <th style="width:60px">Ordre</th><th>Nom</th><th style="width:90px">Types</th><th style="width:130px"></th></tr></thead>
      <tbody>${vues.map((g,i)=>`<tr>
        <td class="mono" style="color:var(--ink4)">${i+1}</td>
        <td><input class="tyfa" data-g="${esc(g)}" value="${esc(g)}" ${ro}
          style="width:100%;max-width:340px;background:var(--paper);border:1px solid #C9B383;border-radius:2px;padding:5px 7px"></td>
        <td class="mono">${n[g]||0}</td>
        <td><button class="btn sm" data-fmv="${esc(g)}" data-d="-1" ${ro}>↑</button>
            <button class="btn sm" data-fmv="${esc(g)}" data-d="1" ${ro}>↓</button>
            <button class="btn sm dgr" data-frm="${esc(g)}" ${ro}>×</button></td></tr>`).join('')
        ||'<tr><td colspan="4"><div class="empty">Aucune famille.</div></td></tr>'}
      </tbody></table></div>`;

    // Renommer une famille la renomme partout où elle est utilisée.
    $$('#tyFam .tyfa',v).forEach(x=>x.addEventListener('change',()=>{
      const av=x.dataset.g,ap=x.value.trim();

      TYP.sale=true;pTypes(v);
    }));
    $$('#tyFam [data-fmv]',v).forEach(b=>b.onclick=()=>{
      const g=b.dataset.fmv,d=+b.dataset.d;
      const i=TYP.familles.indexOf(g),j=i+d;
      if(i<0||j<0||j>=TYP.familles.length)return;
      TYP.familles.splice(j,0,TYP.familles.splice(i,1)[0]);
      TYP.sale=true;pTypes(v);
    });
    $$('#tyFam [data-frm]',v).forEach(b=>b.onclick=()=>{
      const g=b.dataset.frm,combien=n[g]||0;
      if(combien){
        const autres=typFamillesVues().filter(x=>x!==g);
        modal({title:'Supprimer la famille',ok:'Déplacer et supprimer',
          body:`<p style="margin:0 0 12px;line-height:1.6"><b>${esc(g)}</b> contient ${combien} type${combien>1?'s':''}.
            Choisissez la famille qui les accueille.</p>
            <div class="f"><label>Nouvelle famille</label><select id="fdst">
              ${autres.map(x=>`<option>${esc(x)}</option>`).join('')||'<option>Sans famille</option>'}</select></div>`,
          onOk:sc=>{
            const dst=$('#fdst',sc).value;
            Object.keys(B).forEach(k=>{if((B[k].g||'Sans famille')===g)B[k].g=dst});
            TYP.familles=TYP.familles.filter(x=>x!==g);
            TYP.sale=true;pTypes(v);
          }});
      }else{
        TYP.familles=TYP.familles.filter(x=>x!==g);TYP.sale=true;pTypes(v);
      }
    });
  };

  /* ---- liste des types ---- */
  const liste=()=>{
    const vues=typFamillesVues();
    const parFam={};vues.forEach(g=>parFam[g]=[]);
    Object.keys(B).forEach(k=>{const g=B[k].g||'Sans famille';(parFam[g]=parFam[g]||[]).push(k)});
    $('#tyN',v).textContent=Object.keys(B).length+' types';
    $('#tyListe',v).innerHTML=vues.map(g=>
      `<div class="lbl" style="margin:9px 0 4px">${esc(g)}</div>`+
      parFam[g].map(k=>`<div class="relrow" style="${TYP.sel===k?'background:#F2D98A;':''}padding:5px 6px;border-bottom:1px solid #E0D3B2">
        <span data-k="${esc(k)}" style="color:${esc(B[k].c||'#888')};flex:none;cursor:pointer">${svg(I[B[k].ic]||I.doc,14)}</span>
        <span class="rn" data-k="${esc(k)}" style="cursor:pointer">${esc(B[k].l||k)}</span>
        <span class="rv">${compte[k]||0}</span>
        <span style="display:flex;gap:2px">
          <button class="btn sm" data-tmv="${esc(k)}" data-d="-1" style="padding:1px 5px" ${ro}>↑</button>
          <button class="btn sm" data-tmv="${esc(k)}" data-d="1" style="padding:1px 5px" ${ro}>↓</button></span>
        </div>`).join('')
    ).join('');
    $$('#tyListe [data-k]',v).forEach(r=>r.onclick=()=>{TYP.sel=r.dataset.k;liste();editeur()});
    $$('#tyListe [data-tmv]',v).forEach(b=>b.onclick=e=>{
      e.stopPropagation();
      // reordonnerCles rend un nouvel objet : il remplace le brouillon.
      TYP.types=reordonnerCles(B,b.dataset.tmv,+b.dataset.d);
      TYP.sale=true;pTypes(v);
    });
  };

  /* ---- éditeur d'un type ---- */
  const editeur=()=>{
    const k=TYP.sel,t=k&&B[k];
    if(!t){$('#tyEdit',v).innerHTML='<div class="sheet"><div class="empty"><b>Aucun type</b>Créez-en un.</div></div>';return}
    $('#tyEdit',v).innerHTML=`<section class="sheet">
      <header><span style="color:${esc(t.c||'#888')}">${svg(I[t.ic]||I.doc,16)}</span>
        <h3>${esc(t.l||k)}</h3>
        <div class="r"><span class="mono" style="font-size:10.5px;color:var(--ink4)">clé : ${esc(k)}</span>
        <button class="btn sm dgr" id="tyDel" ${ro}>${svg(I.trash,12)}Supprimer</button></div></header>
      <div class="bd">
        <div class="f2">
          <div class="f"><label>Nom affiché</label><input id="tyL" value="${esc(t.l||'')}" ${ro}></div>
          <div class="f"><label>Famille</label><select id="tyG" ${ro}>
            ${typFamillesVues().map(g=>`<option ${(t.g||'Sans famille')===g?'selected':''}>${esc(g)}</option>`).join('')}</select></div>
        </div>
        <div class="f2">
          <div class="f"><label>Couleur du type</label>
            <div style="display:flex;gap:7px;align-items:center">
              <input type="color" id="tyC" value="${esc(t.c||'#8CB8E4')}" style="width:44px;height:30px;padding:0" ${ro}>
              <input id="tyCT" class="mono" value="${esc(t.c||'')}" style="flex:1" ${ro}></div></div>
          <div class="f"><label>Support papier</label><select id="tyP" ${ro}>
            ${SUPPORTS.map(([a,b2])=>`<option value="${a}" ${t.p===a?'selected':''}>${esc(b2)}</option>`).join('')}</select></div>
        </div>
        <div class="f2">
          <div class="f"><label>Icône</label><select id="tyIc" ${ro}>
            ${ICONES.map(i=>`<option value="${i}" ${t.ic===i?'selected':''}>${i}</option>`).join('')}</select></div>
          <div class="f"><label>Couleur du post-it</label>
            <input type="color" id="tySc" value="${esc(t.sc||'#F6E38B')}" style="width:44px;height:30px;padding:0" ${ro}>
            <span class="lbl" style="margin-left:7px">${t.p==='sticky'?'utilisée':'sans effet sur ce support'}</span></div>
        </div>
        <div class="isec">Nom de la fiche</div>
        <p style="margin:-4px 0 9px;font-size:11.5px;color:var(--ink3)">Les champs dont les valeurs composent le titre, séparés par des virgules.</p>
        <div class="f2">
          <div class="f"><label>Clés du titre</label><input id="tyTi" class="mono" value="${esc((t.titre||[]).join(', '))}" ${ro}></div>
          <div class="f"><label>Repli si vide</label><input id="tyTi2" class="mono" value="${esc((t.titre2||[]).join(', '))}" ${ro}></div>
        </div>
        <div class="isec">Lignes de la vignette</div>
        ${[0,1].map(i=>{const c=(t.carte||[])[i]||['',''];
          return `<div class="f2"><div class="f"><label>Libellé ${i+1}</label>
            <input class="tyCa" data-i="${i}" data-p="0" value="${esc(c[0]||'')}" ${ro}></div>
            <div class="f"><label>Clé ${i+1}</label>
            <input class="tyCa mono" data-i="${i}" data-p="1" value="${esc(Array.isArray(c[1])?c[1].join(' '):(c[1]||''))}" ${ro}></div></div>`}).join('')}
        <div class="isec">Champs de la fiche<span>${(t.f||[]).length}</span></div>
        <div class="tblwrap"><table class="pt"><thead><tr>
          <th style="width:135px">Clé</th><th>Libellé</th><th style="width:130px">Type</th>
          <th>Choix (séparés par des ;)</th><th style="width:60px">Large</th><th style="width:86px"></th></tr></thead>
          <tbody id="tyF"></tbody></table></div>
        <button class="btn sm" id="tyAddF" style="margin-top:10px" ${ro}>${svg(I.plus,12)}Ajouter un champ</button>
      </div></section>`;

    const cel='width:100%;background:var(--paper);border:1px solid #C9B383;border-radius:2px;padding:4px 6px';
    const champs=()=>{
      const F=t.f||(t.f=[]);
      $('#tyF',v).innerHTML=F.map((f,i)=>`<tr>
        <td><input class="tyf mono" data-i="${i}" data-c="k" value="${esc(f.k||'')}" style="${cel}" ${ro}></td>
        <td><input class="tyf" data-i="${i}" data-c="l" value="${esc(f.l||'')}" style="${cel}" ${ro}></td>
        <td><select class="tyf" data-i="${i}" data-c="t" style="${cel}" ${ro}>
          ${CHAMP_TYPES.map(([a,b2])=>`<option value="${a}" ${(f.t||'t')===a?'selected':''}>${esc(b2)}</option>`).join('')}</select></td>
        <td><input class="tyf" data-i="${i}" data-c="o" value="${esc((f.o||[]).join(' ; '))}"
          placeholder="${f.t==='s'?'Choix 1 ; Choix 2':'—'}" ${f.t==='s'?'':'disabled'} style="${cel}" ${ro}></td>
        <td style="text-align:center"><input type="checkbox" class="tyf" data-i="${i}" data-c="full" ${f.full?'checked':''} ${ro}></td>
        <td><button class="btn sm" data-mv="${i}" data-d="-1" ${ro}>↑</button>
            <button class="btn sm" data-mv="${i}" data-d="1" ${ro}>↓</button>
            <button class="btn sm dgr" data-rm="${i}" ${ro}>×</button></td></tr>`).join('')
        ||'<tr><td colspan="6"><div class="empty">Aucun champ. Ce type n\'aurait que son niveau d\'alerte.</div></td></tr>';

      $$('#tyF .tyf',v).forEach(x=>x.addEventListener('change',()=>{
        const f=F[+x.dataset.i],c=x.dataset.c;
        if(c==='full'){x.checked?f.full=1:delete f.full}
        else if(c==='o'){const l=x.value.split(';').map(s=>s.trim()).filter(Boolean);
          if(l.length)f.o=l;else delete f.o}
        else if(c==='t'){f.t=x.value;if(f.t!=='s')delete f.o;champs()}
        else f[c]=x.value;
        TYP.sale=true;
      }));
      $$('#tyF [data-mv]',v).forEach(b=>b.onclick=()=>{
        const i=+b.dataset.mv,j=i+ +b.dataset.d;
        if(j<0||j>=F.length)return;
        const tmp=F[i];F[i]=F[j];F[j]=tmp;TYP.sale=true;champs();
      });
      $$('#tyF [data-rm]',v).forEach(b=>b.onclick=()=>{F.splice(+b.dataset.rm,1);TYP.sale=true;champs()});
    };
    champs();

    const lier=(id,cle,transf)=>{const x=$('#'+id,v);if(!x)return;
      x.addEventListener('change',()=>{const val=transf?transf(x.value):x.value;
        if(val===''||val===null||(Array.isArray(val)&&!val.length))delete t[cle];else t[cle]=val;
        TYP.sale=true;liste();editeur()})};
    lier('tyL','l');lier('tyG','g');lier('tyP','p');lier('tyIc','ic');
    const cles=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
    lier('tyTi','titre',cles);lier('tyTi2','titre2',cles);
    const cc=$('#tyC',v),ct=$('#tyCT',v);
    if(cc)cc.addEventListener('change',()=>{t.c=cc.value;TYP.sale=true;liste();editeur()});
    if(ct)ct.addEventListener('change',()=>{if(/^#[0-9a-f]{6}$/i.test(ct.value)){t.c=ct.value;TYP.sale=true;liste();editeur()}});
    const sc=$('#tySc',v);
    if(sc)sc.addEventListener('change',()=>{t.sc=sc.value;TYP.sale=true});
    $$('.tyCa',v).forEach(x=>x.addEventListener('change',()=>{
      t.carte=t.carte||[];
      const i=+x.dataset.i;t.carte[i]=t.carte[i]||['',''];
      if(x.dataset.p==='0')t.carte[i][0]=x.value||null;
      else{const m=x.value.trim().split(/\s+/).filter(Boolean);t.carte[i][1]=m.length>1?m:(m[0]||'')}
      t.carte=t.carte.filter(c=>c&&(c[0]||c[1]));
      TYP.sale=true;
    }));
    $('#tyAddF',v).onclick=()=>{(t.f=t.f||[]).push({k:'nouveau_champ',l:'Nouveau champ',t:'t'});TYP.sale=true;editeur()};
    $('#tyDel',v).onclick=()=>{
      const n=compte[k]||0;
      confirmDlg('Supprimer le type',
        `Le type <b>${esc(t.l||k)}</b> sera retiré du schéma.`+
        (n?` <b>${n} élément${n>1?'s':''}</b> du tableau ${n>1?'utilisent':'utilise'} ce type et ${n>1?'deviendront illisibles':'deviendra illisible'}.`:' Aucun élément ne l\'utilise.'),
        'Supprimer',()=>{delete B[k];TYP.sel=null;TYP.sale=true;pTypes(v)},true);
    };
  };

  /* ---- intitulés de liaison ---- */
  const relations=()=>{
    $('#tyRelN',v).textContent=TYP.relations.length+' intitulés';
    $('#tyRel',v).innerHTML=TYP.relations.map((r,i)=>`
      <span style="display:inline-flex;align-items:center;gap:5px;background:var(--paper);border:1px solid #C9B383;
        border-radius:12px;padding:3px 5px 3px 10px;font-size:12px">
        <input data-ri="${i}" value="${esc(r)}" ${ro}
          style="border:0;background:none;padding:0;width:${Math.max(7,r.length)}ch;font-size:12px;color:var(--ink)">
        <button class="btn sm dgr" data-rrm="${i}" style="padding:0 5px;border-radius:9px" ${ro}>×</button></span>`).join('')
      ||'<span class="muted">Aucun intitulé. Ajoutez-en au moins un.</span>';
    $$('#tyRel [data-ri]',v).forEach(x=>x.addEventListener('change',()=>{
      const t2=x.value.trim();
      if(!t2){relations();return}
      TYP.relations[+x.dataset.ri]=t2;TYP.sale=true;relations();
    }));
    $$('#tyRel [data-rrm]',v).forEach(b=>b.onclick=()=>{
      TYP.relations.splice(+b.dataset.rrm,1);TYP.sale=true;relations();
    });
  };

  familles();liste();editeur();relations();

  $('#tyFamAdd').onclick=()=>{
    modal({title:'Nouvelle famille',ok:'Ajouter',
      body:'<div class="f"><label>Nom de la famille</label><input id="nfG" placeholder="Renseignement"></div>',
      onOk:sc=>{
        const g=$('#nfG',sc).value.trim();
        if(!g){toast('Nom manquant','','err');return false}
        if(TYP.familles.indexOf(g)!==-1){toast('Cette famille existe déjà','','err');return false}
        TYP.familles.push(g);TYP.sale=true;pTypes(v);
      }});
  };

  $('#tyRelAdd').onclick=()=>{
    const x=$('#tyRelNew',v),t2=x.value.trim();
    if(!t2)return;
    if(TYP.relations.indexOf(t2)!==-1)return toast('Intitulé déjà présent','','warn');
    TYP.relations.push(t2);x.value='';TYP.sale=true;relations();
  };

  $('#tyNew').onclick=()=>{
    modal({title:'Nouveau type d\'élément',ok:'Créer',
      body:`<div class="f"><label>Clé (sans espace ni accent, elle ne changera plus)</label>
          <input id="nkK" class="mono" placeholder="informateur"></div>
        <div class="f"><label>Nom affiché</label><input id="nkL" placeholder="Informateur"></div>
        <div class="f"><label>Famille</label><select id="nkG">
          ${typFamillesVues().map(g=>`<option>${esc(g)}</option>`).join('')||'<option>Sans famille</option>'}</select></div>`,
      onOk:sc=>{
        const k=$('#nkK',sc).value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
        if(!k)  {toast('Clé manquante','','err');return false}
        if(B[k]){toast('Clé déjà prise','','err');return false}
        B[k]={l:$('#nkL',sc).value.trim()||k,g:$('#nkG',sc).value||'Sans famille',
              c:'#8CB8E4',ic:'doc',p:'sheet',titre:['nom'],carte:[],
              f:[{k:'nom',l:'Nom',t:'t',full:1},{k:'notes',l:'Notes d\'enquête',t:'ta'}]};
        TYP.sel=k;TYP.sale=true;pTypes(v);
      }});
  };

  $('#tyReset').onclick=()=>confirmDlg('Revenir au schéma d\'origine',
    'Familles, types et intitulés de liaison seront remplacés par ceux livrés avec AEGIS. Les éléments déjà posés ne sont pas touchés.',
    'Rétablir',()=>{
      TYP.types=JSON.parse(JSON.stringify(SCHEMA_BASE));
      TYP.familles=[...new Set(Object.keys(TYP.types).map(k=>TYP.types[k].g))];
      TYP.relations=REL_BASE.slice();
      TYP.sel=null;TYP.sale=true;pTypes(v);
    },true);

  $('#tySave').onclick=async()=>{
    if(!TYP.relations.length)return toast('Aucun intitulé de liaison','Il en faut au moins un.','err');
    const b=$('#tySave',v);b.disabled=true;b.textContent='Enregistrement…';
    const paquet={types:TYP.types,familles:typFamillesVues(),relations:TYP.relations};
    const r=await api('/api/sasp/schema',{method:'PUT',body:{data:paquet}});
    b.disabled=false;b.innerHTML=svg(I.chk,13)+'Enregistrer';
    if(!r.ok){toast('Enregistrement impossible',r.data.error||'','err');return}
    appliquerSchema(JSON.parse(JSON.stringify(paquet)));
    TYP.types=null;TYP.sale=false;
    render();pTypes(v);
    toast('Schéma enregistré','Il s\'applique à tout le monde.','ok');
  };
}

/* ---------- administration ---------- */
function pAdmin(v){
  v.innerHTML=`<div class="pwrap">
   <div class="phead"><div><h1>Administration</h1><p>Habilitations, accès nominatifs et sauvegarde du tableau.</p></div></div>
   <section class="sheet"><header><h3>Votre accès</h3></header><div class="bd">
     <div class="grid g3" style="gap:10px">
       ${[['Agent',MOI.nom],['Habilitation',MOI.role],['Droits',MOI.ecriture?'Lecture et écriture':'Lecture seule']]
         .map(([k,x])=>`<div style="background:#F3E9CE;border:1px solid #D6C79F;border-radius:2px;padding:8px 11px">
           <div class="lbl" style="font-size:9px">${k}</div>
           <div style="font-family:var(--f-mono);font-size:12.5px;color:var(--ink)">${esc(x||'—')}</div></div>`).join('')}
     </div></div></section>

   <section class="sheet"><header><h3>Accès nominatifs</h3>
     <div class="r"><span class="tag ${MOI.peutGerer?'t-grn':'t-gry'}">${MOI.peutGerer?'Gestion autorisée':'Consultation refusée'}</span></div></header>
     <div class="bd" id="acBd">
       ${MOI.peutGerer?`
       <p style="margin:0 0 12px;color:var(--ink2);max-width:76ch">Le Command Staff et le Lead CID ont accès de plein droit.
       Cette liste ouvre le tableau à des personnes qui n'ont pas ces rôles. Retirer une ligne ferme l'accès immédiatement.</p>
       <div class="f2" style="max-width:560px;align-items:end">
         <div class="f"><label>Identifiant Discord</label><input id="acId" class="mono" placeholder="17 à 20 chiffres"></div>
         <div class="f"><label>Nom affiché</label><input id="acNom" placeholder="Prénom Nom"></div>
       </div>
       <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px">
         <label style="display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink2)">
           <input type="checkbox" id="acW" checked> Autoriser la modification</label>
         <button class="btn pri" id="acAdd">${svg(I.key,13)}Ouvrir l'accès</button>
       </div>
       <div class="tblwrap"><table class="pt">
         <thead><tr><th style="width:200px">Identifiant Discord</th><th>Nom</th><th style="width:130px">Droits</th><th style="width:180px">Ouvert par</th><th style="width:60px"></th></tr></thead>
         <tbody id="acBody"><tr><td colspan="5"><div class="empty">Chargement…</div></td></tr></tbody>
       </table></div>`
       :`<div class="empty"><b>Réservé au Command Staff et au Lead CID</b>Vous pouvez consulter le tableau, mais pas gérer les accès.</div>`}
     </div></section>

   <section class="sheet"><header><h3>Contenu des fiches</h3></header><div class="bd">
     <p style="margin:0 0 12px;color:var(--ink2);max-width:76ch">Les champs de chaque type d'élément, leurs listes de choix, leur couleur et leur support papier se règlent dans <b>Types d'éléments</b>. Le schéma est partagé : une modification vaut pour tout le monde.</p>
     <a class="btn" href="#/types">${svg(I.filt,13)}Ouvrir les types d'éléments</a>
   </div></section>

   <section class="sheet"><header><h3>Sauvegarde</h3></header><div class="bd">
     <p style="margin:0 0 12px;color:var(--ink2)">Le tableau est enregistré sur le serveur à chaque modification, avec un numéro de version qui empêche deux personnes de s'écraser sans le savoir. Exportez une copie avant une manipulation lourde.</p>
     <div style="display:flex;gap:8px;flex-wrap:wrap">
       <button class="btn" id="aExp">${svg(I.dl,13)}Exporter en JSON</button>
       <button class="btn" id="aImp" ${MOI.ecriture?'':'disabled'}>${svg(I.copy,13)}Importer</button>
     </div>
     <div class="lbl" style="margin-top:12px">${S.nodes.length} éléments · ${S.edges.length} liaisons · version ${S.version}</div>
   </div></section>
  </div>`;
  $('#aExp').onclick=exportJson;
  $('#aImp').onclick=importJson;
  if(!MOI.peutGerer)return;

  const remplir=async()=>{
    const r=await api('/api/sasp/comptes');
    const c=(r.ok&&r.data.comptes)||[];
    $('#acBody',v).innerHTML=c.map(x=>`<tr>
      <td class="mono">${esc(x.discord_id)}</td>
      <td><span class="ttl">${esc(x.nom||'—')}</span></td>
      <td><span class="tag ${x.peut_ecrire?'t-grn':'t-gry'}">${x.peut_ecrire?'Écriture':'Lecture'}</span></td>
      <td class="mono" style="font-size:11px;color:var(--ink3)">${esc(x.ajoute_par||'—')}</td>
      <td><button class="btn sm dgr" data-del="${esc(x.discord_id)}">${svg(I.trash,12)}</button></td></tr>`).join('')
      ||'<tr><td colspan="5"><div class="empty"><b>Aucun accès nominatif</b>Seuls les porteurs des rôles Discord accèdent au tableau.</div></td></tr>';
    $$('[data-del]',v).forEach(b=>b.onclick=()=>{
      const id=b.dataset.del;
      confirmDlg('Fermer l\'accès',`L'accès de <b>${esc(id)}</b> sera fermé immédiatement.`,'Fermer l\'accès',async()=>{
        const r=await api('/api/sasp/comptes?discord_id='+encodeURIComponent(id),{method:'DELETE'});
        if(r.ok){toast('Accès fermé','','ok');remplir()}else toast('Échec',r.data.error||'','err');
      },true);
    });
  };
  remplir();
  $('#acAdd').onclick=async()=>{
    const id=$('#acId',v).value.trim(),nom=$('#acNom',v).value.trim();
    if(!/^\d{17,20}$/.test(id))return toast('Identifiant invalide','Un identifiant Discord fait 17 à 20 chiffres.','err');
    const r=await api('/api/sasp/comptes',{method:'POST',body:{discord_id:id,nom:nom,peut_ecrire:$('#acW',v).checked}});
    if(r.ok){$('#acId',v).value='';$('#acNom',v).value='';toast('Accès ouvert',nom||id,'ok');remplir()}
    else toast('Échec',r.data.error||'','err');
  };
}

/* ============================================================
   BARRES D'OUTILS · RECHERCHE · RACCOURCIS
   ============================================================ */
function buildTools(){
