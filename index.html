<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SASP SUD · Poste de travail</title>
<link rel="icon" href="assets/sasp-sud-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --nuit:#070C16; --nuit2:#0B1220; --nuit3:#111B2E;
  --vitre:rgba(18,29,48,.72); --vitre2:rgba(26,40,64,.62);
  --bord:rgba(120,160,215,.16); --bord2:rgba(120,160,215,.30);
  --bleu:#3B82F6; --bleu2:#60A5FA; --bleu-sombre:#1E3A6B;
  --or:#C8A24A; --vert:#34D399; --ambre:#FBBF24; --rouge:#F87171;
  --t0:#F1F5FB; --t1:#C3D0E2; --t2:#8FA3BF; --t3:#63789A;
  --f:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--f);font-size:14px;color:var(--t0);background:var(--nuit);
  overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bleu);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(120,160,215,.22);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(120,160,215,.38);background-clip:padding-box}

/* ── le fond ──────────────────────────────────────────────────── */
#fond{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
    radial-gradient(1200px 620px at 50% 34%, rgba(40,70,120,.30), transparent 70%),
    radial-gradient(900px 520px at 84% 92%, rgba(150,95,40,.16), transparent 70%),
    linear-gradient(180deg,#060A12 0%,#0A1120 45%,#0D1424 100%)}
#fond .ecusson{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
  width:min(52vw,620px);opacity:.055;filter:grayscale(1) contrast(1.2)}
#fond .ville{position:absolute;left:0;right:0;bottom:0;height:34%;
  background:linear-gradient(180deg,transparent,rgba(4,8,14,.86));
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 55%)}
#fond .sasp{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);
  font-weight:700;font-size:min(9vw,116px);letter-spacing:.06em;color:rgba(190,205,230,.05);
  white-space:nowrap;user-select:none}
#fond .sasp span{display:block;font-size:.16em;letter-spacing:.5em;text-align:center;
  color:rgba(190,205,230,.06);margin-top:.1em}

/* ── plan de travail ──────────────────────────────────────────── */
#bureau{position:fixed;inset:0 0 78px 0;z-index:1;overflow:auto;padding:26px 30px 20px}
.grille{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;
  max-width:1720px;margin:0 auto;align-items:start}
@media (max-width:1180px){ .grille{grid-template-columns:1fr} }

.marque{display:flex;align-items:center;gap:18px;margin-bottom:30px}
.marque img{width:78px;height:78px;object-fit:contain;
  filter:drop-shadow(0 4px 16px rgba(0,0,0,.6))}
.marque h1{margin:0;font-size:38px;font-weight:700;letter-spacing:.03em;line-height:1}
.marque p{margin:6px 0 0;font-size:13px;letter-spacing:.22em;color:var(--bleu2);
  text-transform:uppercase;font-weight:500}

.bienvenue{display:flex;gap:12px;align-items:flex-start;margin-bottom:26px;max-width:620px}
.bienvenue .ic{font-size:22px;line-height:1.1}
.bienvenue h2{margin:0;font-size:17px;font-weight:600;color:var(--bleu2);
  text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(96,165,250,.4)}
.bienvenue p{margin:8px 0 0;color:var(--t1);line-height:1.65;font-size:13.5px}

.sec{display:flex;align-items:center;gap:14px;margin:0 0 16px}
.sec b{font-size:13px;font-weight:600;color:var(--bleu2);letter-spacing:.04em;white-space:nowrap}
.sec i{flex:1;height:1px;background:linear-gradient(90deg,var(--bord2),transparent)}

.dossiers{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px;
  max-width:620px}
.doss{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer;
  background:var(--vitre);border:1px solid var(--bord);border-radius:10px;
  backdrop-filter:blur(14px);transition:background .14s,border-color .14s,transform .1s;
  text-align:left;width:100%}
.doss:hover{background:var(--vitre2);border-color:var(--bord2);transform:translateY(-1px)}
.doss:active{transform:translateY(0)}
.doss svg{flex:none}
.doss span{font-size:13.5px;color:var(--t0);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doss .pastille{margin-left:auto;flex:none;min-width:19px;height:19px;padding:0 6px;border-radius:10px;
  background:var(--bleu);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}
.doss.ajout{border-style:dashed;justify-content:center;color:var(--t2);background:transparent}
.doss.ajout:hover{color:var(--t1)}

/* ── panneaux de droite ───────────────────────────────────────── */
.panneau{background:var(--vitre);border:1px solid var(--bord);border-radius:var(--r);
  backdrop-filter:blur(16px);margin-bottom:20px;overflow:hidden}
.panneau > header{display:flex;align-items:center;gap:10px;padding:15px 18px 0}
.panneau > header h3{margin:0;font-size:15px;font-weight:600}
.panneau .bd{padding:16px 18px 18px}

.meteo{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.meteo .lieu{font-size:14px;color:var(--t1);margin-bottom:10px}
.meteo .deg{display:flex;align-items:center;gap:12px}
.meteo .deg .ic{font-size:30px}
.meteo .deg b{font-size:36px;font-weight:600;line-height:1}
.meteo .deg sup{font-size:15px;color:var(--t2);font-weight:400}
.meteo .etat{font-size:12.5px;color:var(--t2);margin-top:8px}
.meteo .heure{font-size:36px;font-weight:600;line-height:1;text-align:right}
.meteo .jour{font-size:12.5px;color:var(--t2);margin-top:8px;text-align:right}
.jours{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:20px;
  padding-top:16px;border-top:1px solid var(--bord)}
.jours div{text-align:center}
.jours .j{font-size:11px;color:var(--t2);letter-spacing:.08em;font-weight:500}
.jours .i{font-size:19px;margin:7px 0}
.jours .h{font-size:12.5px;font-weight:600}
.jours .b{font-size:11.5px;color:var(--t3)}

.annonce{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--bord)}
.annonce:last-child{border-bottom:0}
.annonce .pt{flex:none;width:7px;height:7px;border-radius:50%;background:var(--bleu);margin-top:6px}
.annonce b{display:block;font-size:13.5px;font-weight:600;color:var(--bleu2)}
.annonce p{margin:4px 0 0;font-size:12.5px;color:var(--t2);line-height:1.6}
.plus{display:flex;align-items:center;width:100%;padding:12px 18px;background:rgba(255,255,255,.03);
  border:0;border-top:1px solid var(--bord);color:var(--t1);cursor:pointer;font-size:13px}
.plus:hover{background:rgba(255,255,255,.06);color:var(--t0)}
.plus span{margin-left:auto}

/* ── barre des tâches ─────────────────────────────────────────── */
#barre{position:fixed;left:0;right:0;bottom:0;height:78px;z-index:40;display:flex;align-items:center;
  gap:4px;padding:0 14px;background:rgba(8,13,23,.90);border-top:1px solid var(--bord);
  backdrop-filter:blur(20px)}
.tache{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  min-width:96px;height:62px;padding:0 14px;border:0;border-radius:9px;background:transparent;
  color:var(--t2);cursor:pointer;transition:background .13s,color .13s;position:relative}
.tache:hover{background:rgba(255,255,255,.06);color:var(--t0)}
.tache.on{background:var(--bleu);color:#fff}
.tache.ouvert:not(.on){color:var(--t0)}
.tache.ouvert:after{content:"";position:absolute;bottom:5px;left:50%;transform:translateX(-50%);
  width:18px;height:2.5px;border-radius:2px;background:currentColor;opacity:.75}
.tache .et{font-size:11.5px;font-weight:500;white-space:nowrap}
.tache .badge{position:absolute;top:6px;right:12px;min-width:17px;height:17px;padding:0 5px;
  border-radius:9px;background:var(--rouge);color:#3B0A0A;font-size:10.5px;font-weight:700;
  display:grid;place-items:center}
#barre .demarrer{width:52px;min-width:52px}
#barre .fin{margin-left:auto;display:flex;gap:4px;align-items:center}
#barre .sep{width:1px;height:36px;background:var(--bord);margin:0 8px}

/* ── fenêtres ─────────────────────────────────────────────────── */
.fen{position:fixed;z-index:20;display:flex;flex-direction:column;
  background:rgba(11,18,32,.96);border:1px solid var(--bord2);border-radius:var(--r);
  box-shadow:0 30px 80px rgba(0,0,0,.66),0 0 0 1px rgba(0,0,0,.4);
  backdrop-filter:blur(20px);overflow:hidden;min-width:340px;min-height:220px}
.fen.plein{left:0 !important;top:0 !important;width:100% !important;
  height:calc(100% - 78px) !important;border-radius:0;border-width:0 0 1px 0}
.fen.range{display:none}
.fen > header{display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;height:44px;flex:none;
  background:rgba(255,255,255,.035);border-bottom:1px solid var(--bord);cursor:grab;user-select:none}
.fen > header.tire{cursor:grabbing}
.fen > header .ti{flex:1;min-width:0;font-size:13.5px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fen > header .st{font-size:11.5px;color:var(--t3);font-weight:400;margin-left:8px}
.fbtn{width:38px;height:32px;display:grid;place-items:center;background:transparent;border:0;
  border-radius:6px;color:var(--t2);cursor:pointer}
.fbtn:hover{background:rgba(255,255,255,.09);color:var(--t0)}
.fbtn.fermer:hover{background:#DC2626;color:#fff}
.fen .corps{flex:1;min-height:0;overflow:auto;position:relative}
.fen iframe{width:100%;height:100%;border:0;display:block;background:var(--nuit)}
.poignee{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;z-index:3}
.poignee:after{content:"";position:absolute;right:4px;bottom:4px;width:8px;height:8px;
  border-right:2px solid var(--bord2);border-bottom:2px solid var(--bord2)}

/* ── éléments communs aux applications ────────────────────────── */
.pad{padding:20px 22px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;
  background:rgba(255,255,255,.06);border:1px solid var(--bord);color:var(--t0);
  cursor:pointer;font-size:13px;transition:background .13s,border-color .13s}
.btn:hover{background:rgba(255,255,255,.11);border-color:var(--bord2)}
.btn.pri{background:var(--bleu);border-color:transparent;color:#fff;font-weight:500}
.btn.pri:hover{background:#2F74E8}
.btn.dgr{background:rgba(248,113,113,.13);border-color:rgba(248,113,113,.3);color:#FCA5A5}
.btn.dgr:hover{background:rgba(248,113,113,.22)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.champ{width:100%;padding:9px 12px;border-radius:8px;background:rgba(255,255,255,.05);
  border:1px solid var(--bord);color:var(--t0);font-size:13.5px;outline:none}
.champ:focus{border-color:var(--bleu);background:rgba(255,255,255,.08)}
.champ::placeholder{color:var(--t3)}
textarea.champ{resize:vertical;min-height:90px;line-height:1.65;font-family:var(--f)}
.lbl{display:block;font-size:11.5px;font-weight:600;color:var(--t2);letter-spacing:.07em;
  text-transform:uppercase;margin-bottom:6px}
.onglets{display:flex;gap:3px;padding:0 14px;border-bottom:1px solid var(--bord);flex:none;
  background:rgba(255,255,255,.02);overflow-x:auto}
.onglets button{padding:12px 15px;background:transparent;border:0;border-bottom:2px solid transparent;
  color:var(--t2);cursor:pointer;font-size:13px;white-space:nowrap}
.onglets button:hover{color:var(--t0)}
.onglets button.on{color:var(--bleu2);border-bottom-color:var(--bleu)}
.vide{padding:44px 24px;text-align:center;color:var(--t3)}
.vide b{display:block;font-size:15px;color:var(--t1);margin-bottom:7px;font-weight:600}
.puce{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;
  font-size:11px;font-weight:600;letter-spacing:.03em}
.p-bleu{background:rgba(59,130,246,.16);color:var(--bleu2)}
.p-vert{background:rgba(52,211,153,.14);color:var(--vert)}
.p-ambre{background:rgba(251,191,36,.14);color:var(--ambre)}
.p-rouge{background:rgba(248,113,113,.14);color:var(--rouge)}
.p-gris{background:rgba(143,163,191,.13);color:var(--t2)}

/* ── connexion ────────────────────────────────────────────────── */
#porte{position:fixed;inset:0;z-index:90;display:none;place-items:center;padding:24px}
#porte.on{display:grid}
.pcard{width:min(430px,100%);background:var(--vitre);border:1px solid var(--bord2);
  border-radius:18px;backdrop-filter:blur(24px);padding:38px 34px;text-align:center;
  box-shadow:0 40px 90px rgba(0,0,0,.7)}
.pcard img{width:82px;height:82px;object-fit:contain;margin-bottom:20px}
.pcard h2{margin:0 0 10px;font-size:21px;font-weight:700}
.pcard p{margin:0 0 22px;color:var(--t2);line-height:1.7;font-size:13.5px}
.tourne{width:30px;height:30px;margin:0 auto 18px;border:3px solid rgba(120,160,215,.2);
  border-top-color:var(--bleu);border-radius:50%;animation:tourner .8s linear infinite}
@keyframes tourner{to{transform:rotate(360deg)}}

/* ── ouverture de session ─────────────────────────────────────── */
#ouverture{position:fixed;inset:0;z-index:95;display:none;
  align-items:center;justify-content:center;flex-direction:column;
  background:radial-gradient(900px 560px at 50% 42%, #101B31 0%, #070C16 62%, #04070D 100%)}
#ouverture.on{display:flex}
#ouverture.parte{animation:sessionSort .55s ease forwards}
@keyframes sessionSort{to{opacity:0;transform:scale(1.04);visibility:hidden}}

.ovAvatar{position:relative;width:118px;height:118px;margin-bottom:22px;
  animation:ovMonte .5s cubic-bezier(.2,.8,.3,1) both}
.ovAvatar img,.ovAvatar .init{width:118px;height:118px;border-radius:50%;object-fit:cover;
  border:2px solid rgba(120,160,215,.35);background:#16233C;display:grid;place-items:center;
  font-size:38px;font-weight:600;color:var(--bleu2);letter-spacing:.02em}
/* L anneau tourne pendant les verifications, et s arrete quand elles sont finies. */
.ovAnneau{position:absolute;inset:-9px;border-radius:50%;border:2px solid transparent;
  border-top-color:var(--bleu);border-right-color:rgba(59,130,246,.35);
  animation:tourner 1.1s linear infinite}
#ouverture.fini .ovAnneau{border-color:rgba(52,211,153,.75);animation:none;
  transition:border-color .3s}

.ovNom{font-size:27px;font-weight:600;letter-spacing:.01em;
  animation:ovMonte .5s .08s cubic-bezier(.2,.8,.3,1) both}
.ovRole{font-size:13px;color:var(--t2);margin-top:7px;letter-spacing:.14em;text-transform:uppercase;
  animation:ovMonte .5s .16s cubic-bezier(.2,.8,.3,1) both}
.ovAdr{font-family:var(--fm);font-size:12px;color:var(--t3);margin-top:5px;
  animation:ovMonte .5s .22s cubic-bezier(.2,.8,.3,1) both}
@keyframes ovMonte{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:none}}

.ovBarre{width:230px;height:2px;border-radius:2px;background:rgba(120,160,215,.16);
  margin:30px 0 18px;overflow:hidden}
.ovBarre i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--bleu),var(--bleu2));
  transition:width .32s ease}

.ovEtapes{display:flex;flex-direction:column;gap:7px;min-height:74px;width:290px}
.ovEtape{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--t3);
  opacity:0;transform:translateY(5px);transition:opacity .26s,transform .26s,color .26s}
.ovEtape.vue{opacity:1;transform:none;color:var(--t2)}
.ovEtape.faite{color:var(--vert)}
.ovEtape .marque{flex:none;width:15px;text-align:center;font-size:12px}

.ovPasser{position:absolute;bottom:34px;font-size:11.5px;color:var(--t3);
  letter-spacing:.05em;animation:ovMonte .5s 1.4s both}

/* ── notifications ───────────────────────────────────────────── */
#avis{position:fixed;right:18px;bottom:92px;z-index:80;display:flex;flex-direction:column;
  gap:10px;align-items:flex-end}
.avis{display:flex;gap:11px;align-items:flex-start;min-width:270px;max-width:370px;
  padding:13px 15px;border-radius:11px;background:rgba(17,27,46,.97);border:1px solid var(--bord2);
  border-left:3px solid var(--bleu);box-shadow:0 16px 40px rgba(0,0,0,.6);animation:entre .22s}
.avis.ok{border-left-color:var(--vert)} .avis.err{border-left-color:var(--rouge)}
.avis.warn{border-left-color:var(--ambre)}
.avis b{display:block;font-size:13.5px;font-weight:600}
.avis span{font-size:12.5px;color:var(--t2);line-height:1.55}
.avis .x{margin-left:auto;background:none;border:0;color:var(--t3);cursor:pointer;padding:0 2px}
.avis .x:hover{color:var(--t0)}
@keyframes entre{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

/* ── boîtes de dialogue ──────────────────────────────────────── */
.voile{position:fixed;inset:0;z-index:70;background:rgba(4,8,15,.72);backdrop-filter:blur(4px);
  display:grid;place-items:center;padding:24px;animation:apparait .16s}
@keyframes apparait{from{opacity:0}to{opacity:1}}
.dlg{width:min(560px,100%);max-height:86vh;display:flex;flex-direction:column;
  background:rgba(13,21,37,.98);border:1px solid var(--bord2);border-radius:14px;
  box-shadow:0 34px 80px rgba(0,0,0,.7)}
.dlg > header{display:flex;align-items:center;gap:10px;padding:16px 20px;
  border-bottom:1px solid var(--bord)}
.dlg > header h3{margin:0;font-size:16px;font-weight:600}
.dlg .bd{padding:20px;overflow:auto}
.dlg > footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;
  border-top:1px solid var(--bord)}
@media (max-width:760px){
  #bureau{padding:18px 16px 12px}
  .marque h1{font-size:27px} .marque img{width:58px;height:58px}
  .fen{left:0 !important;top:0 !important;width:100% !important;height:calc(100% - 78px) !important;
    border-radius:0}
  .tache{min-width:64px} .tache .et{display:none}
}
</style>
</head>
<body>

<div id="fond">
  <img class="ecusson" src="assets/sasp-sud-logo.png" alt="">
  <div class="sasp">SASP<span>SAN ANDREAS STATE POLICE</span></div>
  <div class="ville"></div>
</div>

<div id="bureau">
  <div class="grille">
    <div>
      <div class="marque">
        <img src="assets/sasp-sud-logo.png" alt="SASP">
        <div>
          <h1 id="mqTitre">SASP SUD</h1>
          <p>San Andreas State Police</p>
        </div>
      </div>

      <div class="bienvenue">
        <span class="ic">🎓</span>
        <div>
          <h2 id="acTitre">Bienvenue</h2>
          <p id="acTexte">Chargement du poste de travail…</p>
        </div>
      </div>

      <div class="sec"><b>Accès rapide</b><i></i></div>
      <div class="dossiers" id="dossiers"></div>
    </div>

    <div>
      <div class="panneau">
        <div class="bd">
          <div class="meteo">
            <div>
              <div class="lieu">Los Santos</div>
              <div class="deg"><span class="ic" id="mtIc">☀️</span>
                <b id="mtDeg">—</b><sup>°F</sup></div>
              <div class="etat" id="mtEtat">—</div>
            </div>
            <div>
              <div class="heure" id="mtHeure">--:--</div>
              <div class="jour" id="mtJour">—</div>
            </div>
          </div>
          <div class="jours" id="mtJours"></div>
        </div>
      </div>

      <div class="panneau">
        <header><span>📣</span><h3>Annonces</h3></header>
        <div class="bd" id="annonces"><div class="vide" style="padding:20px 0">Chargement…</div></div>
        <button class="plus" id="plusAnnonces">Voir toutes les annonces <span>→</span></button>
      </div>
    </div>
  </div>
</div>

<div id="barre">
  <button class="tache demarrer" id="btDemarrer" title="Menu">

<script>
/* ============================================================
   POSTE DE TRAVAIL SASP
   La page est statique et se telecharge donc toujours. Elle ne
   contient aucune donnee : tout vient de /api/bureau/, qui relit
   les roles Discord a chaque requete.
   ============================================================ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!==undefined)n.innerHTML=h;return n};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const API='https://sasp-intranet-bot.louisleurin.workers.dev';

let SB=null, SESSION=null, MOI=null;

async function api(chemin,opts){
  opts=opts||{};
  const h={};
  if(SESSION&&SESSION.access_token)h.authorization='Bearer '+SESSION.access_token;
  if(opts.body)h['content-type']='application/json';
  let r;
  try{
    r=await fetch(API+chemin,{method:opts.method||'GET',headers:h,
      body:opts.body?JSON.stringify(opts.body):undefined});
  }catch(e){ return {statut:0,ok:false,data:{error:'Serveur injoignable.'}}; }
  let d=null; try{ d=await r.json(); }catch(e){}
  return {statut:r.status,ok:r.ok,data:d||{}};
}

/* ---------- notifications ---------- */
function avis(titre,texte,genre,ms){
  const n=el('div','avis '+(genre||''),
    `<div style="flex:1;min-width:0"><b>${esc(titre)}</b>${texte?`<span>${esc(texte)}</span>`:''}</div>
     <button class="x" title="Fermer">✕</button>`);
  $('#avis').appendChild(n);
  let parti=false;
  const fermer=()=>{ if(parti)return; parti=true;
    n.style.transition='opacity .25s,transform .25s';
    n.style.opacity=0;n.style.transform='translateX(20px)';
    setTimeout(()=>n.remove(),260); };
  $('.x',n).onclick=fermer;
  let t=setTimeout(fermer,ms||4200);
  n.addEventListener('mouseenter',()=>clearTimeout(t));
  n.addEventListener('mouseleave',()=>{t=setTimeout(fermer,1400)});
  return fermer;
}

/* ---------- boîtes de dialogue ---------- */
function dlg(o){
  const voile=el('div','voile');
  voile.innerHTML=`<div class="dlg"><header><h3>${esc(o.titre)}</h3>
    <button class="fbtn" data-x style="margin-left:auto">✕</button></header>
    <div class="bd">${o.corps}</div>
    <footer>${o.pied||`<button class="btn" data-x>Annuler</button>
      <button class="btn pri" data-ok>${esc(o.ok||'Valider')}</button>`}</footer></div>`;
  $('#dlgRoot').appendChild(voile);
  const fermer=()=>{voile.remove();document.removeEventListener('keydown',ech)};
  const ech=e=>{if(e.key==='Escape')fermer()};
  document.addEventListener('keydown',ech);
  voile.addEventListener('mousedown',e=>{if(e.target===voile)fermer()});
  $$('[data-x]',voile).forEach(b=>b.onclick=fermer);
  const ok=$('[data-ok]',voile);
  if(ok)ok.onclick=()=>{ if(!o.onOk||o.onOk(voile)!==false)fermer(); };
  if(o.apres)o.apres(voile,fermer);
  return {voile,fermer};
}
function confirmer(titre,texte,libelle,onOk,danger){
  dlg({titre,corps:`<p style="margin:0;line-height:1.7;color:var(--t1)">${texte}</p>`,
    pied:`<button class="btn" data-x>Annuler</button>
          <button class="btn ${danger?'dgr':'pri'}" data-ok>${esc(libelle)}</button>`,onOk});
}

/* ============================================================
   FENÊTRES
   Le bureau garde une seule fenetre par application : rouvrir
   « Mail » ramene celle qui existe au lieu d'en empiler une
   deuxieme, comme le ferait un vrai poste.
   ============================================================ */
const FEN={}; let zTop=20, decalage=0;

function fenetre(cle,o){
  if(FEN[cle]){ activerFenetre(cle); return FEN[cle]; }
  const f=el('div','fen');
  const l=Math.min(o.l||940,innerWidth-60), h=Math.min(o.h||620,innerHeight-140);
  const g=Math.max(20,Math.round((innerWidth-l)/2)+decalage-60);
  const t=Math.max(14,Math.round((innerHeight-78-h)/2)+decalage-40);
  decalage=(decalage+30)%150;
  f.style.cssText=`left:${g}px;top:${t}px;width:${l}px;height:${h}px;z-index:${++zTop}`;
  f.innerHTML=`<header>
      <span style="font-size:15px">${o.icone||'🗂️'}</span>
      <span class="ti">${esc(o.titre)}${o.sous?`<span class="st">${esc(o.sous)}</span>`:''}</span>
      <button class="fbtn" data-reduire title="Réduire">─</button>
      <button class="fbtn" data-plein title="Agrandir">▢</button>
      <button class="fbtn fermer" data-fermer title="Fermer">✕</button>
    </header>
    <div class="corps"></div>
    <div class="poignee"></div>`;
  $('#fenetres').appendChild(f);

  const obj={cle,el:f,corps:$('.corps',f),titre:o.titre,icone:o.icone||'🗂️',rangee:false};
  FEN[cle]=obj;
  if(o.html)obj.corps.innerHTML=o.html;

  const tete=$('header',f);
  f.addEventListener('mousedown',()=>activerFenetre(cle),true);
  $('[data-fermer]',f).onclick=e=>{e.stopPropagation();fermerFenetre(cle)};
  $('[data-reduire]',f).onclick=e=>{e.stopPropagation();rangerFenetre(cle)};
  $('[data-plein]',f).onclick=e=>{e.stopPropagation();f.classList.toggle('plein')};
  tete.addEventListener('dblclick',()=>f.classList.toggle('plein'));

  // Déplacement
  tete.addEventListener('mousedown',e=>{
    if(e.target.closest('.fbtn'))return;
    if(f.classList.contains('plein'))return;
    const r=f.getBoundingClientRect(), dx=e.clientX-r.left, dy=e.clientY-r.top;
    tete.classList.add('tire');
    const mv=ev=>{
      f.style.left=Math.max(-r.width+90,Math.min(innerWidth-90,ev.clientX-dx))+'px';
      f.style.top=Math.max(0,Math.min(innerHeight-120,ev.clientY-dy))+'px';
    };
    const up=()=>{tete.classList.remove('tire');
      window.removeEventListener('mousemove',mv);window.removeEventListener('mouseup',up)};
    window.addEventListener('mousemove',mv);window.addEventListener('mouseup',up);
    e.preventDefault();
  });

  // Redimensionnement
  $('.poignee',f).addEventListener('mousedown',e=>{
    const r=f.getBoundingClientRect(), x0=e.clientX, y0=e.clientY;
    const mv=ev=>{
      f.style.width=Math.max(340,r.width+ev.clientX-x0)+'px';
      f.style.height=Math.max(220,r.height+ev.clientY-y0)+'px';
    };
    const up=()=>{window.removeEventListener('mousemove',mv);window.removeEventListener('mouseup',up)};
    window.addEventListener('mousemove',mv);window.addEventListener('mouseup',up);
    e.preventDefault();e.stopPropagation();
  });

  if(o.apres)o.apres(obj);
  activerFenetre(cle);
  majTaches();
  return obj;
}
function activerFenetre(cle){
  const o=FEN[cle]; if(!o)return;
  o.rangee=false; o.el.classList.remove('range');
  o.el.style.zIndex=++zTop;
  Object.keys(FEN).forEach(k=>FEN[k].active=(k===cle));
  majTaches();
}
function rangerFenetre(cle){
  const o=FEN[cle]; if(!o)return;
  o.rangee=true; o.active=false; o.el.classList.add('range'); majTaches();
}
function fermerFenetre(cle){
  const o=FEN[cle]; if(!o)return;
  if(o.avantFermeture)o.avantFermeture();
  o.el.remove(); delete FEN[cle]; majTaches();
}
function basculerFenetre(cle){
  const o=FEN[cle]; if(!o)return false;
  if(o.rangee||!o.active)activerFenetre(cle); else rangerFenetre(cle);
  return true;
}

/* ============================================================
   BARRE DES TÂCHES
   ============================================================ */
let RACCOURCIS=[];
function majTaches(){
  const z=$('#taches');
  z.innerHTML=RACCOURCIS.map(r=>{
    const o=FEN[r.cle];
    const cl='tache'+(o?(o.active&&!o.rangee?' on':' ouvert'):'');
    return `<button class="${cl}" data-app="${esc(r.cle)}" title="${esc(r.titre)}">
      <span style="font-size:19px">${r.icone}</span><span class="et">${esc(r.court||r.titre)}</span>
      ${r.badge?`<span class="badge">${r.badge}</span>`:''}</button>`;
  }).join('');
  $$('#taches [data-app]',z).forEach(b=>b.onclick=()=>{
    const cle=b.dataset.app;
    if(!basculerFenetre(cle)){
      const r=RACCOURCIS.filter(x=>x.cle===cle)[0];
      if(r&&r.ouvrir)r.ouvrir();
    }
  });
}

/* ============================================================
   MÉTÉO ET HORLOGE
   Los Santos, c'est Los Angeles : la meteo est vraie, prise sans
   cle d'API. Si le service ne repond pas, on n'invente rien, on
   affiche un tiret.
   ============================================================ */
const MT_ICONES={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌦️',
  61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'🌨️',75:'🌨️',80:'🌦️',81:'🌧️',82:'⛈️',95:'⛈️',96:'⛈️',99:'⛈️'};
const MT_ETATS={0:'Ensoleillé',1:'Peu nuageux',2:'Partiellement nuageux',3:'Couvert',
  45:'Brouillard',48:'Brouillard givrant',51:'Bruine',53:'Bruine',55:'Bruine dense',
  61:'Pluie faible',63:'Pluie',65:'Pluie forte',71:'Neige',73:'Neige',75:'Neige forte',
  80:'Averses',81:'Averses',82:'Averses fortes',95:'Orage',96:'Orage',99:'Orage'};

function horloge(){
  const d=new Date();
  const z=x=>String(x).padStart(2,'0');
  $('#mtHeure').textContent=z(d.getHours())+':'+z(d.getMinutes());
  $('#mtJour').textContent=d.toLocaleDateString('fr-FR',
    {weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
async function meteo(){
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=34.05&longitude=-118.24'+
      '&current=temperature_2m,apparent_temperature,weather_code'+
      '&daily=weather_code,temperature_2m_max,temperature_2m_min'+
      '&temperature_unit=fahrenheit&timezone=America%2FLos_Angeles&forecast_days=6');
    if(!r.ok)throw 0;
    const d=await r.json();
    const c=d.current, code=c.weather_code;
    $('#mtIc').textContent=MT_ICONES[code]||'🌤️';
    $('#mtDeg').textContent=Math.round(c.temperature_2m);
    $('#mtEtat').textContent=(MT_ETATS[code]||'—')+
      ' · Ressenti '+Math.round(c.apparent_temperature)+'°F';
    const J=['DIM','LUN','MAR','MER','JEU','VEN','SAM'];
    $('#mtJours').innerHTML=d.daily.time.slice(1,6).map((t,i)=>{
      const j=new Date(t+'T12:00:00');
      const k=d.daily.weather_code[i+1];
      return `<div><div class="j">${J[j.getDay()]}</div>
        <div class="i">${MT_ICONES[k]||'🌤️'}</div>
        <div class="h">${Math.round(d.daily.temperature_2m_max[i+1])}°</div>
        <div class="b">${Math.round(d.daily.temperature_2m_min[i+1])}°</div></div>`;
    }).join('');
  }catch(e){
    $('#mtEtat').textContent='Météo indisponible';
  }
}

/* ---------- fenêtre qui contient un site existant ---------- */

// leur propre feuille de style et leurs propres variables globales. Les
// fondre dans le bureau les casserait ; on les ouvre dans un cadre, ce

/* ---------- une division ---------- */
function ouvrirDivision(code){
  const d=MOI.toutes.filter(x=>x.code===code)[0]||{code,nom:code};
  const lead=MOI.divisions.some(x=>x.code===code&&x.lead);
  fenetre('div:'+code,{titre:d.nom,sous:code,icone:'🚔',l:980,h:660,apres:o=>{
    o.corps.style.display='flex';
    o.corps.style.flexDirection='column';
    o.corps.innerHTML=`
      <div class="onglets">
        <button data-t="global" class="on">💬 Discussion générale</button>
        ${lead?'<button data-t="lead">🛡️ Discussion encadrement</button>':''}
        <button data-t="docs">📄 Documents</button>
        <button data-t="contacts">📮 Demandes reçues</button>
      </div>
      <div style="flex:1;min-height:0;display:flex;flex-direction:column" id="dvCorps"></div>`;
    const corps=$('#dvCorps',o.corps);
    const aller=t=>{
      $$('.onglets button',o.corps).forEach(b=>b.classList.toggle('on',b.dataset.t===t));
      if(o.arret){o.arret();o.arret=null}
      if(t==='global'||t==='lead')filDiscussion(o,corps,code,t);
      else if(t==='docs')filDocuments(corps,code,lead);
      else filContacts(corps,code);
    };
    $$('.onglets button',o.corps).forEach(b=>b.onclick=()=>aller(b.dataset.t));
    o.avantFermeture=()=>{ if(o.arret)o.arret(); };
    aller('global');
  }});
}

/* ---------- discussion ---------- */
function filDiscussion(fen,zone,code,portee){
  zone.innerHTML=`
    <div id="msgs" style="flex:1;min-height:0;overflow:auto;padding:16px 20px"></div>
    <div style="flex:none;padding:12px 16px;border-top:1px solid var(--bord);display:flex;gap:9px">
      <input class="champ" id="msgTxt" placeholder="Écrire un message…" autocomplete="off">
      <button class="btn pri" id="msgEnv">Envoyer</button>
    </div>`;
  const liste=$('#msgs',zone), champ=$('#msgTxt',zone);
  let dernier=0, premier=true;

  const rendre=(msgs,ajout)=>{
    if(!ajout)liste.innerHTML='';
    if(!msgs.length&&!ajout&&!liste.children.length){
      liste.innerHTML='<div class="vide"><b>Aucun message</b>Ouvrez la discussion.</div>';
      return;
    }
    if(msgs.length&&liste.querySelector('.vide'))liste.innerHTML='';
    msgs.forEach(m=>{
      if(m.id>dernier)dernier=m.id;
      const moi=m.auteur_id===MOI.discord_id;
      liste.appendChild(el('div','',`
        <div style="display:flex;gap:10px;padding:7px 0">
          <div style="flex:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;
            background:${moi?'var(--bleu-sombre)':'rgba(255,255,255,.06)'};font-size:12px;font-weight:600">
            ${esc((m.auteur_nom||'?').replace(/^\[[^\]]*\]\s*/,'').slice(0,2).toUpperCase())}</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;gap:8px;align-items:baseline">
              <b style="font-size:13px;color:${moi?'var(--bleu2)':'var(--t0)'}">${esc(m.auteur_nom||'—')}</b>
              ${m.auteur_role==='Encadrement'?'<span class="puce p-ambre">Encadrement</span>':''}
              <span style="font-size:11px;color:var(--t3);margin-left:auto">
                ${new Date(m.created_at).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span>
            </div>
            <div style="font-size:13.5px;color:var(--t1);line-height:1.6;margin-top:3px;
              white-space:pre-wrap;word-break:break-word">${esc(m.texte)}</div>
          </div>
        </div>`));
    });
    if(msgs.length)liste.scrollTop=liste.scrollHeight;
  };

  const charger=async()=>{
    const r=await api('/api/bureau/division/'+code+'/messages?portee='+portee+
      (dernier?'&depuis='+dernier:''));
    if(!r.ok){
      if(premier)zone.innerHTML=`<div class="vide"><b>Discussion fermée</b>${esc(r.data.error||'')}</div>`;
      return false;
    }
    rendre(r.data.messages||[],!premier);
    premier=false;
    return true;
  };

  const envoyer=async()=>{
    const t=champ.value.trim(); if(!t)return;
    champ.value='';
    const r=await api('/api/bureau/division/'+code+'/messages?portee='+portee,
      {method:'POST',body:{texte:t}});
    if(!r.ok){ avis('Message non envoyé',r.data.error||'','err'); champ.value=t; return; }
    charger();
  };
  $('#msgEnv',zone).onclick=envoyer;
  champ.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();envoyer()} });

  charger().then(ok=>{
    if(!ok)return;
    // Interrogation reguliere plutot que temps reel : ouvrir les tables
    // au navigateur demonterait tout le controle des roles.
    const t=setInterval(charger,3000);
    fen.arret=()=>clearInterval(t);
  });
}

/* ---------- documents ---------- */
function filDocuments(zone,code,lead){
  zone.innerHTML=`<div style="flex:1;min-height:0;overflow:auto" id="docs"></div>
    <div style="flex:none;padding:12px 16px;border-top:1px solid var(--bord)">
      <button class="btn pri" id="docAdd">＋ Ajouter un document</button></div>`;
  const liste=$('#docs',zone);

  const charger=async()=>{
    const r=await api('/api/bureau/division/'+code+'/documents');
    if(!r.ok){liste.innerHTML=`<div class="vide"><b>Indisponible</b>${esc(r.data.error||'')}</div>`;return}
    const docs=r.data.documents||[];
    liste.innerHTML=docs.length?`<div class="pad" style="display:grid;gap:10px">${docs.map(d=>`
      <div style="padding:14px 16px;border-radius:10px;border:1px solid var(--bord);
        background:rgba(255,255,255,.035)">
        <div style="display:flex;gap:9px;align-items:center">
          <span style="font-size:16px">${d.type==='lien'?'🔗':d.type==='procedure'?'📋':d.type==='rapport'?'📊':'📄'}</span>
          <b style="font-size:14px">${esc(d.titre)}</b>
          <span class="puce p-gris">${esc(d.type)}</span>
          <span style="margin-left:auto;font-size:11.5px;color:var(--t3)">
            ${esc(d.ajoute_par||'—')} · ${new Date(d.created_at).toLocaleDateString('fr-FR')}</span>
        </div>

/* ============================================================
   MESSAGERIE
   Les adresses en @sasp.com sont internes au site : elles ne
   partent pas sur le vrai courrier, et rien ne rentre depuis
   l'extérieur. C'est un annuaire, pas un serveur de mail.
   ============================================================ */
let ANNUAIRE=null;
let MAILS_NON_LUS=0;

async function chargerAnnuaire(){
  if(ANNUAIRE)return ANNUAIRE;
  const r=await api('/api/bureau/annuaire');
  ANNUAIRE=(r.ok&&r.data.annuaire)||[];
  return ANNUAIRE;
}

/* ============================================================
   OUVERTURE DE SESSION
   Le travail est reellement fait pendant l'animation : chaque
   etape attend ce qu'elle annonce. On tient seulement chaque
   ligne assez longtemps pour qu'elle se lise, sinon la sequence
   defile trop vite pour vouloir dire quoi que ce soit.
   ============================================================ */
let SESSION_VUE=false;

const initiales=nom=>String(nom||'')
  .replace(/^\[[^\]]*\]\s*/,'')
  .split(/\s+/).filter(Boolean).slice(0,2)
  .map(m=>m[0]).join('').toUpperCase()||'??';

const matricule=nom=>{
  const m=String(nom||'').match(/^\[([^\]]+)\]/);
  return m?m[1].trim():null;
};

function ouvertureSession(moi,taches){
  return new Promise(resolve=>{
    const z=$('#ouverture');
    const mat=matricule(moi.nom);
    const propre=String(moi.nom||'').replace(/^\[[^\]]*\]\s*/,'');
    const role=moi.command_staff?'Command Staff'
      :moi.superviseur?'Supervisor Team'
      :moi.divisions.length?moi.divisions.map(d=>d.code).join(' · ')
      :'Agent';

    z.innerHTML=`
      <div class="ovAvatar">
        <div class="ovAnneau"></div>
        ${moi.avatar
          ? `<img src="${esc(moi.avatar)}" alt=""
               onerror="this.outerHTML='<div class=\\'init\\'>${esc(initiales(moi.nom))}</div>'">`
          : `<div class="init">${esc(initiales(moi.nom))}</div>`}
      </div>
      <div class="ovNom">${esc(propre)}</div>
      <div class="ovRole">${mat?'Matricule '+esc(mat)+' · ':''}${esc(role)}</div>
      <div class="ovAdr">${esc(moi.adresse)}</div>
      <div class="ovBarre"><i id="ovProg"></i></div>
      <div class="ovEtapes" id="ovEtapes">${taches.map((t,i)=>
        `<div class="ovEtape" data-e="${i}"><span class="marque">○</span><span>${esc(t.libelle)}</span></div>`
      ).join('')}</div>
      <div class="ovPasser">Cliquez pour passer</div>`;
    z.classList.add('on');
    z.classList.remove('fini','parte');

    let fini=false;
    const sortir=()=>{
      if(fini)return; fini=true;
      z.classList.add('fini');
      setTimeout(()=>{
        z.classList.add('parte');
        setTimeout(()=>{z.classList.remove('on','parte');resolve()},560);
      },260);
    };
    // Passer n'annule pas le chargement : il continue en arriere-plan,
    // seule l'attente visuelle est ecourtee.
    z.onclick=sortir;
    const clav=e=>{ if(e.key==='Enter'||e.key===' '||e.key==='Escape')sortir(); };
    document.addEventListener('keydown',clav,{once:true});

    (async()=>{
      const attendre=ms=>new Promise(r=>setTimeout(r,ms));
      for(let i=0;i<taches.length;i++){
        if(fini)break;
        const ligne=$(`[data-e="${i}"]`,z);
        if(ligne)ligne.classList.add('vue');
        // Le vrai travail et le temps de lecture avancent ensemble : on
        // attend le plus lent des deux, jamais l'un puis l'autre.
        const t0=Date.now();
        try{ if(taches[i].faire)await taches[i].faire(); }catch(e){}
        const reste=Math.max(0,(taches[i].duree||380)-(Date.now()-t0));
        await attendre(reste);
        if(ligne){ ligne.classList.add('faite'); $('.marque',ligne).textContent='✓'; }
        const p=$('#ovProg',z);
        if(p)p.style.width=Math.round((i+1)/taches.length*100)+'%';
      }
      if(!fini)await new Promise(r=>setTimeout(r,240));
      document.removeEventListener('keydown',clav);
      sortir();
    })();
  });
}

  $('#acTitre').textContent='Bienvenue, '+String(MOI.nom).replace(/^\[[^\]]*\]\s*/,'');
  $('#acTexte').textContent=MOI.divisions.length
    ? 'Vos divisions : '+MOI.divisions.map(d=>d.code).join(', ')+
      '. Votre adresse interne est '+MOI.adresse+'.'
    : 'Vous n\'êtes rattaché à aucune division. Utilisez « Prendre contact » pour vous adresser à l\'une d\'elles.';

  const D=[
    {t:'Police Academy',i:ICO.dossierOr,f:()=>ouvrirSite('pa','Police Academy','🎓','pa.html','intranet')},
    {t:'CID · AEGIS',   i:ICO.dossierOr,f:()=>ouvrirSite('aegis','AEGIS','🛡️','sasp/liaisons/','outil d\'enquête')},
    {t:'Divisions',     i:ICO.dossier,  f:ouvrirDivisions},
    {t:'Messagerie',    i:ICO.dossier,  f:ouvrirMail, badge:()=>MAILS_NON_LUS},
    {t:'Mes demandes',  i:ICO.dossier,  f:ouvrirMesDemandes}
  ];
  MOI.divisions.forEach(d=>D.push({t:d.code+' · '+d.nom,i:ICO.dossier,f:()=>ouvrirDivision(d.code)}));

  $('#dossiers').innerHTML=D.map((d,i)=>`
    <button class="doss" data-i="${i}">${d.i}<span>${esc(d.t)}</span>
      ${d.badge&&d.badge()?`<span class="pastille">${d.badge()}</span>`:''}</button>`).join('')+
    `<button class="doss ajout" id="dsAjout">＋ Ajouter un raccourci</button>`;
  $$('#dossiers [data-i]').forEach(b=>b.onclick=()=>D[+b.dataset.i].f());
  $('#dsAjout').onclick=()=>avis('Bientôt','Les raccourcis personnels arrivent dans une prochaine version.','warn');

  RACCOURCIS=[
    {cle:'pa',   titre:'Police Academy',icone:'🎓',court:'Academy',
     ouvrir:()=>ouvrirSite('pa','Police Academy','🎓','pa.html','intranet')},
    {cle:'aegis',titre:'AEGIS',icone:'🛡️',court:'AEGIS',
     ouvrir:()=>ouvrirSite('aegis','AEGIS','🛡️','sasp/liaisons/','outil d\'enquête')},
    {cle:'divisions',titre:'Divisions',icone:'🚔',court:'Divisions',ouvrir:ouvrirDivisions},
    {cle:'mail',titre:'Messagerie',icone:'✉️',court:'Mail',ouvrir:ouvrirMail,badge:0},
    {cle:'demandes',titre:'Mes demandes',icone:'📮',court:'Demandes',ouvrir:ouvrirMesDemandes}
  ];
  majTaches();

  $('#barreFin').innerHTML=`
    <div class="sep"></div>
    <button class="tache" id="btProfil"><span style="font-size:19px">👤</span><span class="et">Profil</span></button>
    <button class="tache" id="btSortie"><span style="font-size:19px">⏻</span><span class="et">Déconnexion</span></button>`;
  $('#btProfil').onclick=()=>dlg({titre:'Mon profil',pied:'<button class="btn pri" data-x>Fermer</button>',
    corps:`<div style="display:grid;gap:12px">
      ${[['Agent',MOI.nom],['Adresse interne',MOI.adresse],['Identifiant Discord',MOI.discord_id],
         ['Command Staff',MOI.command_staff?'oui':'non'],['Supervisor Team',MOI.superviseur?'oui':'non'],
         ['Divisions',MOI.divisions.map(d=>d.code+(d.lead?' (encadrement)':'')).join(', ')||'aucune']]
        .map(([k,v])=>`<div style="display:flex;gap:12px;padding:10px 12px;border-radius:9px;
          background:rgba(255,255,255,.04)">
          <span style="flex:none;width:150px;font-size:12px;color:var(--t3)">${k}</span>
          <span style="font-size:13.5px">${esc(v||'—')}</span></div>`).join('')}
    </div>`});
  $('#btSortie').onclick=()=>confirmer('Déconnexion','Vous serez déconnecté du poste de travail.',
    'Se déconnecter',async()=>{ try{await SB.auth.signOut()}catch(e){} location.reload(); },true);

  $('#btDemarrer').onclick=()=>ouvrirDivisions();
  $('#plusAnnonces').onclick=()=>avis('Annonces','Le journal complet arrivera avec la prochaine étape.','warn');
}

/* ---------- porte d'entrée ---------- */
const LOGO='assets/sasp-sud-logo.png';
function porte(etat,info){
  const g=$('#porte'), c=$('#pcard');
  if(!etat){g.classList.remove('on');return}
  g.classList.add('on');
  const v={
    chargement:()=>`<div class="tourne"></div><h2>Ouverture de session</h2>
      <p>Vérification de votre identité et de vos rôles Discord…</p>`,
    connexion:()=>`<img src="${LOGO}" alt="SASP"><h2>San Andreas State Police</h2>
      <p>Poste de travail réservé au personnel. Identifiez-vous avec Discord pour ouvrir votre session.</p>
      <button class="btn pri" id="pLog" style="width:100%;justify-content:center;padding:11px">
        Se connecter avec Discord</button>`,
    refus:()=>`<img src="${LOGO}" alt="SASP"><h2>Accès refusé</h2>
      <p>${esc((info&&info.message)||'Votre compte n\'a pas accès au poste de travail.')}</p>
      <button class="btn" id="pOut" style="width:100%;justify-content:center">Changer de compte</button>`,
    panne:()=>`<img src="${LOGO}" alt="SASP"><h2>Poste indisponible</h2>
      <p>${esc((info&&info.error)||'Le serveur n\'a pas répondu.')}</p>
      <button class="btn pri" id="pRetry" style="width:100%;justify-content:center">Réessayer</button>`
  };
  c.innerHTML=v[etat]();
  const b=$('#pLog',c);
  if(b)b.onclick=async()=>{
    b.disabled=true;b.textContent='Redirection…';
    await SB.auth.signInWithOAuth({provider:'discord',
      options:{redirectTo:location.href.split('#')[0].split('?')[0]}});
  };
  const rt=$('#pRetry',c); if(rt)rt.onclick=()=>demarrer();
  const so=$('#pOut',c); if(so)so.onclick=async()=>{
    try{await SB.auth.signOut()}catch(e){} location.reload(); };
}

async function demarrer(){
  porte('chargement');
  if(!SB)SB=supabase.createClient(SUPABASE_URL,SUPABASE_ANON,
    {auth:{detectSessionInUrl:true,flowType:'pkce'}});
  try{ const {data}=await SB.auth.getSession(); SESSION=data.session; }catch(e){ SESSION=null; }
  if(!SESSION){porte('connexion');return}

  const r=await api('/api/bureau/moi');
  if(r.statut===401){porte('connexion');return}
  if(r.statut===403){porte('refus',r.data);return}
  if(!r.ok){porte('panne',r.data);return}

  MOI=r.data;
  porte(null);

  // La sequence ne se rejoue pas sur un simple reessai : elle marque
  // l arrivee sur le poste, pas chaque rechargement de donnees.
  if(!SESSION_VUE){
    SESSION_VUE=true;
    await ouvertureSession(MOI,[
      {libelle:"Identite verifiee aupres de Discord",duree:420},
      {libelle:"Roles et divisions charges",duree:400,
       faire:async()=>{ construireBureau(); }},
      {libelle:"Messagerie interrogee",duree:420,faire:veilleMail},
      {libelle:"Annonces de l etat-major",duree:360,faire:async()=>{ annonces(); }},
      {libelle:"Poste de travail pret",duree:300}
    ]);
  }else{
    construireBureau();
    annonces();
    veilleMail();
  }
  setInterval(veilleMail,60000);
}

horloge();
setInterval(horloge,10000);
meteo();
setInterval(meteo,15*60*1000);
demarrer();
</script>
