<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SASP SUD · Poste de travail</title>
<link rel="icon" href="assets/sasp-sud-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --nuit:#070C16; --nuit2:#0B1220; --nuit3:#111B2E;
  --vitre:rgba(18,29,48,.72); --vitre2:rgba(26,40,64,.62);
  --bord:rgba(120,160,215,.16); --bord2:rgba(120,160,215,.30);
  --bleu:#3B82F6; --bleu2:#60A5FA; --bleu-sombre:#1E3A6B;
  --or:#C8A24A; --vert:#34D399; --ambre:#FBBF24; --rouge:#F87171;
  --t0:#F1F5FB; --t1:#C3D0E2; --t2:#8FA3BF; --t3:#63789A;
  --f:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--f);font-size:14px;color:var(--t0);background:var(--nuit);
  overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bleu);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(120,160,215,.22);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(120,160,215,.38);background-clip:padding-box}

/* ── le fond ──────────────────────────────────────────────────── */
#fond{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
    radial-gradient(1200px 620px at 50% 34%, rgba(40,70,120,.30), transparent 70%),
    radial-gradient(900px 520px at 84% 92%, rgba(150,95,40,.16), transparent 70%),
    linear-gradient(180deg,#060A12 0%,#0A1120 45%,#0D1424 100%)}
#fond .ecusson{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
  width:min(52vw,620px);opacity:.055;filter:grayscale(1) contrast(1.2)}
#fond .ville{position:absolute;left:0;right:0;bottom:0;height:34%;
  background:linear-gradient(180deg,transparent,rgba(4,8,14,.86));
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 55%)}
#fond .sasp{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);
  font-weight:700;font-size:min(9vw,116px);letter-spacing:.06em;color:rgba(190,205,230,.05);
  white-space:nowrap;user-select:none}
#fond .sasp span{display:block;font-size:.16em;letter-spacing:.5em;text-align:center;
  color:rgba(190,205,230,.06);margin-top:.1em}

/* ── plan de travail ──────────────────────────────────────────── */
#bureau{position:fixed;inset:0 0 78px 0;z-index:1;overflow:auto;padding:26px 30px 20px}
.grille{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;
  max-width:1720px;margin:0 auto;align-items:start}
@media (max-width:1180px){ .grille{grid-template-columns:1fr} }

.marque{display:flex;align-items:center;gap:18px;margin-bottom:30px}
.marque img{width:78px;height:78px;object-fit:contain;
  filter:drop-shadow(0 4px 16px rgba(0,0,0,.6))}
.marque h1{margin:0;font-size:38px;font-weight:700;letter-spacing:.03em;line-height:1}
.marque p{margin:6px 0 0;font-size:13px;letter-spacing:.22em;color:var(--bleu2);
  text-transform:uppercase;font-weight:500}

.bienvenue{display:flex;gap:12px;align-items:flex-start;margin-bottom:26px;max-width:620px}
.bienvenue .ic{font-size:22px;line-height:1.1}
.bienvenue h2{margin:0;font-size:17px;font-weight:600;color:var(--bleu2);
  text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(96,165,250,.4)}
.bienvenue p{margin:8px 0 0;color:var(--t1);line-height:1.65;font-size:13.5px}

.sec{display:flex;align-items:center;gap:14px;margin:0 0 16px}
.sec b{font-size:13px;font-weight:600;color:var(--bleu2);letter-spacing:.04em;white-space:nowrap}
.sec i{flex:1;height:1px;background:linear-gradient(90deg,var(--bord2),transparent)}

.dossiers{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px;
  max-width:620px}
.doss{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer;
  background:var(--vitre);border:1px solid var(--bord);border-radius:10px;
  backdrop-filter:blur(14px);transition:background .14s,border-color .14s,transform .1s;
  text-align:left;width:100%}
.doss:hover{background:var(--vitre2);border-color:var(--bord2);transform:translateY(-1px)}
.doss:active{transform:translateY(0)}
.doss svg{flex:none}
.doss span{font-size:13.5px;color:var(--t0);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doss .pastille{margin-left:auto;flex:none;min-width:19px;height:19px;padding:0 6px;border-radius:10px;
  background:var(--bleu);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}
.doss.ajout{border-style:dashed;justify-content:center;color:var(--t2);background:transparent}
.doss.ajout:hover{color:var(--t1)}

/* ── panneaux de droite ───────────────────────────────────────── */
.panneau{background:var(--vitre);border:1px solid var(--bord);border-radius:var(--r);
  backdrop-filter:blur(16px);margin-bottom:20px;overflow:hidden}
.panneau > header{display:flex;align-items:center;gap:10px;padding:15px 18px 0}
.panneau > header h3{margin:0;font-size:15px;font-weight:600}
.panneau .bd{padding:16px 18px 18px}

.meteo{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.meteo .lieu{font-size:14px;color:var(--t1);margin-bottom:10px}
.meteo .deg{display:flex;align-items:center;gap:12px}
.meteo .deg .ic{font-size:30px}
.meteo .deg b{font-size:36px;font-weight:600;line-height:1}
.meteo .deg sup{font-size:15px;color:var(--t2);font-weight:400}
.meteo .etat{font-size:12.5px;color:var(--t2);margin-top:8px}
.meteo .heure{font-size:36px;font-weight:600;line-height:1;text-align:right}
.meteo .jour{font-size:12.5px;color:var(--t2);margin-top:8px;text-align:right}
.jours{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:20px;
  padding-top:16px;border-top:1px solid var(--bord)}
.jours div{text-align:center}
.jours .j{font-size:11px;color:var(--t2);letter-spacing:.08em;font-weight:500}
.jours .i{font-size:19px;margin:7px 0}
.jours .h{font-size:12.5px;font-weight:600}
.jours .b{font-size:11.5px;color:var(--t3)}

.annonce{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--bord)}
.annonce:last-child{border-bottom:0}
.annonce .pt{flex:none;width:7px;height:7px;border-radius:50%;background:var(--bleu);margin-top:6px}
.annonce b{display:block;font-size:13.5px;font-weight:600;color:var(--bleu2)}
.annonce p{margin:4px 0 0;font-size:12.5px;color:var(--t2);line-height:1.6}
.plus{display:flex;align-items:center;width:100%;padding:12px 18px;background:rgba(255,255,255,.03);
  border:0;border-top:1px solid var(--bord);color:var(--t1);cursor:pointer;font-size:13px}
.plus:hover{background:rgba(255,255,255,.06);color:var(--t0)}
.plus span{margin-left:auto}

/* ── fenêtres ─────────────────────────────────────────────────── */
.fen{position:fixed;z-index:20;display:flex;flex-direction:column;
  background:rgba(11,18,32,.96);border:1px solid var(--bord2);border-radius:var(--r);
  box-shadow:0 30px 80px rgba(0,0,0,.66),0 0 0 1px rgba(0,0,0,.4);
  backdrop-filter:blur(20px);overflow:hidden;min-width:340px;min-height:220px}
.fen.plein{left:0 !important;top:0 !important;width:100% !important;
  height:calc(100% - 78px) !important;border-radius:0;border-width:0 0 1px 0}
/* En plein ecran natif il n y a plus de barre des taches a eviter. */
.fen:fullscreen{left:0 !important;top:0 !important;
  width:100vw !important;height:100vh !important;border-radius:0;border:0}
.fen.range{display:none}
.fen > header{display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;height:44px;flex:none;
  background:rgba(255,255,255,.035);border-bottom:1px solid var(--bord);cursor:grab;user-select:none}
.fen > header.tire{cursor:grabbing}
.fen > header .ti{flex:1;min-width:0;font-size:13.5px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fen > header .st{font-size:11.5px;color:var(--t3);font-weight:400;margin-left:8px}
.fbtn{width:38px;height:32px;display:grid;place-items:center;background:transparent;border:0;
  border-radius:6px;color:var(--t2);cursor:pointer}
.fbtn:hover{background:rgba(255,255,255,.09);color:var(--t0)}
.fbtn.fermer:hover{background:#DC2626;color:#fff}
.fen .corps{flex:1;min-height:0;overflow:auto;position:relative}
.fen iframe{width:100%;height:100%;border:0;display:block;background:var(--nuit)}
.poignee{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;z-index:3}
.poignee:after{content:"";position:absolute;right:4px;bottom:4px;width:8px;height:8px;
  border-right:2px solid var(--bord2);border-bottom:2px solid var(--bord2)}

/* ── éléments communs aux applications ────────────────────────── */
.pad{padding:20px 22px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;
  background:rgba(255,255,255,.06);border:1px solid var(--bord);color:var(--t0);
  cursor:pointer;font-size:13px;transition:background .13s,border-color .13s}
.btn:hover{background:rgba(255,255,255,.11);border-color:var(--bord2)}
.btn.pri{background:var(--bleu);border-color:transparent;color:#fff;font-weight:500}
.btn.pri:hover{background:#2F74E8}
.btn.dgr{background:rgba(248,113,113,.13);border-color:rgba(248,113,113,.3);color:#FCA5A5}
.btn.dgr:hover{background:rgba(248,113,113,.22)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.champ{width:100%;padding:9px 12px;border-radius:8px;background:rgba(255,255,255,.05);
  border:1px solid var(--bord);color:var(--t0);font-size:13.5px;outline:none}
.champ:focus{border-color:var(--bleu);background:rgba(255,255,255,.08)}
.champ::placeholder{color:var(--t3)}
textarea.champ{resize:vertical;min-height:90px;line-height:1.65;font-family:var(--f)}
.lbl{display:block;font-size:11.5px;font-weight:600;color:var(--t2);letter-spacing:.07em;
  text-transform:uppercase;margin-bottom:6px}
.onglets{display:flex;gap:3px;padding:0 14px;border-bottom:1px solid var(--bord);flex:none;
  background:rgba(255,255,255,.02);overflow-x:auto}
.onglets button{padding:12px 15px;background:transparent;border:0;border-bottom:2px solid transparent;
  color:var(--t2);cursor:pointer;font-size:13px;white-space:nowrap}
.onglets button:hover{color:var(--t0)}
.onglets button.on{color:var(--bleu2);border-bottom-color:var(--bleu)}
.vide{padding:44px 24px;text-align:center;color:var(--t3)}
.vide b{display:block;font-size:15px;color:var(--t1);margin-bottom:7px;font-weight:600}
.puce{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;
  font-size:11px;font-weight:600;letter-spacing:.03em}
.p-bleu{background:rgba(59,130,246,.16);color:var(--bleu2)}
.p-vert{background:rgba(52,211,153,.14);color:var(--vert)}
.p-ambre{background:rgba(251,191,36,.14);color:var(--ambre)}
.p-rouge{background:rgba(248,113,113,.14);color:var(--rouge)}
.p-gris{background:rgba(143,163,191,.13);color:var(--t2)}

/* ── connexion ────────────────────────────────────────────────── */
#porte{position:fixed;inset:0;z-index:90;display:none;place-items:center;padding:24px}
#porte.on{display:grid}
.pcard{width:min(430px,100%);background:var(--vitre);border:1px solid var(--bord2);
  border-radius:18px;backdrop-filter:blur(24px);padding:38px 34px;text-align:center;
  box-shadow:0 40px 90px rgba(0,0,0,.7)}
.pcard img{width:82px;height:82px;object-fit:contain;margin-bottom:20px}
.pcard h2{margin:0 0 10px;font-size:21px;font-weight:700}
.pcard p{margin:0 0 22px;color:var(--t2);line-height:1.7;font-size:13.5px}
.tourne{width:30px;height:30px;margin:0 auto 18px;border:3px solid rgba(120,160,215,.2);
  border-top-color:var(--bleu);border-radius:50%;animation:tourner .8s linear infinite}
@keyframes tourner{to{transform:rotate(360deg)}}

/* ── la barre du bas, sur le modèle de la nav du site ─────────── */
/* Des rubriques en petites capitales, les entrées en dessous, des
   filets verticaux entre les groupes. Exactement la barre que tout le
   monde connaît déjà, ramenée en bas de l'écran. */
#barre{position:fixed;left:0;right:0;bottom:0;height:78px;z-index:40;
  display:flex;align-items:stretch;gap:0;padding:0;
  background:linear-gradient(180deg,rgba(9,15,28,.96),rgba(6,10,20,.98));
  border-top:1px solid var(--bord2);backdrop-filter:blur(20px)}
#bureau{inset:0 0 78px 0}

#barre .menuBt{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;width:82px;border:0;border-right:1px solid var(--bord);background:transparent;
  cursor:pointer;transition:background .13s}
#barre .menuBt:hover,#barre .menuBt.on{background:rgba(59,130,246,.14)}
#barre .menuBt img{width:32px;height:32px;object-fit:contain;opacity:.9}
#barre .menuBt b{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--bleu2)}

#nav{flex:1;min-width:0;display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden}
#nav::-webkit-scrollbar{height:0}
.navGr{flex:none;display:flex;flex-direction:column;justify-content:center;
  padding:8px 20px;border-right:1px solid var(--bord)}
.navGr:last-child{border-right:0}
.navGr > i{font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.17em;
  text-transform:uppercase;color:#4E6488;padding:0 8px 5px;white-space:nowrap}
.navGr > div{display:flex;gap:2px}
.navIt{position:relative;padding:7px 11px;border:0;border-radius:6px;background:transparent;
  color:#B7C4DA;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;
  transition:background .12s,color .12s}
.navIt:hover{background:rgba(255,255,255,.07);color:#fff}
.navIt.on{background:rgba(59,130,246,.9);color:#fff}
.navIt.ouvert:not(.on){color:#fff}
.navIt.ouvert:after{content:"";position:absolute;bottom:1px;left:50%;transform:translateX(-50%);
  width:15px;height:2px;border-radius:2px;background:currentColor;opacity:.75}
.navIt.hors{color:#5C6B85}
.navIt.hors:hover{color:#93A4C0}
.navIt .badge{display:inline-grid;place-items:center;margin-left:6px;min-width:16px;height:16px;
  padding:0 5px;border-radius:8px;background:var(--rouge);color:#3B0A0A;
  font-size:10.5px;font-weight:700;vertical-align:1px}

#barreFin{flex:none;display:flex;align-items:center;gap:4px;padding:0 14px;
  border-left:1px solid var(--bord)}
#barreFin .hr{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;
  padding-right:12px;margin-right:6px;border-right:1px solid var(--bord)}
#barreFin .hr b{font-size:15px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
#barreFin .hr i{font-style:normal;font-size:10.5px;color:var(--t3);margin-top:3px}
#barreFin button{display:flex;flex-direction:column;align-items:center;gap:3px;width:62px;
  padding:7px 0;border:0;border-radius:8px;background:transparent;color:var(--t2);cursor:pointer}
#barreFin button:hover{background:rgba(255,255,255,.07);color:var(--t0)}
#barreFin button span:first-child{font-size:17px;line-height:1}
#barreFin button span:last-child{font-size:10.5px}

/* ── le menu démarrer ─────────────────────────────────────────── */
#menuDem{position:fixed;left:10px;bottom:88px;z-index:60;display:none;width:440px;
  max-height:min(620px,calc(100vh - 120px));flex-direction:column;
  background:rgba(13,20,36,.985);border:1px solid var(--bord2);border-radius:14px;
  box-shadow:0 30px 76px rgba(0,0,0,.7);backdrop-filter:blur(22px);overflow:hidden}
#menuDem.on{display:flex}
#menuDem > header{flex:none;display:flex;align-items:center;gap:12px;padding:16px 18px;
  border-bottom:1px solid var(--bord);background:rgba(255,255,255,.025)}
#menuDem > header img{width:34px;height:34px;border-radius:9px;object-fit:cover}
#menuDem > header b{font-size:14.5px;display:block}
#menuDem > header i{font-style:normal;font-size:11.5px;color:var(--t3);
  font-family:var(--fm);display:block;margin-top:2px}
#menuDem .rech{flex:none;padding:12px 16px 0}
#menuDem .liste{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 14px}
#menuDem .gr{padding:12px 8px 6px;font-size:10px;font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;color:var(--t3)}
#menuDem .gr:first-child{padding-top:2px}
#menuDem .ap{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;
  background:none;border:0;border-radius:8px;color:var(--t1);cursor:pointer;
  font-size:13.5px;text-align:left}
#menuDem .ap:hover{background:rgba(59,130,246,.17);color:#fff}
#menuDem .ap .ic{flex:none;width:30px;height:30px;border-radius:8px;display:grid;
  place-items:center;background:rgba(255,255,255,.055);font-size:15px}
#menuDem .ap .sst{display:block;font-size:11px;color:var(--t3);margin-top:1px}
#menuDem > footer{flex:none;display:flex;gap:6px;padding:10px 14px;
  border-top:1px solid var(--bord);background:rgba(0,0,0,.22)}
#menuDem > footer button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:9px;border:0;border-radius:8px;background:rgba(255,255,255,.05);color:var(--t1);
  cursor:pointer;font-size:12.5px}
#menuDem > footer button:hover{background:rgba(255,255,255,.11);color:#fff}

/* ── les icônes du bureau ─────────────────────────────────────── */
/* Sans elles le bureau n'était qu'une page. On les attrape, on les
   range, on ouvre au double-clic : le geste que tout le monde a. */
#icones{position:absolute;inset:0;z-index:2;pointer-events:none}
.ico{position:absolute;width:96px;padding:9px 4px 8px;border-radius:9px;border:1px solid transparent;
  display:flex;flex-direction:column;align-items:center;gap:7px;cursor:default;
  pointer-events:auto;user-select:none;text-align:center}
.ico:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.08)}
.ico.sel{background:rgba(59,130,246,.25);border-color:rgba(96,165,250,.55)}
.ico.tire{opacity:.7}
.ico .im{width:46px;height:46px;display:grid;place-items:center;font-size:29px;
  filter:drop-shadow(0 3px 7px rgba(0,0,0,.6))}
.ico .nm{font-size:11.5px;line-height:1.32;color:#E8EEF9;font-weight:500;
  text-shadow:0 1px 3px rgba(0,0,0,.9);max-width:88px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ico .pst{position:absolute;top:5px;right:12px;min-width:17px;height:17px;padding:0 5px;
  border-radius:9px;background:var(--rouge);color:#3B0A0A;font-size:10.5px;font-weight:700;
  display:grid;place-items:center}
.ico .cad{position:absolute;bottom:32px;right:16px;font-size:13px;opacity:.85}

/* Le bandeau du bureau laisse la colonne de gauche aux icônes. */
.grille{padding-left:126px}
@media (max-width:900px){ .grille{padding-left:0} }

/* ── le volet des salons, façon volet de navigation ───────────── */
/* Un nom lisible, une icône, et le liseré bleu à gauche de l'entrée
   courante : le volet de navigation de Windows, pas une liste Discord. */
.salons{flex:none;width:238px;display:flex;flex-direction:column;padding:10px 8px;
  background:rgba(255,255,255,.022);border-right:1px solid var(--bord);overflow-y:auto}
.salons .tt{padding:9px 10px 12px;font-size:13.5px;font-weight:700;color:var(--t0);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.salons button{position:relative;display:flex;align-items:center;gap:11px;width:100%;height:38px;
  padding:0 11px;margin-bottom:2px;background:none;border:0;border-radius:7px;color:var(--t1);
  cursor:pointer;font-size:13.5px;text-align:left;transition:background .12s,color .12s}
.salons button:hover{background:rgba(255,255,255,.06);color:var(--t0)}

/* La zone libre du bureau : c est elle qui porte les widgets. */

.voile{position:fixed;inset:0;z-index:70;background:rgba(4,8,15,.72);backdrop-filter:blur(4px);

<body>

<div id="fond">
  <img class="ecusson" src="assets/sasp-sud-logo.png" alt="">
  <div class="sasp">SASP<span>SAN ANDREAS STATE POLICE</span></div>
  <div class="ville"></div>
</div>

<div id="bureau">
  <div class="grille">
    <div>
      <div class="marque">
        <img src="assets/sasp-sud-logo.png" alt="SASP">
        <div>
          <h1 id="mqTitre">SASP SUD</h1>
          <p>San Andreas State Police</p>
        </div>
      </div>

      <div class="bienvenue">
        <span class="ic">🎓</span>
        <div>
          <h2 id="acTitre">Bienvenue</h2>
          <p id="acTexte">Chargement du poste de travail…</p>
        </div>
      </div>

    </div>
  </div>
  <!-- Les widgets vivent ici, libres de position. -->
  <div id="icones"></div>
  <div id="plan"></div>
</div>
<div id="menuBureau"></div>

<div id="menuDem"></div>

<div id="barre">
  <button class="menuBt" id="btDemarrer" title="Menu du poste">
    <img src="assets/sasp-sud-logo.png" alt=""><b>MENU</b>
  </button>
  <nav id="nav"></nav>
  <div id="barreFin"></div>
</div>

<div id="zoneSnap"></div>
<div id="fenetres"></div>
<div id="avis"></div>
<div id="dlgRoot"></div>

<div id="ouverture"></div>
<div id="porte"><div class="pcard" id="pcard"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=20260831-gestion"></script>
<script>
/* ============================================================
   POSTE DE TRAVAIL SASP
   La page est statique et se telecharge donc toujours. Elle ne
   contient aucune donnee : tout vient de /api/bureau/, qui relit
   les roles Discord a chaque requete.
   ============================================================ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!==undefined)n.innerHTML=h;return n};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const API='https://sasp-intranet-bot.louisleurin.workers.dev';

let SB=null, SESSION=null, MOI=null;

async function api(chemin,opts){
  opts=opts||{};
  const h={};
  if(SESSION&&SESSION.access_token)h.authorization='Bearer '+SESSION.access_token;
  if(opts.body)h['content-type']='application/json';
  let r;
  try{
    r=await fetch(API+chemin,{method:opts.method||'GET',headers:h,
      body:opts.body?JSON.stringify(opts.body):undefined});
  }catch(e){ return {statut:0,ok:false,data:{error:'Serveur injoignable.'}}; }
  let d=null; try{ d=await r.json(); }catch(e){}
  return {statut:r.status,ok:r.ok,data:d||{}};
}

/* ---------- notifications ---------- */
function avis(titre,texte,genre,ms){
  const n=el('div','avis '+(genre||''),
    `<div style="flex:1;min-width:0"><b>${esc(titre)}</b>${texte?`<span>${esc(texte)}</span>`:''}</div>
     <button class="x" title="Fermer">✕</button>`);
  $('#avis').appendChild(n);
  let parti=false;
  const fermer=()=>{ if(parti)return; parti=true;
    n.style.transition='opacity .25s,transform .25s';
    n.style.opacity=0;n.style.transform='translateX(20px)';
    setTimeout(()=>n.remove(),260); };
  $('.x',n).onclick=fermer;
  let t=setTimeout(fermer,ms||4200);
  n.addEventListener('mouseenter',()=>clearTimeout(t));
  n.addEventListener('mouseleave',()=>{t=setTimeout(fermer,1400)});
  return fermer;
}

/* ---------- boîtes de dialogue ---------- */
function dlg(o){
  const voile=el('div','voile');
  voile.innerHTML=`<div class="dlg"><header><h3>${esc(o.titre)}</h3>
    <button class="fbtn" data-x style="margin-left:auto">✕</button></header>
    <div class="bd">${o.corps}</div>
    <footer>${o.pied||`<button class="btn" data-x>Annuler</button>
      <button class="btn pri" data-ok>${esc(o.ok||'Valider')}</button>`}</footer></div>`;
  $('#dlgRoot').appendChild(voile);
  const fermer=()=>{voile.remove();document.removeEventListener('keydown',ech)};
  const ech=e=>{if(e.key==='Escape')fermer()};
  document.addEventListener('keydown',ech);
  voile.addEventListener('mousedown',e=>{if(e.target===voile)fermer()});
  $$('[data-x]',voile).forEach(b=>b.onclick=fermer);
  const ok=$('[data-ok]',voile);
  if(ok)ok.onclick=()=>{ if(!o.onOk||o.onOk(voile)!==false)fermer(); };
  if(o.apres)o.apres(voile,fermer);
  return {voile,fermer};
}
function confirmer(titre,texte,libelle,onOk,danger){
  dlg({titre,corps:`<p style="margin:0;line-height:1.7;color:var(--t1)">${texte}</p>`,
    pied:`<button class="btn" data-x>Annuler</button>
          <button class="btn ${danger?'dgr':'pri'}" data-ok>${esc(libelle)}</button>`,onOk});
}

/* ============================================================
   FENÊTRES
   Le bureau garde une seule fenetre par application : rouvrir
   « Mail » ramene celle qui existe au lieu d'en empiler une
   deuxieme, comme le ferait un vrai poste.
   ============================================================ */
const FEN={}; let rangSuivant=0, decalage=0;

// Le plan des fenetres etait un compteur qui ne redescendait jamais : au
// bout d'une vingtaine de clics une fenetre passait par-dessus la barre
// du bas, puis par-dessus le menu et les notifications. On renumerote a
// chaque fois, du plus ancien au plus recent, pour rester dans la bande
// 20-39 reservee aux fenetres.
function empilerFenetres(){
  Object.keys(FEN)
    .sort((a,b)=>(FEN[a].rang||0)-(FEN[b].rang||0))
    .forEach((k,i)=>{ FEN[k].el.style.zIndex=20+i; });
}

function fenetre(cle,o){
  if(FEN[cle]){ activerFenetre(cle); return FEN[cle]; }
  const f=el('div','fen');
  const l=Math.min(o.l||940,innerWidth-60), h=Math.min(o.h||620,innerHeight-140);
  const g=Math.max(20,Math.round((innerWidth-l)/2)+decalage-60);
  const t=Math.max(14,Math.round((innerHeight-60-h)/2)+decalage-40);
  decalage=(decalage+30)%150;
  f.style.cssText=`left:${g}px;top:${t}px;width:${l}px;height:${h}px;z-index:20`;
  f.innerHTML=`<header>
      <span style="font-size:15px">${o.icone||'🗂️'}</span>
      <span class="ti">${esc(o.titre)}${o.sous?`<span class="st">${esc(o.sous)}</span>`:''}</span>
      <button class="fbtn" data-reduire title="Réduire">─</button>
      <button class="fbtn" data-plein title="Agrandir dans le bureau">□</button>
      <button class="fbtn" data-ecran title="Plein écran (F11 de la fenêtre)">⛶</button>
      <button class="fbtn fermer" data-fermer title="Fermer">✕</button>
    </header>
    <div class="corps"></div>
    <div class="poignee"></div>`;
  $('#fenetres').appendChild(f);

  const obj={cle,el:f,corps:$('.corps',f),titre:o.titre,icone:o.icone||'🗂️',rangee:false};
  FEN[cle]=obj;
  if(o.html)obj.corps.innerHTML=o.html;

  const tete=$('header',f);
  f.addEventListener('mousedown',()=>activerFenetre(cle),true);
  $('[data-fermer]',f).onclick=e=>{e.stopPropagation();fermerFenetre(cle)};
  $('[data-reduire]',f).onclick=e=>{e.stopPropagation();rangerFenetre(cle)};
  $('[data-plein]',f).onclick=e=>{e.stopPropagation();f.classList.toggle('plein')};
  tete.addEventListener('dblclick',()=>f.classList.toggle('plein'));

  // Le vrai plein ecran : la fenetre prend l ecran entier, barre des
  // taches comprise. Utile pour AEGIS, dont le liege gagne a tout prendre.
  $('[data-ecran]',f).onclick=async e=>{
    e.stopPropagation();
    try{
      if(document.fullscreenElement===f)await document.exitFullscreen();
      else await f.requestFullscreen();
    }catch(err){ avis('Plein écran refusé',err&&err.message||'','warn'); }
  };

  // Déplacement
  tete.addEventListener('mousedown',e=>{
    if(e.target.closest('.fbtn'))return;
    if(f.classList.contains('plein'))return;
    const r=f.getBoundingClientRect(), dx=e.clientX-r.left, dy=e.clientY-r.top;
    tete.classList.add('tire');
    const zs=$('#zoneSnap'); let place=null;
    const mv=ev=>{
      f.style.left=Math.max(-r.width+90,Math.min(innerWidth-90,ev.clientX-dx))+'px';
      f.style.top=Math.max(0,Math.min(innerHeight-120,ev.clientY-dy))+'px';
      place=ev.clientY<6?'haut':ev.clientX<6?'gauche':ev.clientX>innerWidth-7?'droite':null;
      if(!place){ zs.style.display='none'; return; }
      const H=innerHeight-78;
      const c=place==='haut'?[0,0,innerWidth,H]
        :place==='gauche'?[0,0,innerWidth/2,H]
        :[innerWidth/2,0,innerWidth/2,H];
      zs.style.cssText='display:block;left:'+c[0]+'px;top:'+c[1]+'px;width:'+c[2]+'px;height:'+c[3]+'px';
    };
    const up=()=>{
      tete.classList.remove('tire'); zs.style.display='none';
      if(place==='haut')f.classList.add('plein');
      else if(place){
        f.classList.remove('plein');
        f.style.left=(place==='gauche'?0:innerWidth/2)+'px';
        f.style.top='0px'; f.style.width=(innerWidth/2)+'px';
        f.style.height=(innerHeight-78)+'px';
      }
      window.removeEventListener('mousemove',mv);window.removeEventListener('mouseup',up)};
    window.addEventListener('mousemove',mv);window.addEventListener('mouseup',up);
    e.preventDefault();
  });

  // Redimensionnement
  $('.poignee',f).addEventListener('mousedown',e=>{
    const r=f.getBoundingClientRect(), x0=e.clientX, y0=e.clientY;
    const mv=ev=>{
      f.style.width=Math.max(340,r.width+ev.clientX-x0)+'px';
      f.style.height=Math.max(220,r.height+ev.clientY-y0)+'px';
    };
    const up=()=>{window.removeEventListener('mousemove',mv);window.removeEventListener('mouseup',up)};
    window.addEventListener('mousemove',mv);window.addEventListener('mouseup',up);
    e.preventDefault();e.stopPropagation();
  });

  if(o.apres)o.apres(obj);
  activerFenetre(cle);
  majTaches();
  return obj;
}
function activerFenetre(cle){
  const o=FEN[cle]; if(!o)return;
  o.rangee=false; o.el.classList.remove('range');
  o.rang=++rangSuivant; empilerFenetres();
  Object.keys(FEN).forEach(k=>FEN[k].active=(k===cle));
  majTaches();
}
function rangerFenetre(cle){
  const o=FEN[cle]; if(!o)return;
  o.rangee=true; o.active=false; o.el.classList.add('range'); majTaches();
}
function fermerFenetre(cle){
  const o=FEN[cle]; if(!o)return;
  if(o.avantFermeture)o.avantFermeture();
  o.el.remove(); delete FEN[cle]; majTaches();
}
function basculerFenetre(cle){
  const o=FEN[cle]; if(!o)return false;
  if(o.rangee||!o.active)activerFenetre(cle); else rangerFenetre(cle);
  return true;
}

/* ---------- masquer n'importe quel élément ---------- */
// Ce que l'on masque tient sur le poste, comme la disposition : deux
// personnes n'ont pas le meme bureau.
const MASQUES_CLE='sasp.bureau.masques';
let MASQUES=new Set();
function masquesLire(){
  try{ MASQUES=new Set(JSON.parse(localStorage.getItem(MASQUES_CLE)||'[]')); }
  catch(e){ MASQUES=new Set(); }
}
function masquesEcrire(){
  try{ localStorage.setItem(MASQUES_CLE,JSON.stringify([...MASQUES])); }catch(e){}
}
const estMasque=k=>MASQUES.has(k);
function masquer(k){ MASQUES.add(k); masquesEcrire(); appliquerMasques(); }
function demasquer(k){ MASQUES.delete(k); masquesEcrire(); appliquerMasques(); }

/* ---------- les icônes du bureau ---------- */
const ICONES_CLE='sasp.bureau.icones';
const PAS_ICO=104;          // le pas de la grille, comme sur un bureau Windows
let ICONES=[];

// Le nom court vient de la barre du bas : « Salons PA » plutôt qu'un
// deuxième « Police Academy », « SWAT » plutôt que le nom complet.
const NOM_NAV={};
NAV.forEach(g=>g.it.forEach(it=>{ if(it.d)NOM_NAV[it.d]=it.n; }));
const nomDiv=c=>NOM_NAV[c]||((MOI&&MOI.toutes.filter(d=>d.code===c)[0])||{nom:c}).nom;
const icoDiv=c=>((MOI&&MOI.toutes.filter(d=>d.code===c)[0])||{}).ic||'🚔';

function iconesCatalogue(){
  // Les applications d'abord, puis les unités dont on fait partie :
  // celles-la seules s'ouvrent d'un double-clic.
  const L=[{a:'pa'},{a:'aegis'},{a:'organigramme'},{a:'mail'},{a:'demandes'},{a:'divisions'}];
  if(MOI&&MOI.admin)L.push({a:'gestion'});
  ((MOI&&MOI.divisions)||[]).forEach(d=>L.push({d:d.code}));
  return L;
}
const surGrille=v=>14+Math.round((v-14)/PAS_ICO)*PAS_ICO;
function iconesLire(){
  const cat=iconesCatalogue().filter(x=>!estMasque('ico:'+cleDe(x)));
  let pos={};
  try{ pos=JSON.parse(localStorage.getItem(ICONES_CLE)||'{}')||{}; }catch(e){}
  const parCol=Math.max(3,Math.floor((innerHeight-160)/PAS_ICO));
  return cat.map((x,i)=>{
    const k=cleDe(x), p=pos[k];
    return {...x,cle:k,
      x:p?p.x:14+Math.floor(i/parCol)*PAS_ICO,
      y:p?p.y:14+(i%parCol)*PAS_ICO};
  });
}
function iconesEcrire(){
  const o={}; ICONES.forEach(i=>o[i.cle]={x:i.x,y:i.y});
  try{ localStorage.setItem(ICONES_CLE,JSON.stringify(o)); }catch(e){}
}
function dessinerIcones(){
  const z=$('#icones'); if(!z||!MOI)return;
  if(!ICONES.length)ICONES=iconesLire();
  z.innerHTML=ICONES.map((x,i)=>{
    const ap=x.a?APPS[x.a]:null;
    const nom=ap?ap.n:nomDiv(x.d);
    const b=ap&&ap.badge?ap.badge():0;
    return `<div class="ico" data-i="${i}" style="left:${x.x}px;top:${x.y}px" title="${esc(nom)}">
      <div class="im">${ap?ap.ic:icoDiv(x.d)}</div>
      <div class="nm">${esc(nom)}</div>
      ${b?`<span class="pst">${b}</span>`:''}
      ${FEN[x.cle]?'<span class="cad">▪</span>':''}</div>`;
  }).join('');

  // Le bandeau se decale a droite de la derniere colonne d'icones :
  // il passait dessous des qu'il y en avait plus d'une colonne.
  const g=$('.grille');
  if(g)g.style.paddingLeft=(ICONES.length?Math.max(...ICONES.map(i=>i.x))+PAS_ICO+18:0)+'px';

  $$('.ico',z).forEach(n=>{
    const i=+n.dataset.i;
    n.addEventListener('dblclick',()=>lancer(ICONES[i]));
    n.addEventListener('contextmenu',e=>{
      e.preventDefault(); e.stopPropagation();
      $$('.ico',z).forEach(a=>a.classList.remove('sel')); n.classList.add('sel');
      menuIcone(i,e.clientX,e.clientY);
    });
    n.addEventListener('mousedown',e=>{
      if(e.button!==0)return;
      $$('.ico',z).forEach(a=>a.classList.remove('sel'));
      n.classList.add('sel');
      const r=n.getBoundingClientRect(), dx=e.clientX-r.left, dy=e.clientY-r.top;
      let bouge=false;
      const mv=ev=>{
        if(!bouge&&Math.abs(ev.clientX-e.clientX)+Math.abs(ev.clientY-e.clientY)<4)return;
        bouge=true; n.classList.add('tire');
        ICONES[i].x=Math.max(4,Math.min(innerWidth-110,ev.clientX-dx));
        ICONES[i].y=Math.max(4,Math.min(innerHeight-180,ev.clientY-dy));
        n.style.left=ICONES[i].x+'px'; n.style.top=ICONES[i].y+'px';
      };
      const up=()=>{
        n.classList.remove('tire');
        if(bouge){
          // On repose sur la grille : des icones alignees, comme sur un
          // vrai bureau, plutot que posees au pixel pres.
          ICONES[i].x=surGrille(ICONES[i].x); ICONES[i].y=surGrille(ICONES[i].y);
          n.style.left=ICONES[i].x+'px'; n.style.top=ICONES[i].y+'px';
          iconesEcrire(); dessinerIcones();
        }
        window.removeEventListener('mousemove',mv); window.removeEventListener('mouseup',up);
      };
      window.addEventListener('mousemove',mv); window.addEventListener('mouseup',up);
      e.preventDefault();
    });
  });
}
function rangerIcones(){
  try{ localStorage.removeItem(ICONES_CLE); }catch(e){}
  ICONES=iconesLire(); dessinerIcones();
  avis('Icônes rangées','','ok');
}

const MT_ETATS={0:'Ensoleillé',1:'Peu nuageux',2:'Partiellement nuageux',3:'Couvert',

function horloge(){
  if(!$('#mtHeure'))return;
  const d=new Date();
  const z=x=>String(x).padStart(2,'0');
  $('#mtHeure').textContent=z(d.getHours())+':'+z(d.getMinutes());
  $('#mtJour').textContent=d.toLocaleDateString('fr-FR',
    {weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
async function meteo(){
  if(!$('#mtIc'))return;
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=34.05&longitude=-118.24'+
      '&current=temperature_2m,apparent_temperature,weather_code'+
      '&daily=weather_code,temperature_2m_max,temperature_2m_min'+
      '&temperature_unit=fahrenheit&timezone=America%2FLos_Angeles&forecast_days=6');
    if(!r.ok)throw 0;
    const d=await r.json();
    const c=d.current, code=c.weather_code;
    $('#mtIc').textContent=MT_ICONES[code]||'🌤️';
    $('#mtDeg').textContent=Math.round(c.temperature_2m);
    $('#mtEtat').textContent=(MT_ETATS[code]||'—')+
      ' · Ressenti '+Math.round(c.apparent_temperature)+'°F';
    const J=['DIM','LUN','MAR','MER','JEU','VEN','SAM'];
    $('#mtJours').innerHTML=d.daily.time.slice(1,6).map((t,i)=>{
      const j=new Date(t+'T12:00:00');
      const k=d.daily.weather_code[i+1];
      return `<div><div class="j">${J[j.getDay()]}</div>
        <div class="i">${MT_ICONES[k]||'🌤️'}</div>
        <div class="h">${Math.round(d.daily.temperature_2m_max[i+1])}°</div>
        <div class="b">${Math.round(d.daily.temperature_2m_min[i+1])}°</div></div>`;
    }).join('');
  }catch(e){
    const e2=$('#mtEtat');if(e2)e2.textContent='Météo indisponible';
  }
}

/* ============================================================
   WIDGETS
   Ils flottent librement sur le bureau. Leur disposition est
   propre au poste : elle vit dans le navigateur, pas en base,
   puisque personne d'autre n'a a la subir.
   ============================================================ */
const RANGEMENT='sasp.bureau.widgets';

const CATALOGUE={
  meteo:    {titre:'Météo · Los Santos', icone:'🌤️', l:360, rendre:widMeteo},
  annonces: {titre:'Annonces',           icone:'📣', l:380, rendre:widAnnonces},
  unites:   {titre:'Vos unités',         icone:'🚔', l:330, rendre:widUnites},
  mail:     {titre:'Messagerie',         icone:'✉️', l:330, rendre:widMail},
  demandes: {titre:'Mes demandes',       icone:'📮', l:340, rendre:widDemandes},
  notes:    {titre:'Bloc-notes',         icone:'📝', l:340, rendre:widNotes},
  horloge:  {titre:'Horloge',            icone:'🕐', l:270, rendre:widHorloge}
};

let PLAN=[];

function planLire(){
  try{
    const b=JSON.parse(localStorage.getItem(RANGEMENT)||'null');
    if(Array.isArray(b)&&b.length)return b.filter(w=>CATALOGUE[w.cle]);
  }catch(e){}
  // Disposition d'origine : la colonne de droite d'avant, mais libre.
  const d=innerWidth-400;
  return [
    {cle:'meteo',   x:d, y:24},
    {cle:'unites',  x:d, y:300},
    {cle:'annonces',x:d, y:520}
  ];
}
function planEcrire(){
  try{ localStorage.setItem(RANGEMENT,JSON.stringify(PLAN)); }catch(e){}
}

function dessinerPlan(){
  const z=$('#plan');
  z.innerHTML=PLAN.map((w,i)=>{
    const c=CATALOGUE[w.cle]; if(!c)return '';
    return `<section class="wid" data-w="${i}" style="left:${w.x}px;top:${w.y}px;width:${c.l}px">
      <header><span class="poignet">⠿</span><span style="font-size:15px">${c.icone}</span>
        <h3>${esc(c.titre)}</h3>
        <button class="wx" data-ret="${i}" title="Retirer">✕</button></header>
      <div class="bd" id="w${i}"></div></section>`;
  }).join('');

  PLAN.forEach((w,i)=>{
    const c=CATALOGUE[w.cle]; if(!c)return;
    const corps=$('#w'+i,z); if(corps)c.rendre(corps,i);
  });

  $$('.wid',z).forEach(el2=>{
    const i=+el2.dataset.w;
    const tete=$('header',el2);
    tete.addEventListener('mousedown',e=>{
      if(e.target.closest('.wx'))return;
      const r=el2.getBoundingClientRect(), dx=e.clientX-r.left, dy=e.clientY-r.top;
      tete.classList.add('tire'); el2.classList.add('tire');
      const mv=ev=>{
        // On garde toujours l en-tete attrapable : un widget pousse hors
        // de l ecran serait irrecuperable.
        PLAN[i].x=Math.max(-r.width+120,Math.min(innerWidth-100,ev.clientX-dx));
        PLAN[i].y=Math.max(0,Math.min(innerHeight-120,ev.clientY-dy));
        el2.style.left=PLAN[i].x+'px'; el2.style.top=PLAN[i].y+'px';
      };
      const up=()=>{
        tete.classList.remove('tire'); el2.classList.remove('tire');
        planEcrire();
        window.removeEventListener('mousemove',mv); window.removeEventListener('mouseup',up);
      };
      window.addEventListener('mousemove',mv); window.addEventListener('mouseup',up);
      e.preventDefault();
    });
  });
  $$('[data-ret]',z).forEach(b=>b.onclick=()=>{
    PLAN.splice(+b.dataset.ret,1); planEcrire(); dessinerPlan();
  });
}

function ajouterWidget(cle,x,y){
  if(!CATALOGUE[cle])return;
  PLAN.push({cle,x:Math.round(x??120),y:Math.round(y??120)});
  planEcrire(); dessinerPlan();
  avis('Widget ajouté',CATALOGUE[cle].titre,'ok');
}

function fondLire(){

function fondEcrire(v){

function fondAppliquer(){
  const v=fondLire(), z=$('#fond'); if(!z)return;

  if(!papier){ papier=el('div','papier'); z.insertBefore(papier,z.firstChild); }

    z.style.background=DEGRADE_ORIGINE;
    // Un voile sombre par-dessus la photo : sans lui, le texte clair du
    // bureau devient illisible sur les zones vives.
    papier.style.cssText='position:absolute;inset:0;background-size:cover;'+
      'background-position:center;background-image:'+
      'linear-gradient(180deg,rgba(5,8,14,.62),rgba(5,8,14,.78)),url("'+
      String(v.src).replace(/"/g,'%22')+'")';
  }else{
    papier.style.cssText='display:none';
    z.style.background=(FONDS[v.t]||FONDS.nuit).css;

/* ---------- une division ---------- */
// Chaque division retrouve ses salons Discord, dans le meme ordre et
// sous les memes noms : c'est le site qui vient a l'habitude, pas
// l'inverse.
const SALONS=[
  {c:'annonce',        i:'📣', n:'Annonces',               t:'Publications de l\u0027encadrement'},
  {c:'discussion-lead',i:'🛡️', n:'Discussion encadrement', t:'Entre encadrants uniquement', lead:true},
  {c:'discussion',     i:'💬', n:'Discussion',             t:'Toute la division'},
  {c:'documents',      i:'📄', n:'Documents',              t:'Procédures et fiches'},
  {c:'pseudo',         i:'🏷️', n:'Pseudos',                t:'Nom RP et indicatif'},
  {c:'equipe',         i:'👥', n:'Équipe',                 t:'Composition de la division'}
];

function ouvrirDivision(code,salon){
  const d=MOI.toutes.filter(x=>x.code===code)[0]||{code,nom:code};
  const lead=MOI.divisions.some(x=>x.code===code&&x.lead);
  fenetre('div:'+code,{titre:d.nom,sous:code,icone:d.ic||'🚔',l:1020,h:680,apres:o=>{
    o.corps.style.display='flex';
    o.corps.style.flexDirection='row';
    const dispo=SALONS.filter(s=>!s.lead||lead);
    o.corps.innerHTML=`
      <nav class="salons">
        <div class="tt">${esc(d.nom)}</div>
        ${dispo.map(s=>`<button data-t="${s.c}"><span class="di">${s.i}</span>
          <span class="n">${esc(s.n)}</span></button>`).join('')}
        ${lead?`<hr><button data-t="demandes"><span class="di">📮</span>
          <span class="n">Demandes reçues</span></button>`:''}
      </nav>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column">
        <div class="salonTete" id="dvTete"></div>
        <div style="flex:1;min-height:0;display:flex;flex-direction:column" id="dvCorps"></div>
      </div>`;
    const corps=$('#dvCorps',o.corps), tete=$('#dvTete',o.corps);
    const aller=t=>{
      $$('.salons button',o.corps).forEach(b=>b.classList.toggle('on',b.dataset.t===t));
      if(o.arret){o.arret();o.arret=null}
      const s=SALONS.filter(x=>x.c===t)[0];
      tete.innerHTML=s
        ? `<span class="di">${s.i}</span><b>${esc(s.n)}</b><p>${esc(s.t)}</p>`
        : `<span class="di">📮</span><b>Demandes reçues</b><p>Contacts venus d'autres divisions</p>`;
      if(t==='annonce')        filAnnoncesDivision(corps,code,lead);
      else if(t==='documents') filDocuments(corps,code,lead);
      else if(t==='equipe')    filEquipe(corps,code);
      else if(t==='demandes')  filContacts(corps,code);
      else filDiscussion(o,corps,code,t==='discussion-lead'?'lead':t==='pseudo'?'pseudo':'global');
    };
    $$('.salons button',o.corps).forEach(b=>b.onclick=()=>aller(b.dataset.t));
    o.avantFermeture=()=>{ if(o.arret)o.arret(); };
    aller(dispo.some(s=>s.c===salon)?salon:'discussion');
  }});
}

function filAnnoncesDivision(zone,code,lead){
  zone.innerHTML='<div class="vide">Chargement…</div>';

    if(!r.ok){zone.innerHTML=`<div class="vide"><b>Indisponible</b>${esc(r.data.error||'')}</div>`;return}
    const a=r.data.annonces||[], peut=r.data.peut_publier;
    zone.innerHTML=`<div style="flex:1;min-height:0;overflow:auto" class="pad" id="anL"></div>
      ${peut?`<div style="flex:none;padding:12px 16px;border-top:1px solid var(--bord)">

    $('#anL',zone).innerHTML=a.length?a.map(x=>`<article style="padding:15px 17px;border-radius:11px;

        <div style="display:flex;gap:9px;align-items:center;margin-bottom:6px">

          ${peut?`<button class="btn sm dgr" data-sup="${x.id}">✕</button>`:''}
        </div>
        ${x.corps?`<div style="font-size:13.5px;color:var(--t1);line-height:1.7;
          white-space:pre-wrap">${esc(x.corps)}</div>`:''}
      </article>`).join('')
      :'<div class="vide"><b>Aucune annonce</b>Ce salon est encore vide.</div>';
    const ab=$('#anAdd',zone);
    if(ab)ab.onclick=()=>dlg({titre:'Publier une annonce de division',ok:'Publier',corps:`

      <textarea class="champ" id="adC" style="min-height:140px"></textarea>`,

/* ---------- # equipe ---------- */
function filEquipe(zone,code){
  zone.innerHTML='<div class="vide">Chargement…</div>';
  api('/api/bureau/organigramme').then(r=>{
    if(!r.ok){zone.innerHTML=`<div class="vide"><b>Indisponible</b>${esc(r.data.error||'')}</div>`;return}

    zone.innerHTML=`<div style="flex:1;min-height:0;overflow:auto" class="pad">

// Un bloc de l'organigramme : le meme rendu partout, du salon #equipe
// au dossier Organigramme.
function orgGroupe(titre,gens,chef){
  if(!gens||!gens.length)return '';
  return `<div class="orgBloc"><h3>${esc(titre)}<em>${gens.length}</em></h3>
    <div class="orgGrille">${gens.map(p=>orgCarte(p,chef)).join('')}</div></div>`;
}
function orgCarte(p,chef){
  const ini=(p.nom||'?').split(/\s+/).map(x=>x[0]||'').join('').slice(0,2).toUpperCase();
  return `<div class="orgCarte${chef?' chef':''}">
    <div class="av">${esc(ini)}</div>
    <div style="flex:1;min-width:0">
      <b>${esc(p.nom)}</b>
      ${p.grade?`<div style="font-size:11.5px;color:var(--t2);margin-top:2px">${esc(p.grade)}</div>`:''}
      <div class="fiche">
        <span>${p.matricule?'#'+esc(p.matricule):'matricule -'}</span>
        <span>${p.telephone?esc(p.telephone):'tél. -'}</span>
        <span>${esc(p.mail)}</span>
      </div>
    </div></div>`;
}

// Le nom du rôle, tel que Discord l'affiche. Sans lui on choisit un
// identifiant à l'aveugle, et c'est ainsi que les rôles décoratifs sont
// devenus des identifiants de permission.
const gsRole=id=>(GESTION.roles||[]).filter(r=>r.id===id)[0];
function gsPuceRole(id){
  const r=gsRole(id);
  if(!r)return `<span class="puce p-rouge" title="Ce rôle n'existe plus sur Discord">${esc(id)}</span>`;
  if(r.separateur)return `<span class="puce p-rouge" title="Rôle décoratif : à ne pas utiliser">⚠ ${esc(r.nom)}</span>`;
  return `<span class="puce p-bleu">${esc(r.nom)}</span>`;
}

/* ---------- le sélecteur de rôles ---------- */
// Il refuse les séparateurs plutôt que de les proposer : les avoir ne veut
// pas dire appartenir à la division, et s'en servir comme identifiant de
// permission a déjà rendu sept membres de la Police Academy administrateurs.
function gsChoixRoles(titre, choisis, onOk){
  let sel=new Set(choisis||[]);
  const dispo=(GESTION.roles||[]).filter(r=>!r.gere_par_bot);
  dlg({titre,ok:'Valider',l:640,corps:`
    <input class="champ" id="grF" placeholder="Filtrer les rôles…" autocomplete="off">
    <div id="grL" style="max-height:380px;overflow:auto;margin-top:12px"></div>`,
    apres:v=>{
      const rendre=q=>{
        $('#grL',v).innerHTML=dispo
          .filter(r=>!q||sansAccentSimple(r.nom).indexOf(q)!==-1)
          .map(r=>`<label class="mqLigne" style="cursor:${r.separateur?'not-allowed':'pointer'};
              opacity:${r.separateur?'.45':'1'};margin-bottom:5px">
            <input type="checkbox" data-r="${r.id}" ${sel.has(r.id)?'checked':''}
              ${r.separateur?'disabled':''} style="width:16px;height:16px;flex:none">
            <b style="color:${r.couleur||'inherit'}">${esc(r.nom)}</b>
            ${r.separateur?'<span class="puce p-rouge">décoratif</span>':''}
          </label>`).join('')
          ||'<div class="vide" style="padding:22px">Aucun rôle.</div>';
        $$('[data-r]',v).forEach(c=>c.onchange=()=>{
          c.checked?sel.add(c.dataset.r):sel.delete(c.dataset.r);
        });
      };
      rendre('');
      const f=$('#grF',v);
      f.addEventListener('input',()=>rendre(sansAccentSimple(f.value)));
      setTimeout(()=>f.focus(),40);
    },
    onOk:()=>{ onOk([...sel]); }});
}

             aegis:['🛡️','Ouvrir AEGIS','L\'outil d\'enquête du CID'],
             supervision:['🎖️','Supervision','Publie les annonces, voit toutes les divisions'],
             admin:['⚙️','Administrer les accès','Ouvre cet écran']};
  z.innerHTML=`<div class="pad">
    <p style="margin:0 0 20px;color:var(--t2);line-height:1.65">
      Le Command Staff et l'encadrement de chaque division gardent leurs droits
      quoi qu'il arrive. Ces lignes ne font qu'<b style="color:var(--t1)">ajouter</b> des rôles.</p>
    ${['poste','aegis','supervision','admin'].map(cle=>{
      const a=A.filter(x=>x.cle===cle)[0]||{cle,roles:[]};
      const [ic,nom,aide]=LIB[cle];
      return `<div class="orgCarte" style="align-items:flex-start;margin-bottom:11px">
        <div class="av" style="font-size:18px">${ic}</div>
        <div style="flex:1;min-width:0">
          <b style="font-size:14px">${esc(nom)}</b>
          <div style="font-size:11.5px;color:var(--t3);margin:3px 0 9px">${esc(aide)}</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
            ${(a.roles||[]).map(id=>id===plancher&&cle==='admin'
              ? `<span class="puce p-ambre" title="Non retirable">🔒 ${esc((gsRole(id)||{}).nom||id)}</span>`
              : gsPuceRole(id)).join(' ')||'<span style="color:var(--t3);font-size:12.5px">aucun</span>'}
            <button class="btn sm" data-ac="${cle}">Modifier</button>
          </div>
        </div></div>`;
    }).join('')}
  </div>`;
  $$('[data-ac]',z).forEach(b=>b.onclick=()=>{
    const cle=b.dataset.ac;
    const a=(GESTION.acces||[]).filter(x=>x.cle===cle)[0]||{roles:[]};
    gsChoixRoles(LIB[cle][1], a.roles||[], async choisis=>{

/* ---------- qui accède à quoi ---------- */
function gsQui(z){
  const act=GESTION.actif||{};
  const parRole={};
  const noter=(id,quoi)=>{ (parRole[id]=parRole[id]||[]).push(quoi); };
  (act.poste||[]).forEach(r=>noter(r,'Poste de travail'));
  (act.aegis||[]).forEach(r=>noter(r,'AEGIS'));
  (act.supervision||[]).forEach(r=>noter(r,'Supervision'));
  (act.admin||[]).forEach(r=>noter(r,'Administration'));
  (GESTION.divisions||[]).filter(d=>d.actif).forEach(d=>{
    (d.lead||[]).forEach(r=>noter(r,d.code+' (encadrement)'));
    (d.colead||[]).forEach(r=>noter(r,d.code+' (adjoint)'));
    (d.roles||[]).forEach(r=>noter(r,d.code));
  });
  const ids=Object.keys(parRole).sort((a,b)=>
    ((gsRole(a)||{}).nom||'').localeCompare((gsRole(b)||{}).nom||''));
  z.innerHTML=`<div class="pad">
    <p style="margin:0 0 18px;color:var(--t2);line-height:1.65">
      Ce que chaque rôle Discord ouvre réellement, tel que le serveur l'applique
      en ce moment. <b style="color:var(--t1)">${ids.length}</b> rôles donnent un accès.</p>
    ${ids.map(id=>{
      const r=gsRole(id);
      return `<div class="mqLigne" style="align-items:flex-start">
        <b style="flex:0 0 210px;color:${r&&r.couleur||'inherit'}">
          ${r?esc(r.nom):`<span style="color:var(--rouge)">${esc(id)} (disparu)</span>`}
          ${r&&r.separateur?' <span class="puce p-rouge">décoratif</span>':''}</b>
        <div style="flex:1;display:flex;flex-wrap:wrap;gap:5px">
          ${parRole[id].map(q=>`<span class="puce p-gris">${esc(q)}</span>`).join('')}</div>
      </div>`;
    }).join('')}
  </div>`;
}

/* ---------- discussion ---------- */
function filDiscussion(fen,zone,code,portee){
  zone.innerHTML=`
    <div id="msgs" style="flex:1;min-height:0;overflow:auto;padding:16px 20px"></div>
    <div style="flex:none;padding:12px 16px;border-top:1px solid var(--bord);display:flex;gap:9px">
      <input class="champ" id="msgTxt" placeholder="Écrire un message…" autocomplete="off">
      <button class="btn pri" id="msgEnv">Envoyer</button>
    </div>`;
  const liste=$('#msgs',zone), champ=$('#msgTxt',zone);
  let dernier=0, premier=true;

  const rendre=(msgs,ajout)=>{
    if(!ajout)liste.innerHTML='';
    if(!msgs.length&&!ajout&&!liste.children.length){
      liste.innerHTML='<div class="vide"><b>Aucun message</b>Ouvrez la discussion.</div>';
      return;
    }
    if(msgs.length&&liste.querySelector('.vide'))liste.innerHTML='';
    msgs.forEach(m=>{
      if(m.id>dernier)dernier=m.id;
      const moi=m.auteur_id===MOI.discord_id;
      liste.appendChild(el('div','',`
        <div style="display:flex;gap:10px;padding:7px 0">
          <div style="flex:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;
            background:${moi?'var(--bleu-sombre)':'rgba(255,255,255,.06)'};font-size:12px;font-weight:600">
            ${esc((m.auteur_nom||'?').replace(/^\[[^\]]*\]\s*/,'').slice(0,2).toUpperCase())}</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;gap:8px;align-items:baseline">
              <b style="font-size:13px;color:${moi?'var(--bleu2)':'var(--t0)'}">${esc(m.auteur_nom||'—')}</b>
              ${m.auteur_role==='Encadrement'?'<span class="puce p-ambre">Encadrement</span>':''}
              <span style="font-size:11px;color:var(--t3);margin-left:auto">
                ${new Date(m.created_at).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span>
            </div>
            <div style="font-size:13.5px;color:var(--t1);line-height:1.6;margin-top:3px;
              white-space:pre-wrap;word-break:break-word">${esc(m.texte)}</div>
          </div>
        </div>`));
    });
    if(msgs.length)liste.scrollTop=liste.scrollHeight;
  };

  const charger=async()=>{
    const r=await api('/api/bureau/division/'+code+'/messages?portee='+portee+
      (dernier?'&depuis='+dernier:''));
    if(!r.ok){
      if(premier)zone.innerHTML=`<div class="vide"><b>Discussion fermée</b>${esc(r.data.error||'')}</div>`;
      return false;
    }
    rendre(r.data.messages||[],!premier);
    premier=false;
    return true;
  };

  const envoyer=async()=>{
    const t=champ.value.trim(); if(!t)return;
    champ.value='';
    const r=await api('/api/bureau/division/'+code+'/messages?portee='+portee,
      {method:'POST',body:{texte:t}});
    if(!r.ok){ avis('Message non envoyé',r.data.error||'','err'); champ.value=t; return; }
    charger();
  };
  $('#msgEnv',zone).onclick=envoyer;
  champ.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();envoyer()} });

  charger().then(ok=>{
    if(!ok)return;
    // Interrogation reguliere plutot que temps reel : ouvrir les tables
    // au navigateur demonterait tout le controle des roles.
    const t=setInterval(charger,3000);
    fen.arret=()=>clearInterval(t);
  });
}

        ${(()=>{ const f=filDe(m).filter(x=>x.id!==m.id); return f.length?`

            <div class="lbl">Historique de la conversation (${f.length})</div>
            ${f.reverse().map(x=>`<details style="margin-top:9px;border:1px solid var(--bord);
              border-radius:9px;background:rgba(255,255,255,.03)">
              <summary style="padding:10px 13px;cursor:pointer;font-size:12.5px;color:var(--t2);

      if(rep)rep.onclick=()=>ecrire({a:[m.expediteur_adr],sujet:sujetReponse(m.sujet),

    };

    // « Re : » ne s empile pas : un fil de dix reponses donnerait
    // « Re : Re : Re : ... » et le sujet deviendrait illisible.
    const sujetReponse=s2=>{
      const t=String(s2||'').replace(/^\s*(re\s*:\s*)+/i,'').trim();
      return 'Re : '+(t||'(sans objet)');
    };
    // Le fil : tous les messages du meme sujet, du plus ancien au plus
    // recent. Sans identifiant de conversation, le sujet fait le lien.
    const filDe=m=>{
      const cle=sujetReponse(m.sujet).slice(5).toLowerCase();
      return mails.filter(x=>sujetReponse(x.sujet).slice(5).toLowerCase()===cle)
        .sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
    };

    const ecrire=async pre=>{
      const ann=await chargerAnnuaire();
      dlg({titre:'Nouveau message',ok:'Envoyer',corps:`

          value="${esc((pre&&pre.a||[]).join(', '))}">

          `<option value="${esc(a.adresse)}">${esc(a.nom)}${a.genre==='division'?' (division)':''}</option>`).join('')}</datalist>

        <label class="lbl" style="margin-top:14px">Objet</label>
        <input class="champ" id="mlS" value="${esc(pre&&pre.sujet||'')}">
        <label class="lbl" style="margin-top:14px">Message</label>
        <textarea class="champ" id="mlC" style="min-height:170px">${
          pre&&pre.cite
            ? '\n\n' + ('Le '+new Date(pre.cite.created_at).toLocaleString('fr-FR')+
               ', '+(pre.cite.expediteur_nom||pre.cite.expediteur_adr)+' a écrit :\n')+
              String(pre.cite.corps||'').split('\n').map(l=>'> '+l).join('\n')
            : ''}</textarea>
        <label class="lbl" style="margin-top:14px">Pièce jointe</label>
        <input type="file" class="champ" id="mlF" multiple style="padding:7px">
        <div style="font-size:11.5px;color:var(--t3);margin-top:5px">
          700 Ko au total : les pièces voyagent avec le message.</div>`,
        onOk:async v=>{
          const dest=$('#mlA',v).value.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
          if(!dest.length){avis('Aucun destinataire','','err');return false}
          const suj=$('#mlS',v).value.trim();
          if(!suj){avis('Objet manquant','','err');return false}
          const f=$('#mlF',v).files;
          const pieces=[];
          for(let i=0;i<Math.min(f.length,5);i++){
            const d=await new Promise(res=>{
              const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>res(null);
              fr.readAsDataURL(f[i]);
            });
            if(d)pieces.push({nom:f[i].name,type:f[i].type,donnee:d});
          }
          const r=await api('/api/bureau/mails',{method:'POST',
            body:{destinataires:dest,sujet:suj,corps:$('#mlC',v).value,pieces}});
          if(!r.ok){avis('Non envoyé',r.data.error||'','err');return false}
          avis('Message envoyé',dest.join(', '),'ok');
          if(boite==='envoyes')charger();
        }});
    };

    $('#mlNew',o.corps).onclick=()=>ecrire(null);
    $$('[data-b]',o.corps).forEach(b=>b.onclick=()=>{boite=b.dataset.b;majBoutons();charger()});
    majBoutons();charger();
    const t=setInterval(()=>{ if(boite==='recus')charger(); },15000);
    o.avantFermeture=()=>clearInterval(t);
  }});
}

// Les identifiants deja signales, pour ne pas reprevenir a chaque tour.
let MAILS_VUS=null;

async function veilleMail(){
  const r=await api('/api/bureau/mails?boite=recus');
  if(!r.ok)return;
  const recus=r.data.mails||[];
  const nonLus=recus.filter(m=>(m.lu_par||[]).indexOf(MOI.discord_id)===-1);
  MAILS_NON_LUS=nonLus.length;
  majBadgeMail();

  // Au premier tour on ne previent de rien : ce sont des mails deja la,
  // pas des arrivees. On note seulement ce qui existe.
  if(MAILS_VUS===null){ MAILS_VUS=new Set(recus.map(m=>m.id)); return; }

  const nouveaux=nonLus.filter(m=>!MAILS_VUS.has(m.id));
  // Trace volontaire : la veille est invisible quand elle marche, et
  // indiscernable d une panne quand personne n ecrit.
  console.log("[bureau] veille mail :",recus.length,"recus,",nonLus.length,"non lus,",nouveaux.length,"nouveau(x)");
  recus.forEach(m=>MAILS_VUS.add(m.id));
  if(!nouveaux.length)return;

  nouveaux.slice(0,3).forEach(m=>{
    const f=avis('✉️ '+(m.expediteur_nom||m.expediteur_adr),
      (m.sujet||'(sans objet)'),'', 12000);
    // Cliquer la notification ouvre la messagerie sur ce message.
    const n=$('#avis').lastElementChild;
    if(n){
      n.style.cursor='pointer';
      n.addEventListener('click',e=>{
        if(e.target.closest('.x'))return;
        f(); ouvrirMail();
      });
    }
  });
  if(nouveaux.length>3)avis('Et '+(nouveaux.length-3)+' autre(s) message(s)','','',8000);
  try{ new Audio('data:audio/wav;base64,UklGRl9vAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=').play(); }catch(e){}
}

/* ============================================================
   OUVERTURE DE SESSION
   Le travail est reellement fait pendant l'animation : chaque
   etape attend ce qu'elle annonce. On tient seulement chaque
   ligne assez longtemps pour qu'elle se lise, sinon la sequence
   defile trop vite pour vouloir dire quoi que ce soit.
   ============================================================ */
let SESSION_VUE=false;

const initiales=nom=>String(nom||'')
  .replace(/^\[[^\]]*\]\s*/,'')
  .split(/\s+/).filter(Boolean).slice(0,2)
  .map(m=>m[0]).join('').toUpperCase()||'??';

const matricule=nom=>{
  const m=String(nom||'').match(/^\[([^\]]+)\]/);
  return m?m[1].trim():null;
};

function ouvertureSession(moi,taches){
  return new Promise(resolve=>{
    const z=$('#ouverture');
    const mat=matricule(moi.nom);
    const propre=String(moi.nom||'').replace(/^\[[^\]]*\]\s*/,'');
    const role=moi.command_staff?'Command Staff'
      :moi.superviseur?'Supervisor Team'
      :moi.divisions.length?moi.divisions.map(d=>d.code).join(' · ')
      :'Agent';

    z.innerHTML=`
      <div class="ovAvatar">
        <div class="ovAnneau"></div>
        ${moi.avatar
          ? `<img src="${esc(moi.avatar)}" alt=""
               onerror="this.outerHTML='<div class=\\'init\\'>${esc(initiales(moi.nom))}</div>'">`
          : `<div class="init">${esc(initiales(moi.nom))}</div>`}
      </div>
      <div class="ovNom">${esc(propre)}</div>
      <div class="ovRole">${mat?'Matricule '+esc(mat)+' · ':''}${esc(role)}</div>
      <div class="ovAdr">${esc(moi.adresse)}</div>
      <div class="ovBarre"><i id="ovProg"></i></div>
      <div class="ovEtapes" id="ovEtapes">${taches.map((t,i)=>
        `<div class="ovEtape" data-e="${i}"><span class="marque">○</span><span>${esc(t.libelle)}</span></div>`
      ).join('')}</div>
      <div class="ovPasser">Cliquez pour passer</div>`;
    z.classList.add('on');
    z.classList.remove('fini','parte');

    let fini=false;
    const sortir=()=>{
      if(fini)return; fini=true;
      z.classList.add('fini');
      setTimeout(()=>{
        z.classList.add('parte');
        setTimeout(()=>{z.classList.remove('on','parte');resolve()},560);
      },260);
    };
    // Passer n'annule pas le chargement : il continue en arriere-plan,
    // seule l'attente visuelle est ecourtee.
    z.onclick=sortir;
    const clav=e=>{ if(e.key==='Enter'||e.key===' '||e.key==='Escape')sortir(); };
    document.addEventListener('keydown',clav,{once:true});

    (async()=>{
      const attendre=ms=>new Promise(r=>setTimeout(r,ms));
      // L avatar et le nom s installent d abord : c est ce qu on regarde,
      // les etapes ne viennent qu ensuite.
      await attendre(900);
      for(let i=0;i<taches.length;i++){
        if(fini)break;
        const ligne=$(`[data-e="${i}"]`,z);
        if(ligne)ligne.classList.add('vue');
        // Le vrai travail et le temps de lecture avancent ensemble : on
        // attend le plus lent des deux, jamais l'un puis l'autre.
        const t0=Date.now();
        try{ if(taches[i].faire)await taches[i].faire(); }catch(e){}
        const reste=Math.max(0,(taches[i].duree||380)-(Date.now()-t0));
        await attendre(reste);
        if(ligne){ ligne.classList.add('faite'); $('.marque',ligne).textContent='✓'; }
        const p=$('#ovProg',z);
        if(p)p.style.width=Math.round((i+1)/taches.length*100)+'%';
      }
      if(!fini)await new Promise(r=>setTimeout(r,700));
      document.removeEventListener('keydown',clav);
      sortir();
    })();
  });
}

  $('#btDemarrer').onclick=e=>{ e.stopPropagation(); menuDemarrer(); };

  document.addEventListener('keydown',e=>{ if(e.key==='Escape')fermerMenuDem(); });
  addEventListener('resize',()=>{ ICONES=[]; dessinerIcones(); });

  // Le bureau se règle au clic droit, comme un vrai poste.
  $('#bureau').addEventListener('contextmenu',e=>{
    if(e.target.closest('.wid'))return;   // le widget garde son menu natif
    e.preventDefault();
    menuBureau(e.clientX,e.clientY);
  });

}

const LOGO='assets/sasp-sud-logo.png';
function porte(etat,info){
  const g=$('#porte'), c=$('#pcard');
  if(!etat){g.classList.remove('on');return}
  g.classList.add('on');
  const v={
    chargement:()=>`<div class="tourne"></div><h2>Ouverture de session</h2>
      <p>Vérification de votre identité et de vos rôles Discord…</p>`,
    connexion:()=>`<img src="${LOGO}" alt="SASP"><h2>San Andreas State Police</h2>
      <p>Poste de travail réservé au personnel. Identifiez-vous avec Discord pour ouvrir votre session.</p>
      <button class="btn pri" id="pLog" style="width:100%;justify-content:center;padding:11px">
        Se connecter avec Discord</button>`,
    refus:()=>`<img src="${LOGO}" alt="SASP"><h2>Accès refusé</h2>
      <p>${esc((info&&info.message)||'Votre compte n\'a pas accès au poste de travail.')}</p>
      <button class="btn" id="pOut" style="width:100%;justify-content:center">Changer de compte</button>`,
    panne:()=>`<img src="${LOGO}" alt="SASP"><h2>Poste indisponible</h2>
      <p>${esc((info&&info.error)||'Le serveur n\'a pas répondu.')}</p>
      <button class="btn pri" id="pRetry" style="width:100%;justify-content:center">Réessayer</button>`
  };
  c.innerHTML=v[etat]();
  const b=$('#pLog',c);
  if(b)b.onclick=async()=>{
    b.disabled=true;b.textContent='Redirection…';
    await SB.auth.signInWithOAuth({provider:'discord',
      options:{redirectTo:location.href.split('#')[0].split('?')[0]}});
  };
  const rt=$('#pRetry',c); if(rt)rt.onclick=()=>demarrer();
  const so=$('#pOut',c); if(so)so.onclick=async()=>{
    try{await SB.auth.signOut()}catch(e){} location.reload(); };
}

async function demarrer(){
  porte('chargement');
  if(!SB)SB=supabase.createClient(SUPABASE_URL,SUPABASE_ANON,
    {auth:{detectSessionInUrl:true,flowType:'pkce'}});
  try{ const {data}=await SB.auth.getSession(); SESSION=data.session; }catch(e){ SESSION=null; }
  if(!SESSION){porte('connexion');return}

  const r=await api('/api/bureau/moi');
  if(r.statut===401){porte('connexion');return}
  if(r.statut===403){porte('refus',r.data);return}
  if(!r.ok){porte('panne',r.data);return}

  MOI=r.data;
  porte(null);

  // La sequence ne se rejoue pas sur un simple reessai : elle marque
  // l arrivee sur le poste, pas chaque rechargement de donnees.
  if(!SESSION_VUE){
    SESSION_VUE=true;
    await ouvertureSession(MOI,[
      {libelle:"Identite verifiee aupres de Discord",duree:820},
      {libelle:"Roles et divisions charges",duree:780,
       faire:async()=>{ construireBureau(); }},
      {libelle:"Messagerie interrogee",duree:800,faire:veilleMail},
      {libelle:"Annonces de l etat-major",duree:760,faire:async()=>{ annonces(); }},
      {libelle:"Poste de travail pret",duree:640}
    ]);
  }else{
    construireBureau();
    annonces();
    veilleMail();
  }
  setInterval(veilleMail,25000);
}
